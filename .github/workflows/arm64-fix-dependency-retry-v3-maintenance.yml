name: ARM64 port - fix dependency retry repository identity wiring

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-dependency-retry-v3-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-dependency-retry-v3
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dependency retry controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Correct repository lock and Packages hash paths
        shell: bash
        run: |
          set -euxo pipefail
          workflow=.github/workflows/arm64-dependency-retry-controller-v3.yml
          test -f "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arm64-dependency-retry-controller-v3.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '--dependency-repository work/dependency-repo-v3/summary.json',
              '--dependency-repository work/dependency-repo-v3/dependency-repository-lock.json',
          )
          text = text.replace(
              "jq -r '.summary.packages_sha256 // empty' \\",
              "jq -r '.packages_sha256 // empty' \\",
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -F -- '--dependency-repository work/dependency-repo-v3/dependency-repository-lock.json' "$workflow"
          grep -F -- "jq -r '.packages_sha256 // empty'" "$workflow"
          git rm -f .github/workflows/arm64-fix-dependency-retry-v3-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Fix dependency retry repository identity wiring'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Re-run exact dependency retry controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-dependency-retry-controller-v3.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port \
            -f limit=4
