name: ARM64 observe session manager dynsym v3 build once

on:
  workflow_dispatch:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-observe-session-manager-dynsym-v3-once.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: arm64-observe-session-manager-dynsym-v3-once
  cancel-in-progress: false

env:
  BRANCH: arm64-port
  TRIGGER_SHA: 9d35c7f0b189f780b532045a0b0d1b85572d5456
  TARGET_WORKFLOW: .github/workflows/arm64-build-session-manager-han3u2-dynsym-v3.yml
  TARGET_WORKFLOW_NAME: arm64-build-session-manager-han3u2-dynsym-v3.yml
  PACKAGE_AUTHORITY: arm64/locks/gooroom-session-manager-han3u2-arm64-build/latest/package-promotion-authority.json
  STATUS_DIR: arm64/status/gooroom-session-manager-han3u2-arm64-build-observer/latest

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out ARM64 authority branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Record observer start
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$STATUS_DIR"
          jq -n \
            --arg state started \
            --arg observer_run_id "$GITHUB_RUN_ID" \
            --arg observer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg trigger_sha "$TRIGGER_SHA" \
            --arg target_workflow "$TARGET_WORKFLOW" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: 1,
              state: $state,
              observer_run_id: $observer_run_id,
              observer_run_attempt: $observer_run_attempt,
              trigger_sha: $trigger_sha,
              target_workflow: $target_workflow,
              started_at: $started_at
            }' > "$STATUS_DIR/status.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$STATUS_DIR/status.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record session-manager dynsym v3 build observer start'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Locate target build run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/session-manager-dynsym-v3-observer
          mkdir -p work/session-manager-dynsym-v3-observer

          run='null'
          run_id=''
          for attempt in $(seq 1 120); do
            payload="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW_NAME}/runs?branch=${BRANCH}&event=push&per_page=100"
            )"
            run="$(
              jq -c --arg trigger "$TRIGGER_SHA" '
                [
                  .workflow_runs[]
                  | select(.head_sha == $trigger)
                  | select(.path == ".github/workflows/arm64-build-session-manager-han3u2-dynsym-v3.yml")
                ]
                | sort_by(.id)
                | last // null
              ' <<<"$payload"
            )"
            run_id="$(jq -r '.id // empty' <<<"$run")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"

          printf '%s\n' "$run" \
            > work/session-manager-dynsym-v3-observer/target-run-discovered.json
          printf '%s\n' "$run_id" \
            > work/session-manager-dynsym-v3-observer/target-run-id.txt
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for target build and collect evidence
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.locate.outputs.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root=work/session-manager-dynsym-v3-observer
          run='null'
          for attempt in $(seq 1 600); do
            run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}")"
            printf '%s\n' "$run" > "$root/target-run-live.json"
            if [[ "$(jq -r '.status' <<<"$run")" == completed ]]; then
              break
            fi
            sleep 12
          done
          test "$(jq -r '.status' <<<"$run")" = completed

          printf '%s\n' "$run" > "$root/target-run.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" \
            > "$root/target-jobs.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100" \
            > "$root/target-artifacts.json"

          echo "conclusion=$(jq -r '.conclusion // "unknown"' <<<"$run")" \
            >> "$GITHUB_OUTPUT"

      - name: Seal observer result
        if: always()
        env:
          TARGET_RUN_ID: ${{ steps.locate.outputs.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p "$STATUS_DIR"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          work = Path('work/session-manager-dynsym-v3-observer')
          status_dir = Path(os.environ['STATUS_DIR'])
          package_authority_path = Path(os.environ['PACKAGE_AUTHORITY'])

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  return None

          target_run = load(work / 'target-run.json') or load(
              work / 'target-run-discovered.json'
          )
          jobs_payload = load(work / 'target-jobs.json') or {}
          artifacts_payload = load(work / 'target-artifacts.json') or {}
          package_authority = load(package_authority_path)

          failed_steps = []
          jobs = []
          for job in jobs_payload.get('jobs', []):
              compact = {
                  'id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'failed_steps': [],
              }
              for step in job.get('steps') or []:
                  if step.get('conclusion') == 'failure':
                      row = {
                          'number': step.get('number'),
                          'name': step.get('name'),
                      }
                      compact['failed_steps'].append(row)
                      failed_steps.append({
                          'job_id': job.get('id'),
                          'job': job.get('name'),
                          **row,
                      })
              jobs.append(compact)

          promotion_allowed = bool(
              package_authority
              and package_authority.get('source') == 'gooroom-session-manager'
              and package_authority.get('source_version') == '0.3.9+grm3u1+han3u2'
              and package_authority.get('target_architecture') == 'arm64'
              and package_authority.get('native_arm64_build_verified') is True
              and package_authority.get('foreign_elf_count') == 0
              and package_authority.get('package_layer_promotion_allowed') is True
              and (package_authority.get('artifact') or {}).get('expired') is False
          )

          report = {
              'schema': 1,
              'state': 'completed',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'observer_run_id': os.environ.get('GITHUB_RUN_ID'),
              'observer_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'branch': os.environ['BRANCH'],
              'trigger_sha': os.environ['TRIGGER_SHA'],
              'branch_head_before_record': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'target_workflow': os.environ['TARGET_WORKFLOW'],
              'target_run_id': os.environ.get('TARGET_RUN_ID') or (
                  str(target_run.get('id')) if target_run else None
              ),
              'target_run': {
                  key: target_run.get(key)
                  for key in (
                      'id', 'name', 'path', 'event', 'status', 'conclusion',
                      'head_branch', 'head_sha', 'run_attempt', 'created_at',
                      'updated_at', 'html_url'
                  )
              } if target_run else None,
              'jobs': jobs,
              'failed_steps': failed_steps,
              'artifacts': [
                  {
                      key: artifact.get(key)
                      for key in (
                          'id', 'name', 'size_in_bytes', 'digest', 'expired'
                      )
                  }
                  for artifact in artifacts_payload.get('artifacts', [])
              ],
              'package_authority_path': str(package_authority_path),
              'package_authority_present': package_authority is not None,
              'package_layer_promotion_allowed': promotion_allowed,
              'package_artifact': (
                  package_authority.get('artifact') if package_authority else None
              ),
              'packages': (
                  package_authority.get('packages') if package_authority else []
              ),
          }

          status_dir.mkdir(parents=True, exist_ok=True)
          (status_dir / 'status.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          (
            cd "$STATUS_DIR"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$STATUS_DIR"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record session-manager dynsym v3 native build result'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce successful verified package promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .target_run.status == "completed" and
            .target_run.conclusion == "success" and
            .package_authority_present == true and
            .package_layer_promotion_allowed == true
          ' "$STATUS_DIR/status.json" >/dev/null
