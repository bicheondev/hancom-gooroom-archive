name: ARM64 port - wire explicit progress dispatch chain

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-chain-progress-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-progress-chain-maintenance
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out all active workflows
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Add explicit downstream dispatches and backlog chaining
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def ensure_actions_write(text: str) -> str:
              match = re.search(r'(?m)^permissions:\n((?:  [^\n]+\n)+)', text)
              if not match:
                  raise SystemExit('workflow has no permissions block')
              block = match.group(1)
              lines = block.splitlines()
              output = []
              found = False
              for line in lines:
                  if line.startswith('  actions:'):
                      output.append('  actions: write')
                      found = True
                  else:
                      output.append(line)
              if not found:
                  output.append('  actions: write')
              replacement = 'permissions:\n' + '\n'.join(output) + '\n'
              return text[:match.start()] + replacement + text[match.end():]

          def append_step(filename: str, marker: str, step: str) -> None:
              path = Path('.github/workflows') / filename
              if not path.exists():
                  raise SystemExit(f'missing workflow: {path}')
              text = ensure_actions_write(path.read_text(encoding='utf-8'))
              if marker not in text:
                  text = text.rstrip() + '\n\n' + step.strip('\n') + '\n'
              path.write_text(text, encoding='utf-8')

          dispatch_function = r'''
          dispatch() {
            local workflow="$1"
            shift
            for attempt in 1 2 3 4; do
              if gh workflow run "$workflow" \
                --repo '${{ github.repository }}' \
                --ref arm64-port "$@"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          '''

          append_step(
              'arm64-native-rebuild-backlog.yml',
              'Continue the unattempted rebuild backlog explicitly',
              r'''
      - name: Continue the unattempted rebuild backlog explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          passed=0
          if [ -f work/rebuild-results/summary.json ]; then
            passed="$(jq -r '.passed_count // 0' work/rebuild-results/summary.json)"
          fi
          if [ "$passed" -gt 0 ]; then
            dispatch arm64-publish-rebuild-packages.yml
          fi

          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          lock=arm64/locks/sources-api-baseline/source-lock.json
          if [ -f arm64/locks/effective-sources/effective-source-lock.json ]; then
            lock=arm64/locks/effective-sources/effective-source-lock.json
          fi
          python3 arm64/scripts/select_next_native_rebuild_wave.py \
            --lock "$lock" \
            --reference arm64/locks/reference/amd64-reference.json \
            --plan arm64/rebuild-batches.json \
            --results arm64/locks/rebuild-results \
            --limit 6 \
            --output work/next-native-rebuild-wave.json
          if [ "$(jq -r '.summary.selected_count' work/next-native-rebuild-wave.json)" -gt 0 ]; then
            dispatch arm64-native-rebuild-backlog.yml -f limit=6
          fi
          dispatch arm64-port-coverage.yml || true
''',
          )

          append_step(
              'arm64-baseline-rebuild-evidence.yml',
              'Publish newly reverified baseline packages explicitly',
              r'''
      - name: Publish newly reverified baseline packages explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/rebuild-results/summary.json ] \
             && [ "$(jq -r '.passed_count // 0' work/rebuild-results/summary.json)" -gt 0 ]; then
            dispatch arm64-publish-rebuild-packages.yml
          fi
          dispatch arm64-port-coverage.yml || true
''',
          )

          append_step(
              'arm64-native-rebuild-batch-v2.yml',
              'Publish newly completed curated batch packages explicitly',
              r'''
      - name: Publish newly completed curated batch packages explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/rebuild-results/summary.json ] \
             && [ "$(jq -r '.passed_count // 0' work/rebuild-results/summary.json)" -gt 0 ]; then
            dispatch arm64-publish-rebuild-packages.yml
          fi
          dispatch arm64-port-coverage.yml || true
''',
          )

          append_step(
              'arm64-dependency-retry-v2.yml',
              'Publish packages recovered by dependency retries explicitly',
              r'''
      - name: Publish packages recovered by dependency retries explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/rebuild-results/summary.json ] \
             && [ "$(jq -r '.passed_count // 0' work/rebuild-results/summary.json)" -gt 0 ]; then
            dispatch arm64-publish-rebuild-packages.yml
          fi
          dispatch arm64-port-coverage.yml || true
''',
          )

          append_step(
              'arm64-publish-rebuild-packages.yml',
              'Dispatch package-cache consumers explicitly',
              r'''
      - name: Dispatch package-cache consumers explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/rebuild-release/summary.json ] \
             && jq -e '.complete == true' work/rebuild-release/summary.json >/dev/null; then
            dispatch arm64-dependency-retry-v2.yml -f limit=4
            dispatch arm64-package-acquisition-plan-v2.yml
          fi
          dispatch arm64-port-coverage.yml || true
''',
          )

          append_step(
              'arm64-package-acquisition-plan-v2.yml',
              'Dispatch exact rootfs construction explicitly when ready',
              r'''
      - name: Dispatch exact rootfs construction explicitly when ready
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/acquisition-plan/summary.json ] \
             && jq -e '.ready_for_fetch == true' work/acquisition-plan/summary.json >/dev/null; then
            dispatch arm64-exact-rootfs-v2.yml
          fi
''',
          )

          append_step(
              'arm64-exact-rootfs-v2.yml',
              'Dispatch final ISO construction explicitly after rootfs lock',
              r'''
      - name: Dispatch final ISO construction explicitly after rootfs lock
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          jq -e '.summary.passed == true' work/rootfs-evidence/verification.json
          test -f work/rootfs-evidence/artifact-lock.json
          dispatch arm64-final-live-iso.yml
''',
          )

          append_step(
              'arm64-normalize-package-map.yml',
              'Dispatch acquisition planning after map normalization',
              r'''
      - name: Dispatch acquisition planning after map normalization
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/normalized-package-map/summary.json ] \
             && jq -e '.complete == true' work/normalized-package-map/summary.json >/dev/null; then
            dispatch arm64-package-acquisition-plan-v2.yml
          fi
''',
          )

          append_step(
              'arm64-source-lock.yml',
              'Dispatch effective source authority merge explicitly',
              r'''
      - name: Dispatch effective source authority merge explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/source-lock/source-lock.json ]; then
            dispatch arm64-effective-source-lock.yml
          fi
''',
          )

          append_step(
              'arm64-effective-source-lock.yml',
              'Dispatch exact source consumers explicitly',
              r'''
      - name: Dispatch exact source consumers explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
''' + dispatch_function + r'''
          if [ -f work/effective-source-lock/effective-source-lock.json ]; then
            dispatch arm64-baseline-rebuild-evidence.yml
            dispatch arm64-native-rebuild-backlog.yml -f limit=6
            dispatch arm64-port-coverage.yml
          fi
''',
          )
          PY

          git rm -f .github/workflows/arm64-chain-progress-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Wire explicit Hancom Gooroom ARM64 progress dispatch chain'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Reaudit and resume the normalized pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-active-pipeline-audit.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-pipeline-lint.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-effective-source-lock.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-native-rebuild-backlog.yml \
            --repo '${{ github.repository }}' --ref arm64-port -f limit=6 || true
