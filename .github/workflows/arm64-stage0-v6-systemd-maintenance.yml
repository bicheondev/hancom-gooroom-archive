name: ARM64 port - make stage0 v6 systemd setup chroot safe

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-stage0-v6-systemd-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-stage0-v6-systemd-maintenance
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Replace runtime systemctl call with deterministic symlinks
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('arm64/scripts/build_stage0_v6.py')
          text=path.read_text(encoding='utf-8')
          old='''ln -sfn ../hancom-gooroom-stage0-marker.service \\
  /etc/systemd/system/graphical.target.wants/hancom-gooroom-stage0-marker.service
systemctl set-default graphical.target
'''
          new='''ln -sfn ../hancom-gooroom-stage0-marker.service \\
  /etc/systemd/system/graphical.target.wants/hancom-gooroom-stage0-marker.service
ln -sfn /lib/systemd/system/graphical.target /etc/systemd/system/default.target
if [ -f /lib/systemd/system/gdm3.service ]; then
  ln -sfn /lib/systemd/system/gdm3.service /etc/systemd/system/display-manager.service
fi
'''
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('systemd target marker not found')
          path.write_text(text,encoding='utf-8')
          PY
          python3 -m py_compile arm64/scripts/build_stage0_v6.py
          git rm -f .github/workflows/arm64-stage0-v6-systemd-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_stage0_v6.py
          git commit -m 'Configure stage0 v6 graphical target without runtime systemctl'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
