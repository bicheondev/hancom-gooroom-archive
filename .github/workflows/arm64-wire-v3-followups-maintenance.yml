name: ARM64 port - wire v3 rebuild follow-up controllers

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-wire-v3-followups-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-wire-v3-followups
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out all active ARM64 controllers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Point every active follow-up at source-authority-aware controllers
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'arm64-rebuild-failure-audit.yml': 'arm64-rebuild-failure-audit-v3.yml',
              'arm64-port-coverage.yml': 'arm64-port-coverage-v2.yml',
              'arm64-dependency-retry-v2.yml': 'arm64-dependency-retry-controller-v3.yml',
              'arm64-package-acquisition-plan-v2.yml': 'arm64-package-acquisition-plan-v3.yml',
          }
          for path in sorted(Path('.github/workflows').glob('arm64-*.yml')):
              if path.name == 'arm64-wire-v3-followups-maintenance.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          grep -R --line-number --fixed-strings 'arm64-rebuild-failure-audit.yml' \
            .github/workflows/arm64-*.yml && exit 1 || true
          grep -R --line-number --fixed-strings 'arm64-port-coverage.yml' \
            .github/workflows/arm64-*.yml && exit 1 || true
          grep -R --line-number --fixed-strings 'arm64-dependency-retry-v2.yml' \
            .github/workflows/arm64-*.yml && exit 1 || true
          grep -R --line-number --fixed-strings 'arm64-package-acquisition-plan-v2.yml' \
            .github/workflows/arm64-*.yml && exit 1 || true

      - name: Remove the one-shot wiring workflow and commit the active graph
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/arm64-wire-v3-followups-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Wire exact-source ARM64 v3 follow-up controllers'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Dispatch the authoritative status and retry controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-rebuild-failure-audit-v3.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-port-coverage-v2.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-publish-rebuild-packages-v3.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-package-acquisition-plan-v3.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
