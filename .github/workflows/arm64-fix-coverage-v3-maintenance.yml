name: ARM64 port - enforce conservative phase coverage v3

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-coverage-v3-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-port-coverage
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out coverage controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Upgrade coverage to explicit final phase gates
        shell: bash
        run: |
          set -euxo pipefail
          workflow=.github/workflows/arm64-port-coverage-v2.yml
          test -f "$workflow"
          sed -i \
            's#arm64/scripts/summarize_arm64_port_coverage_v2.py#arm64/scripts/summarize_arm64_port_coverage_v3.py#g' \
            "$workflow"
          if ! grep -Fq "arm64/scripts/summarize_arm64_port_coverage_v3.py" "$workflow"; then
            exit 1
          fi
          git rm -f .github/workflows/arm64-fix-coverage-v3-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Use conservative explicit ARM64 phase coverage gates'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Re-run non-inflated coverage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-port-coverage-v2.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port
