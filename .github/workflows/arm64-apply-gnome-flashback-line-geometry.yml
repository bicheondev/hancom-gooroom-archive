name: ARM64 prepare - validated gnome-flashback workflow blob

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-apply-gnome-flashback-line-geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-prepare-gnome-flashback-workflow-blob
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Create and verify the exact main-workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git pull --rebase origin arm64-port
          workflow=.github/workflows/arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml
          script=arm64/scripts/reconstruct_gnome_flashback_han3u4.py

          test "$(sha256sum "$script" | awk '{print $1}')" \
            = f58b7ff3053c14c5eb67c7618ab0538730815ecde0662da21aa095087f867e6e
          test "$(grep -Fc 'and (.unique_reconstruction.changed_paths | length) == 4' "$workflow")" -eq 1
          sed -i \
            's/and (.unique_reconstruction.changed_paths | length) == 4/and (.unique_reconstruction.changed_paths | length) == 5/' \
            "$workflow"
          test "$(grep -Fc 'and (.unique_reconstruction.changed_paths | length) == 5' "$workflow")" -eq 1
          git diff --check -- "$workflow"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          path = Path('.github/workflows/arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml')
          payload = path.read_bytes()
          git_sha = hashlib.sha1(
              f'blob {len(payload)}\0'.encode('ascii') + payload
          ).hexdigest()
          metadata = {
              'path': str(path),
              'size': len(payload),
              'sha256': hashlib.sha256(payload).hexdigest(),
              'expected_git_blob_sha1': git_sha,
          }
          Path('workflow-blob-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          jq -n --rawfile content "$workflow" \
            '{content: $content, encoding: "utf-8"}' \
            > workflow-blob-request.json
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --input workflow-blob-request.json \
            > workflow-blob-response.json
          blob_sha="$(jq -er '.sha' workflow-blob-response.json)"
          expected_sha="$(jq -er '.expected_git_blob_sha1' workflow-blob-metadata.json)"
          test "$blob_sha" = "$expected_sha"
          jq --arg blob_sha "$blob_sha" '. + {blob_sha: $blob_sha}' \
            workflow-blob-metadata.json > workflow-blob-result.json
          echo "WORKFLOW_BLOB_SHA=$blob_sha"
          cat workflow-blob-result.json

      - name: Upload the verified blob metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnome-flashback-main-workflow-blob-${{ github.run_id }}
          path: |
            workflow-blob-result.json
            workflow-blob-response.json
          if-no-files-found: error
          retention-days: 7
