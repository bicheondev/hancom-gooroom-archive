name: ARM64 port - fix exact artifact recovery filter

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-recovery-exact-artifact-filter.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-fix-recovery-exact-artifact-filter
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out ARM64 port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Admit verified exact ARM64 package artifacts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-recover-exact-package-pool.yml')
          text = path.read_text(encoding='utf-8')
          old = """          package_evidence = (\n              'package', 'rebuild', 'repo', 'reference', 'historical',\n              'vendor', 'p7zip', 'accountsservice', 'wave',\n              'arch-replacements',\n          )\n"""
          new = """          package_evidence = (\n              'package', 'rebuild', 'repo', 'reference', 'historical',\n              'vendor', 'p7zip', 'accountsservice', 'wave',\n              'arch-replacements', 'exact-arm64',\n          )\n"""

          if new in text and old not in text:
              print('exact ARM64 artifact filter is already fixed')
          else:
              if text.count(old) != 1:
                  raise SystemExit(
                      f'expected one package_evidence anchor, found {text.count(old)}'
                  )
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          positive = (
              'arm64', 'aarch64', 'package', 'rebuild', 'reference',
              'historical', 'vendor', 'debian', 'p7zip', 'accountsservice',
              'wave', 'repo', 'arch-replacements',
          )
          package_evidence = (
              'package', 'rebuild', 'repo', 'reference', 'historical',
              'vendor', 'p7zip', 'accountsservice', 'wave',
              'arch-replacements', 'exact-arm64',
          )
          large_non_package = ('iso', 'rootfs')

          def selected(name: str) -> bool:
              name = name.lower()
              if not any(token in name for token in positive):
                  return False
              if not any(token in name for token in package_evidence):
                  return False
              if (
                  any(token in name for token in large_non_package)
                  and not any(
                      token in name
                      for token in ('package', 'rebuild', 'repo', 'arch-replacements')
                  )
              ):
                  return False
              return True

          assert selected('gooroom-security-status-tools-exact-arm64')
          assert selected('gooroom-libsecurity-extensions-exact-arm64')
          assert not selected('hancom-gooroom-final-rootfs-exact-arm64')
          assert not selected('hancom-gooroom-final-iso-exact-arm64')
          assert selected('exact-package-rebuild-arm64')
          print('artifact selection fixtures passed')
          PY

          git diff --check
          grep -F "'arch-replacements', 'exact-arm64'," \
            .github/workflows/arm64-recover-exact-package-pool.yml

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arm64-fix-recovery-exact-artifact-filter.yml
          git add .github/workflows/arm64-recover-exact-package-pool.yml
          git commit -m 'Recover verified exact ARM64 package artifacts'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch refreshed exact package recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run arm64-recover-exact-package-pool.yml \
              --repo '${{ github.repository }}' \
              --ref arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
