name: ARM64 analyze integration applet han3u3 reconstruction v2

on:
  workflow_dispatch:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-analyze-integration-applet-han3u3-reconstruction-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: arm64-analyze-integration-applet-han3u3-reconstruction-v2
  cancel-in-progress: false

env:
  SOURCE: gooroom-integration-applet
  VERSION: 0.3.1+grm3u1+han3u3
  BASE_REPOSITORY: gooroom/gooroom-integration-applet
  BASE_COMMIT: 168ff81421ea1f5bae9e715c5ccdd559e015d44c
  BASE_TREE: bfe05561e97c72e01b7ce2f052f38be2c0a59d3a
  SNAPSHOT: 20230730T235959Z
  TARGET_URL: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-integration-applet/gooroom-integration-applet_0.3.1+grm3u1+han3u3_amd64.deb
  DEBUG_URL: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-integration-applet/gooroom-integration-applet-dbgsym_0.3.1+grm3u1+han3u3_amd64.deb
  LOCK_DIR: arm64/locks/gooroom-integration-applet-han3u3-reconstruction-v2/latest

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out ARM64 authority branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install historical build and binary analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates curl debootstrap debian-archive-keyring \
            diffutils dpkg-dev elfutils file gettext git jq python3 tar xz-utils

      - name: Reconstruct source from public merged lineage and exact vendor payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work/{downloads,reconstructed,source-authority,build,comparison,artifact}

          git clone --filter=blob:none --no-checkout \
            "https://github.com/${BASE_REPOSITORY}.git" work/reconstructed/source
          git -C work/reconstructed/source fetch --depth=1 origin "$BASE_COMMIT"
          git -C work/reconstructed/source checkout --detach "$BASE_COMMIT"
          test "$(git -C work/reconstructed/source rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git -C work/reconstructed/source rev-parse HEAD^{tree})" = "$BASE_TREE"

          curl --fail --show-error --location --retry 8 --retry-delay 3 \
            --retry-all-errors "$TARGET_URL" -o work/downloads/target.deb
          test "$(dpkg-deb -f work/downloads/target.deb Package)" = "$SOURCE"
          test "$(dpkg-deb -f work/downloads/target.deb Version)" = "$VERSION"
          test "$(dpkg-deb -f work/downloads/target.deb Architecture)" = amd64
          mkdir -p work/downloads/target-root
          dpkg-deb -x work/downloads/target.deb work/downloads/target-root

          debug_available=false
          if curl --fail --show-error --location --retry 4 --retry-delay 3 \
            --retry-all-errors "$DEBUG_URL" -o work/downloads/target-dbgsym.deb; then
            test "$(dpkg-deb -f work/downloads/target-dbgsym.deb Version)" = "$VERSION"
            test "$(dpkg-deb -f work/downloads/target-dbgsym.deb Architecture)" = amd64
            debug_available=true
          else
            rm -f work/downloads/target-dbgsym.deb
          fi
          printf '%s\n' "$debug_available" > work/source-authority/vendor-dbgsym-available.txt

          changelog="$(find work/downloads/target-root/usr/share/doc -type f -name changelog.gz -print -quit)"
          test -n "$changelog"
          gzip -dc "$changelog" > work/reconstructed/source/debian/changelog
          test "$(dpkg-parsechangelog -lwork/reconstructed/source/debian/changelog -SVersion)" = "$VERSION"

          while IFS= read -r icon; do
            name="$(basename "$icon")"
            test -f "work/reconstructed/source/icons/$name"
            cp "$icon" "work/reconstructed/source/icons/$name"
          done < <(find work/downloads/target-root/usr/share/icons/hicolor/scalable -type f -name '*.svg' | LC_ALL=C sort)

          for locale in en_GB ko; do
            mo="work/downloads/target-root/usr/share/locale/$locale/LC_MESSAGES/${SOURCE}.mo"
            test -f "$mo"
            msgunfmt "$mo" -o "work/reconstructed/source/po/$locale.po"
            msgfmt --check --check-compatibility \
              "work/reconstructed/source/po/$locale.po" \
              -o "work/reconstructed/source/po/$locale.recompiled.mo"
            cmp "$mo" "work/reconstructed/source/po/$locale.recompiled.mo"
            rm "work/reconstructed/source/po/$locale.recompiled.mo"
          done

          git -C work/reconstructed/source diff --binary --full-index \
            > work/source-authority/reconstruction.patch
          test -s work/source-authority/reconstruction.patch
          git -C work/reconstructed/source add -A
          reconstructed_tree="$(git -C work/reconstructed/source write-tree)"
          git -C work/reconstructed/source archive --format=tar "$reconstructed_tree" \
            > work/source-authority/reconstructed-source.tar
          xz -9e work/source-authority/reconstructed-source.tar

          source_date_epoch="$(date -u -d "$(dpkg-parsechangelog -lwork/reconstructed/source/debian/changelog -SDate)" +%s)"
          jq -n \
            --arg source "$SOURCE" --arg version "$VERSION" \
            --arg repository "$BASE_REPOSITORY" \
            --arg base_commit "$BASE_COMMIT" --arg base_tree "$BASE_TREE" \
            --arg reconstructed_tree "$reconstructed_tree" \
            --arg source_date_epoch "$source_date_epoch" \
            --arg patch_sha256 "$(sha256sum work/source-authority/reconstruction.patch | awk '{print $1}')" \
            --arg archive_sha256 "$(sha256sum work/source-authority/reconstructed-source.tar.xz | awk '{print $1}')" \
            --arg target_sha256 "$(sha256sum work/downloads/target.deb | awk '{print $1}')" \
            --argjson icon_count "$(find work/downloads/target-root/usr/share/icons/hicolor/scalable -type f -name '*.svg' | wc -l)" \
            --argjson dbgsym_available "$debug_available" '
              {schema:1,source:$source,version:$version,
               reconstruction_policy:"public-gooroom-3.0-merged-lineage-plus-exact-vendor-changelog-icons-and-translation-catalogs",
               base_repository:$repository,base_commit_sha:$base_commit,base_tree_sha:$base_tree,
               reconstructed_tree_sha:$reconstructed_tree,
               source_date_epoch:($source_date_epoch|tonumber),
               reconstruction_patch_sha256:$patch_sha256,
               source_archive_sha256:$archive_sha256,
               target_deb_sha256:$target_sha256,
               recovered_vendor_icon_count:$icon_count,
               recovered_vendor_locales:["en_GB","ko"],
               vendor_dbgsym_available:$dbgsym_available}
            ' > work/source-authority/source-lock.json

      - name: Build reconstructed AMD64 candidate in historical Debian rootfs
        shell: bash
        run: |
          set -euxo pipefail
          base="$(pwd)/work"
          rootfs="$base/build/rootfs"
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=ca-certificates \
            --no-check-gpg \
            bullseye "$rootfs" \
            "https://snapshot.debian.org/archive/debian/$SNAPSHOT/" \
            2>&1 | tee "$base/build/debootstrap.log"
          printf '%s\n' \
            "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/$SNAPSHOT bullseye main contrib non-free" \
            | sudo tee "$rootfs/etc/apt/sources.list" >/dev/null
          printf '%s\n' \
            'Acquire::Check-Valid-Until "false";' \
            'Acquire::Retries "8";' \
            'Dpkg::Use-Pty "0";' \
            | sudo tee "$rootfs/etc/apt/apt.conf.d/99snapshot" >/dev/null
          sudo cp /etc/resolv.conf "$rootfs/etc/resolv.conf"
          sudo mkdir -p "$rootfs/build/source"
          sudo tar -xJf "$base/source-authority/reconstructed-source.tar.xz" \
            -C "$rootfs/build/source"
          source_date_epoch="$(jq -r '.source_date_epoch' "$base/source-authority/source-lock.json")"
          sudo chroot "$rootfs" /bin/bash -euxo pipefail -c "
            export DEBIAN_FRONTEND=noninteractive
            export DEB_BUILD_OPTIONS=nocheck
            export DEB_BUILD_MAINT_OPTIONS='hardening=+all reproducible=+fixfilepath'
            export SOURCE_DATE_EPOCH='$source_date_epoch'
            export LC_ALL=C.UTF-8
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential devscripts dpkg-dev equivs git
            cd /build/source
            mk-build-deps --install --remove \
              --tool 'apt-get -o Acquire::Retries=8 -y --no-install-recommends' \
              debian/control
            dpkg-buildpackage -us -uc -b -j2
          " 2>&1 | tee "$base/build/build.log"
          mkdir -p "$base/build/debs"
          while IFS= read -r deb; do
            sudo cp "$deb" "$base/build/debs/"
          done < <(sudo find "$rootfs/build" -maxdepth 1 -type f -name '*.deb' | LC_ALL=C sort)
          sudo chown -R "$(id -u):$(id -g)" "$base/build"
          for deb in "$base/build/debs"/*.deb; do
            if [[ "$(dpkg-deb -f "$deb" Package)" == "$SOURCE" ]]; then
              cp "$deb" "$base/downloads/candidate.deb"
            fi
          done
          test -f "$base/downloads/candidate.deb"
          test "$(dpkg-deb -f "$base/downloads/candidate.deb Version)" = "$VERSION"
          test "$(dpkg-deb -f "$base/downloads/candidate.deb Architecture)" = amd64
          rm -rf "$rootfs"

      - name: Compare complete payload and allocated ELF sections
        shell: bash
        run: |
          set -euxo pipefail
          base=work
          for side in target candidate; do
            mkdir -p "$base/comparison/$side/root"
            dpkg-deb -x "$base/downloads/$side.deb" "$base/comparison/$side/root"
            dpkg-deb -e "$base/downloads/$side.deb" "$base/comparison/$side/control"
            dpkg-deb -f "$base/downloads/$side.deb" > "$base/comparison/$side/control-fields.txt"
          done

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          base = Path('work')
          source = os.environ['SOURCE']
          version = os.environ['VERSION']

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          def is_elf(path: Path) -> bool:
              with path.open('rb') as stream:
                  return stream.read(4) == b'\x7fELF'

          def command(*args: str) -> str:
              return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT)

          def build_id(path: Path) -> str | None:
              text = command('readelf', '-nW', str(path))
              match = re.search(r'Build ID: ([0-9a-f]+)', text)
              return match.group(1) if match else None

          def allocated_sections(path: Path) -> dict[str, dict]:
              text = command('readelf', '-SW', str(path))
              names = []
              for line in text.splitlines():
                  match = re.match(
                      r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\S+)',
                      line,
                  )
                  if not match:
                      continue
                  name, flags = match.groups()
                  if 'A' not in flags:
                      continue
                  if name in {'.note.gnu.build-id'}:
                      continue
                  names.append(name)
              result = {}
              with tempfile.TemporaryDirectory() as tmp:
                  tmp_path = Path(tmp)
                  for index, name in enumerate(names):
                      output = tmp_path / f'{index:04d}.bin'
                      proc = subprocess.run(
                          ['objcopy', f'--dump-section', f'{name}={output}', str(path)],
                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                      )
                      if proc.returncode != 0 or not output.exists():
                          result[name] = {'error': proc.stderr.strip()}
                      else:
                          result[name] = {
                              'size': output.stat().st_size,
                              'sha256': sha256(output),
                          }
              return result

          def inventory(root: Path) -> dict[str, dict]:
              rows = {}
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root).as_posix()
                  if path.is_symlink():
                      rows[rel] = {'kind': 'symlink', 'target': os.readlink(path)}
                  elif path.is_file():
                      elf = is_elf(path)
                      row = {
                          'kind': 'elf' if elf else 'file',
                          'size': path.stat().st_size,
                          'sha256': sha256(path),
                      }
                      if elf:
                          row['build_id'] = build_id(path)
                          row['allocated_sections'] = allocated_sections(path)
                      rows[rel] = row
              return rows

          target = inventory(base / 'comparison/target/root')
          candidate = inventory(base / 'comparison/candidate/root')
          comparisons = []
          for rel in sorted(set(target) | set(candidate)):
              left = target.get(rel)
              right = candidate.get(rel)
              row = {'path': rel, 'target': left, 'candidate': right}
              if left is None:
                  row['status'] = 'candidate-only'
              elif right is None:
                  row['status'] = 'target-only'
              elif left == right:
                  row['status'] = 'identical'
              elif left['kind'] == right['kind'] == 'elf':
                  row['status'] = 'elf-different'
                  row['allocated_sections_equal'] = (
                      left['allocated_sections'] == right['allocated_sections']
                  )
                  left_names = set(left['allocated_sections'])
                  right_names = set(right['allocated_sections'])
                  row['different_allocated_sections'] = [
                      name for name in sorted(left_names | right_names)
                      if left['allocated_sections'].get(name) != right['allocated_sections'].get(name)
                  ]
              else:
                  row['status'] = 'different'
              comparisons.append(row)

          non_elf_differences = [
              row['path'] for row in comparisons
              if row['status'] in {'different', 'target-only', 'candidate-only'}
          ]
          elf_rows = [row for row in comparisons if row['status'] == 'elf-different']
          summary = {
              'schema': 1,
              'source': source,
              'version': version,
              'path_set_identical': set(target) == set(candidate),
              'payload_path_count': len(comparisons),
              'identical_payload_count': sum(r['status'] == 'identical' for r in comparisons),
              'non_elf_difference_count': len(non_elf_differences),
              'non_elf_differences': non_elf_differences,
              'elf_count': sum((r.get('target') or {}).get('kind') == 'elf' for r in comparisons),
              'elf_different_count': len(elf_rows),
              'elf_allocated_sections_equal_count': sum(r.get('allocated_sections_equal') is True for r in elf_rows),
              'elf_allocated_sections_different_count': sum(r.get('allocated_sections_equal') is False for r in elf_rows),
              'elf_differences': [
                  {
                      'path': r['path'],
                      'target_sha256': r['target']['sha256'],
                      'candidate_sha256': r['candidate']['sha256'],
                      'target_build_id': r['target'].get('build_id'),
                      'candidate_build_id': r['candidate'].get('build_id'),
                      'allocated_sections_equal': r.get('allocated_sections_equal'),
                      'different_allocated_sections': r.get('different_allocated_sections', []),
                  }
                  for r in elf_rows
              ],
              'exact_payload_equivalent': bool(comparisons) and all(r['status'] == 'identical' for r in comparisons),
              'allocated_runtime_payload_equivalent': bool(comparisons) and not non_elf_differences and all(
                  r['status'] == 'identical' or
                  (r['status'] == 'elf-different' and r.get('allocated_sections_equal') is True)
                  for r in comparisons
              ),
              'target_deb_sha256': sha256(base / 'downloads/target.deb'),
              'candidate_deb_sha256': sha256(base / 'downloads/candidate.deb'),
          }
          (base / 'comparison/payload-comparison.json').write_text(
              json.dumps(comparisons, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          (base / 'comparison/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          jq '.' work/comparison/summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Seal and upload reconstruction evidence
        shell: bash
        run: |
          set -euxo pipefail
          cp -a work/source-authority work/artifact/
          cp -a work/comparison work/artifact/
          cp work/downloads/target.deb work/artifact/
          cp work/downloads/candidate.deb work/artifact/
          test ! -f work/downloads/target-dbgsym.deb || cp work/downloads/target-dbgsym.deb work/artifact/
          cp work/build/build.log work/artifact/
          cp work/build/debootstrap.log work/artifact/
          find work/artifact -type f -printf '%P\t%s\n' | LC_ALL=C sort \
            > work/artifact/FILE-INVENTORY.tsv
          (
            cd work/artifact
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Upload complete integration reconstruction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-integration-applet-han3u3-reconstruction-v2-${{ github.run_id }}
          path: work/artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Capture artifact identity and commit compact result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          artifact_name="gooroom-integration-applet-han3u3-reconstruction-v2-${GITHUB_RUN_ID}"
          artifact=''
          for attempt in $(seq 1 20); do
            artifact="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | jq -c --arg name "$artifact_name" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | last // empty')"
            [[ -z "$artifact" ]] || break
            sleep 3
          done
          test -n "$artifact"

          rm -rf "$LOCK_DIR"
          mkdir -p "$LOCK_DIR"
          cp work/source-authority/source-lock.json "$LOCK_DIR/"
          cp work/comparison/summary.json "$LOCK_DIR/"
          cp work/source-authority/vendor-dbgsym-available.txt "$LOCK_DIR/"
          jq -n \
            --arg actions_run_id "$GITHUB_RUN_ID" \
            --arg actions_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson artifact "$artifact" '
              {schema:1,actions_run_id:$actions_run_id,actions_run_url:$actions_run_url,
               artifact:{id:($artifact.id|tostring),name:$artifact.name,digest:$artifact.digest,
                         size_in_bytes:$artifact.size_in_bytes,expired:$artifact.expired}}
            ' > "$LOCK_DIR/artifact-lock.json"
          find "$LOCK_DIR" -type f -printf '%P\t%s\n' | LC_ALL=C sort \
            > "$LOCK_DIR/FILE-INVENTORY.tsv"
          (
            cd "$LOCK_DIR"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOCK_DIR"
          git commit -m 'Lock integration applet han3u3 reconstruction analysis v2'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
