name: ARM64 port - preserve API source-lock baseline

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-seed-source-lock.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download the first exact-version API resolver result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf work/api-source-lock
          mkdir -p work/api-source-lock
          gh run download 31082684892 \
            --repo "$GITHUB_REPOSITORY" \
            --name hancom-gooroom-3.3-source-lock \
            --dir work/api-source-lock
          test "$(jq -r '.resolved_count' work/api-source-lock/source-lock-summary.json)" = 55
          test "$(jq -r '.rebuild_unresolved_count' work/api-source-lock/source-lock-summary.json)" = 11
          cat > work/api-source-lock/PROVENANCE.json <<'EOF'
          {
            "schema": 1,
            "workflow_run_id": 31082684892,
            "artifact_id": 8960440462,
            "artifact_sha256": "7224b5aeda0d5a9814e7fba073da6556ee0bc339b5e5a6148f89211b31086673",
            "reference_branch": "arm64-port",
            "purpose": "Preserve 55 exact source-version-to-commit matches while deeper Git-history resolution continues"
          }
          EOF
          sha256sum work/api-source-lock/* | sort -k2 > work/api-source-lock/BASELINE_LOCKSUMS.sha256

      - name: Commit the immutable baseline
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/sources-api-baseline
          mkdir -p arm64/locks/sources-api-baseline
          cp -a work/api-source-lock/. arm64/locks/sources-api-baseline/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/sources-api-baseline
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Preserve 55 exact Hancom Gooroom source commit locks'
          git pull --rebase origin arm64-port
          git push origin HEAD:arm64-port
