name: ARM64 port - repair recovered source builder

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-recovered-source-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-recovered-source-builder
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply three fail-closed compatibility repairs
        shell: bash
        run: |
          set -euxo pipefail
          target=arm64/scripts/build_recovered_source_archive_arm64.sh
          test "$(git hash-object "$target")" = '794b4963738ba3286a740d97a46510c70598959e'
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'BUILD_JOBS="${HANCOM_GOOROOM_BUILD_JOBS:-3}"\n',
                  'BUILD_JOBS="${HANCOM_GOOROOM_BUILD_JOBS:-3}"\n'
                  'HOST_UID="$(id -u)"\n'
                  'HOST_GID="$(id -g)"\n',
                  'host UID/GID capture',
              ),
              (
                  'mkdir -p /output/logs\n\n# The carrier image',
                  'mkdir -p /output/logs\n\n'
                  '[[ "$HOST_UID" =~ ^[0-9]+$ ]] || {\n'
                  '  echo "invalid host UID: $HOST_UID" >&2\n'
                  '  exit 64\n'
                  '}\n'
                  '[[ "$HOST_GID" =~ ^[0-9]+$ ]] || {\n'
                  '  echo "invalid host GID: $HOST_GID" >&2\n'
                  '  exit 64\n'
                  '}\n'
                  'restore_output_ownership() {\n'
                  '  chown -R -- "${HOST_UID}:${HOST_GID}" /output 2>/dev/null || true\n'
                  '}\n'
                  'trap restore_output_ownership EXIT\n\n'
                  '# The carrier image',
                  'container output ownership trap',
              ),
              (
                  '  --jobs-force="${BUILD_JOBS}" \\\n',
                  '  -j"${BUILD_JOBS}" \\\n',
                  'Bullseye-compatible dpkg parallel option',
              ),
              (
                  '  BUILD_JOBS="$BUILD_JOBS" \\\n  docker run --rm \\\n',
                  '  BUILD_JOBS="$BUILD_JOBS" \\\n'
                  '  HOST_UID="$HOST_UID" \\\n'
                  '  HOST_GID="$HOST_GID" \\\n'
                  '  docker run --rm \\\n',
                  'container UID/GID values',
              ),
              (
                  '    -e BUILD_JOBS \\\n    -v "$SCRIPT_DIR/bootstrap-build.sh:/bootstrap-build.sh:ro" \\\n',
                  '    -e BUILD_JOBS \\\n'
                  '    -e HOST_UID \\\n'
                  '    -e HOST_GID \\\n'
                  '    -v "$SCRIPT_DIR/bootstrap-build.sh:/bootstrap-build.sh:ro" \\\n',
                  'container UID/GID environment forwarding',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          forbidden = ['--jobs-force=', 'docker run --rm --user root']
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden legacy token remains: {token}')

          required = [
              'HOST_UID="$(id -u)"',
              'HOST_GID="$(id -g)"',
              'trap restore_output_ownership EXIT',
              'chown -R -- "${HOST_UID}:${HOST_GID}" /output',
              '-j"${BUILD_JOBS}"',
              '-e HOST_UID',
              '-e HOST_GID',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'required repair token absent: {token}')

          path.write_text(text, encoding='utf-8')
          PY
          bash -n "$target"
          test "$(grep -Fc -- '--jobs-force=' "$target")" -eq 0
          test "$(grep -Fc -- '-j"${BUILD_JOBS}"' "$target")" -eq 1
          test "$(grep -Fc -- 'trap restore_output_ownership EXIT' "$target")" -eq 1
          test "$(grep -Fc -- '-e HOST_UID' "$target")" -eq 1
          test "$(grep -Fc -- '-e HOST_GID' "$target")" -eq 1
          git diff --check
          git diff -- "$target"

      - name: Commit only the repaired builder
        shell: bash
        run: |
          set -euxo pipefail
          target=arm64/scripts/build_recovered_source_archive_arm64.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$target"
          git commit -m 'Fix recovered source ARM64 builder compatibility'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
