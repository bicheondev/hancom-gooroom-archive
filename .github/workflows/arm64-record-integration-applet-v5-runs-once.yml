name: ARM64 record integration applet v5 runs once

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-record-integration-applet-v5-runs-once.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: arm64-record-integration-applet-v5-runs-once
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out run inventory destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Record every v5 workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          destination=arm64/status/integration-applet-han3u3-v5-runs/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/arm64-reconstruct-integration-applet-han3u3-v5.yml/runs?branch=arm64-port&per_page=100" \
            > "$destination/raw.json"
          jq '{
            schema: 1,
            total_count,
            workflow_runs: [
              .workflow_runs[] | {
                id,
                run_number,
                event,
                status,
                conclusion,
                head_sha,
                created_at,
                updated_at,
                html_url,
                run_attempt
              }
            ]
          }' "$destination/raw.json" > "$destination/runs.json"
          rm "$destination/raw.json"
          jq -r '
            ["run_number","id","event","status","conclusion","head_sha","created_at","updated_at"],
            (.workflow_runs[] | [
              (.run_number|tostring),
              (.id|tostring),
              .event,
              .status,
              (.conclusion // ""),
              .head_sha,
              .created_at,
              .updated_at
            ]) | @tsv
          ' "$destination/runs.json" > "$destination/runs.tsv"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Commit run inventory and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          destination=arm64/status/integration-applet-han3u3-v5-runs/latest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git rm .github/workflows/arm64-record-integration-applet-v5-runs-once.yml
          git diff --cached --check
          git commit -m 'Record integration applet Hancom v5 workflow runs'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
