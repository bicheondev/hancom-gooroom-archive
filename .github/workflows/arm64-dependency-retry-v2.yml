name: ARM64 port - retry dependency failures on verified package-cache changes v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dependency-retry-v2.yml'
      - 'arm64/scripts/materialize_rebuild_dependency_repo.py'
      - 'arm64/scripts/materialize_rebuild_dependency_repo_v2.py'
      - 'arm64/scripts/classify_native_rebuild_failures.py'
      - 'arm64/scripts/select_dependency_retry_wave.py'
      - 'arm64/scripts/build_locked_source_arm64_v2.sh'
      - 'arm64/scripts/verify_arm64_rebuild.py'
      - 'arm64/scripts/collect_native_rebuild_results_v2.py'
      - 'arm64/locks/rebuild-release/**'
      - 'arm64/locks/rebuild-results/**'
      - 'arm64/locks/sources-api-baseline/**'
      - 'arm64/locks/effective-sources/**'
      - 'arm64/locks/reference/**'
  workflow_dispatch:
    inputs:
      limit:
        description: Dependency failures to retry in this wave
        required: true
        default: '4'
        type: choice
        options: ['1', '2', '4', '6']

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-dependency-retry
  cancel-in-progress: false

jobs:
  dependency-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.repo.outputs.ready }}
      packages_sha256: ${{ steps.repo.outputs.packages_sha256 }}
      release_lock_sha256: ${{ steps.repo.outputs.release_lock_sha256 }}
    steps:
      - name: Check out the persistent package release lock
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Install APT repository materialization tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 dpkg-dev apt-utils ca-certificates gzip jq
          python3 -m py_compile \
            arm64/scripts/materialize_rebuild_dependency_repo.py \
            arm64/scripts/materialize_rebuild_dependency_repo_v2.py

      - name: Materialize verified rebuild assets as a local dependency repository
        id: repo
        shell: bash
        run: |
          set -uxo pipefail
          rm -rf work/dependency-repository work/dependency-evidence
          mkdir -p work/dependency-repository work/dependency-evidence
          lock=arm64/locks/rebuild-release/rebuild-release-lock.json
          if [ ! -f "$lock" ] || ! jq -e '.summary.complete == true' "$lock" >/dev/null; then
            jq -n '{
              schema: 2,
              policy: "verified-release-assets-plus-locked-generated-apt-index",
              ready: false,
              reason: "complete-rebuild-release-lock-not-available",
              packages_sha256: null,
              release_lock_sha256: null
            }' > work/dependency-evidence/summary.json
            jq -n --slurpfile summary work/dependency-evidence/summary.json \
              '{summary:$summary[0],packages:[],errors:[{reason:"release-lock-not-ready"}]}' \
              > work/dependency-evidence/dependency-repository.json
            rc=2
          else
            set +e
            python3 arm64/scripts/materialize_rebuild_dependency_repo_v2.py \
              --release-lock "$lock" \
              --repository-dir work/dependency-repository \
              --output-dir work/dependency-evidence \
              --workers 8
            rc=$?
            set -e
          fi
          ready="$(jq -r '.ready == true' work/dependency-evidence/summary.json)"
          packages_sha256="$(jq -r '.packages_sha256 // empty' work/dependency-evidence/summary.json)"
          release_lock_sha256="$(jq -r '.release_lock_sha256 // empty' work/dependency-evidence/summary.json)"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "packages_sha256=$packages_sha256" >> "$GITHUB_OUTPUT"
          echo "release_lock_sha256=$release_lock_sha256" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            test "$rc" = 0
            test "$(sha256sum work/dependency-repository/Packages | awk '{print $1}')" = "$packages_sha256"
          fi

      - name: Upload exact dependency repository and index lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-arm64-build-dependency-repository-${{ github.run_id }}
          path: |
            work/dependency-repository
            work/dependency-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  plan:
    needs: dependency-repository
    if: needs.dependency-repository.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      remaining: ${{ steps.plan.outputs.remaining }}
      lock_path: ${{ steps.plan.outputs.lock_path }}
    steps:
      - name: Check out failures, locks, and retry selector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Download and verify dependency repository manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hancom-gooroom-arm64-build-dependency-repository-${{ github.run_id }}
          path: work/dependency-artifact

      - name: Classify failures and select hash-eligible dependency retries
        id: plan
        shell: bash
        run: |
          set -euxo pipefail
          limit='${{ github.event.inputs.limit }}'
          test -n "$limit" || limit=4
          lock=arm64/locks/sources-api-baseline/source-lock.json
          if [ -f arm64/locks/effective-sources/effective-source-lock.json ]; then
            lock=arm64/locks/effective-sources/effective-source-lock.json
          fi
          manifest=work/dependency-artifact/dependency-evidence/dependency-repository.json
          repo=work/dependency-artifact/dependency-repository
          expected='${{ needs.dependency-repository.outputs.packages_sha256 }}'
          test -f "$manifest"
          test "$(sha256sum "$repo/Packages" | awk '{print $1}')" = "$expected"

          rm -rf work/failure-classification
          python3 arm64/scripts/classify_native_rebuild_failures.py \
            --results arm64/locks/rebuild-results \
            --output-dir work/failure-classification
          python3 arm64/scripts/select_dependency_retry_wave.py \
            --lock "$lock" \
            --reference arm64/locks/reference/amd64-reference.json \
            --classifications work/failure-classification/classifications.json \
            --dependency-repository "$manifest" \
            --limit "$limit" \
            --output work/dependency-retry-wave.json

          echo "matrix=$(jq -c '.matrix' work/dependency-retry-wave.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.summary.selected_count' work/dependency-retry-wave.json)" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r '.summary.remaining_eligible_count' work/dependency-retry-wave.json)" >> "$GITHUB_OUTPUT"
          echo "lock_path=$lock" >> "$GITHUB_OUTPUT"
          {
            echo '## Dependency-gated ARM64 rebuild retry wave'
            echo
            echo "- Dependency Packages SHA-256: \`$expected\`"
            echo "- Selected: \`$(jq -r '.summary.selected_count' work/dependency-retry-wave.json)\`"
            echo "- Remaining eligible: \`$(jq -r '.summary.remaining_eligible_count' work/dependency-retry-wave.json)\`"
            echo
            echo '```json'
            jq '{selected, skipped}' work/dependency-retry-wave.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload classifications and immutable retry plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-arm64-dependency-retry-plan-${{ github.run_id }}
          path: |
            work/failure-classification
            work/dependency-retry-wave.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  retry:
    needs: [dependency-repository, plan]
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 175
    steps:
      - name: Check out exact source and current verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Download exact verified dependency repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hancom-gooroom-arm64-build-dependency-repository-${{ github.run_id }}
          path: work/dependency-artifact

      - name: Verify native host and dependency index identity
        shell: bash
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'Native ARM64 runner required.' >&2; exit 1 ;;
          esac
          docker version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git jq dpkg-dev ca-certificates python3 coreutils
          repo=work/dependency-artifact/dependency-repository
          test "$(sha256sum "$repo/Packages" | awk '{print $1}')" = \
            '${{ matrix.dependency_repository_packages_sha256 }}'
          python3 -m py_compile arm64/scripts/verify_arm64_rebuild.py

      - name: Retry exact source with changed verified dependency cache
        id: build
        continue-on-error: true
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z
          HANCOM_GOOROOM_REFERENCE_JSON: arm64/locks/reference/amd64-reference.json
          HANCOM_GOOROOM_REQUIRED_PACKAGES: ${{ matrix.required_native_packages_space }}
          HANCOM_GOOROOM_DEPENDENCY_REPOSITORY: ${{ github.workspace }}/work/dependency-artifact/dependency-repository
        shell: bash
        run: |
          set -o pipefail
          output='work/rebuild/${{ matrix.source }}'
          rm -rf "$output"
          mkdir -p "$output"
          chmod +x arm64/scripts/build_locked_source_arm64_v2.sh
          set +e
          timeout --signal=TERM --kill-after=120 9600 \
            arm64/scripts/build_locked_source_arm64_v2.sh \
              '${{ needs.plan.outputs.lock_path }}' \
              '${{ matrix.source }}' \
              "$output" \
            2>&1 | tee "$output/workflow-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify exact package identities and machine code
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/verify_arm64_rebuild.py \
            --lock '${{ needs.plan.outputs.lock_path }}' \
            --reference arm64/locks/reference/amd64-reference.json \
            --source '${{ matrix.source }}' \
            --source-version '${{ matrix.source_version }}' \
            --directory 'work/rebuild/${{ matrix.source }}' \
            --output 'work/rebuild/${{ matrix.source }}/verification.json'

      - name: Write dependency-aware structured result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          output='work/rebuild/${{ matrix.source }}'
          mkdir -p "$output"
          jq -n \
            --arg source '${{ matrix.source }}' \
            --arg source_version '${{ matrix.source_version }}' \
            --arg repository '${{ matrix.repository_full_name }}' \
            --arg commit_sha '${{ matrix.commit_sha }}' \
            --arg tree_sha '${{ matrix.tree_sha }}' \
            --arg build_outcome '${{ steps.build.outcome }}' \
            --arg build_exit_code '${{ steps.build.outputs.exit_code }}' \
            --arg verify_outcome '${{ steps.verify.outcome }}' \
            --arg retry_reason '${{ matrix.retry_reason }}' \
            --arg dependency_repository_packages_sha256 '${{ matrix.dependency_repository_packages_sha256 }}' \
            --arg dependency_release_lock_sha256 '${{ matrix.dependency_release_lock_sha256 }}' \
            --arg previous_dependency_repository_packages_sha256 '${{ matrix.previous_dependency_repository_packages_sha256 }}' \
            --arg previous_actions_run_id '${{ matrix.previous_actions_run_id }}' \
            --argjson required_native_packages '${{ toJSON(matrix.required_native_packages) }}' \
            --argjson reused_all_packages '${{ toJSON(matrix.reused_all_packages) }}' \
            '{
              schema: 2,
              source: $source,
              source_version: $source_version,
              repository_full_name: $repository,
              commit_sha: $commit_sha,
              tree_sha: $tree_sha,
              build_outcome: $build_outcome,
              build_exit_code: $build_exit_code,
              verify_outcome: $verify_outcome,
              retry_reason: $retry_reason,
              dependency_repository_packages_sha256: $dependency_repository_packages_sha256,
              dependency_release_lock_sha256: $dependency_release_lock_sha256,
              previous_dependency_repository_packages_sha256: $previous_dependency_repository_packages_sha256,
              previous_actions_run_id: $previous_actions_run_id,
              required_native_packages: $required_native_packages,
              reused_all_packages: $reused_all_packages,
              passed: ($build_outcome == "success" and $verify_outcome == "success")
            }' > "$output/job-result.json"

      - name: Upload packages or complete retry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: work/rebuild/${{ matrix.source }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce retry result after evidence preservation
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          jq -e '.passed == true' 'work/rebuild/${{ matrix.source }}/job-result.json'

  collect:
    needs: [dependency-repository, plan, retry]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out rebuild evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download this retry wave's package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: arm64-rebuild-*
          path: work/rebuild-artifacts
          merge-multiple: false

      - name: Download dependency repository for next-wave hash gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hancom-gooroom-arm64-build-dependency-repository-${{ github.run_id }}
          path: work/dependency-artifact

      - name: Produce compact dependency-aware evidence
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/rebuild-results
          python3 arm64/scripts/collect_native_rebuild_results_v2.py \
            --artifacts-dir work/rebuild-artifacts \
            --output-dir work/rebuild-results \
            --run-id '${{ github.run_id }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --batch dependency-retry
          find work/rebuild-results -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/rebuild-results/LOCKSUMS.sha256

      - name: Upload consolidated retry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-arm64-dependency-retry-results-${{ github.run_id }}
          path: work/rebuild-results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit compact results
        id: commit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p arm64/locks/rebuild-results/runs/${{ github.run_id }}
          cp work/rebuild-results/summary.json arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          cp work/rebuild-results/failed.json arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          cp work/rebuild-results/collection-errors.json arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          cp work/rebuild-results/LOCKSUMS.sha256 arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          while IFS= read -r result; do
            relative="${result#work/rebuild-results/}"
            destination="arm64/locks/rebuild-results/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$result" "$destination"
          done < <(find work/rebuild-results -mindepth 3 -type f -name '*.json' | sort)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/rebuild-results
          if git diff --cached --quiet; then
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Record dependency-aware ARM64 rebuild retry ${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch next hash-eligible retry wave
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          lock=arm64/locks/sources-api-baseline/source-lock.json
          if [ -f arm64/locks/effective-sources/effective-source-lock.json ]; then
            lock=arm64/locks/effective-sources/effective-source-lock.json
          fi
          rm -rf work/next-classification
          python3 arm64/scripts/classify_native_rebuild_failures.py \
            --results arm64/locks/rebuild-results \
            --output-dir work/next-classification
          python3 arm64/scripts/select_dependency_retry_wave.py \
            --lock "$lock" \
            --reference arm64/locks/reference/amd64-reference.json \
            --classifications work/next-classification/classifications.json \
            --dependency-repository work/dependency-artifact/dependency-evidence/dependency-repository.json \
            --limit 4 \
            --output work/next-dependency-retry-wave.json
          if [ "$(jq -r '.summary.selected_count' work/next-dependency-retry-wave.json)" -gt 0 ]; then
            gh workflow run arm64-dependency-retry-v2.yml \
              --repo '${{ github.repository }}' \
              --ref arm64-port \
              -f limit=4
          fi
