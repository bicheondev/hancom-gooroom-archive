name: ARM64 apply - exact gnome-flashback warning line geometry

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-apply-gnome-flashback-warning-line.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-apply-gnome-flashback-warning-line
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Relocate the nine non-semantic source lines
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin arm64-port

          script=arm64/scripts/reconstruct_gnome_flashback_han3u4.py
          test "$(sha256sum "$script" | awk '{print $1}')" \
            = f58b7ff3053c14c5eb67c7618ab0538730815ecde0662da21aa095087f867e6e

          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/reconstruct_gnome_flashback_han3u4.py')
          text = path.read_text(encoding='utf-8')

          old = '''    # Two vendor assertions in this file encode lines 438 and 534. The public
              # equivalent is nine lines short before auth_message_cb; restore that exact
              # non-semantic source geometry before adding the Hangul callback.
              unlock_text = replace_once(
                  unlock_text,
                  "}\\n\\nstatic void\\nauth_message_cb (GfAuth            *auth,\\n",
                  "}\\n" + ("\\n" * 10)
                  + "static void\\nauth_message_cb (GfAuth            *auth,\\n",
                  "gf-unlock-dialog source line geometry",
              )
          '''
          new = '''    # The target structured-log record encodes line 325 in dm_seat_ready_cb,
              # while the two later assertions encode lines 438 and 534. The public
              # equivalent is nine lines short before dm_seat_ready_cb; restore the
              # non-semantic source geometry at its first binary-observable boundary.
              unlock_text = replace_once(
                  unlock_text,
                  "#endif\\n\\nstatic void\\ndm_seat_ready_cb (GObject      *object,\\n",
                  "#endif\\n" + ("\\n" * 10)
                  + "static void\\ndm_seat_ready_cb (GObject      *object,\\n",
                  "gf-unlock-dialog source line geometry",
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'old geometry block count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''    expected_unlock_lines = {
                  438: "        g_assert_not_reached ();",
                  534: "  g_assert (self->shake_timeout_id == 0);",
              }
          '''
          new = '''    expected_unlock_lines = {
                  325: '        g_warning ("%s", error->message);',
                  438: "        g_assert_not_reached ();",
                  534: "  g_assert (self->shake_timeout_id == 0);",
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'unlock line-lock block count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''            "unlock_assertion_source_lines": sorted(expected_unlock_lines),
          '''
          new = '''            "unlock_structured_log_source_lines": [325],
                      "unlock_assertion_source_lines": [438, 534],
          '''
          if text.count(old) != 1:
              raise SystemExit(f'unlock metadata block count: {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile "$script"
          test "$(sha256sum "$script" | awk '{print $1}')" \
            = a14115737669bb0206a28e709d66d3e43ba31bd7b65f4bfecd00f720cf044c80
          grep -Fq "325: '        g_warning (\"%s\", error->message);'" "$script"
          grep -Fq '"unlock_structured_log_source_lines": [325]' "$script"
          git diff --check

          git rm .github/workflows/arm64-apply-gnome-flashback-warning-line.yml
          git add "$script"
          git diff --cached --check
          git commit -m 'Relocate gnome-flashback warning line geometry'

      - name: Rebase and publish the validated reconstruction change
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin arm64-port
            if git rebase origin/arm64-port && git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
