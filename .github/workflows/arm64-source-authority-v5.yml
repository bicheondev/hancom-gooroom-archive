name: ARM64 port - exact source authority controller v5

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-source-authority-v5.yml'
      - 'arm64/scripts/merge_exact_source_authority_v3.py'
      - 'arm64/scripts/finalize_effective_source_authority.py'
      - 'arm64/locks/reference/**'
      - 'arm64/locks/sources-api-baseline/**'
      - 'arm64/locks/sources/**'
      - 'arm64/locks/sources-exhaustive/**'
      - 'arm64/locks/vendor-pool-sources/**'
      - 'arm64/locks/wayback-sources/**'
      - 'arm64/locks/verified-build-sources/**'
      - 'arm64/locks/reconstructed-sources/**'
      - 'arm64/keys/source-signing/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-source-authority-v5
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      build_allowed: ${{ steps.merge.outputs.build_allowed }}
      signed_dsc_count: ${{ steps.merge.outputs.signed_dsc_count }}
      resolved_count: ${{ steps.merge.outputs.resolved_count }}
      blocker_count: ${{ steps.merge.outputs.blocker_count }}
    steps:
      - name: Check out every exact and independently verified source proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Merge exact authorities and finalize verified overlays fail closed
        id: merge
        shell: bash
        run: |
          set -uxo pipefail
          output=work/source-authority-v5
          rm -rf "$output"
          mkdir -p "$output"
          arguments=(
            --reference arm64/locks/reference/amd64-reference.json
            --vendor-pool-lock arm64/locks/vendor-pool-sources/vendor-pool-source-lock.json
            --output-dir "$output"
          )
          mapfile -t git_locks < <(
            find arm64/locks -mindepth 2 -maxdepth 2 -type f \
              -name source-lock.json \
              -path 'arm64/locks/sources*/*' \
              -print | sort
          )
          for lock in "${git_locks[@]}"; do
            arguments+=(--git-lock "$lock")
          done
          wayback=arm64/locks/wayback-sources/wayback-source-release-lock.json
          if [ -f "$wayback" ]; then
            arguments+=(--wayback-release-lock "$wayback")
          fi

          set +e
          python3 arm64/scripts/merge_exact_source_authority_v3.py \
            "${arguments[@]}"
          exact_rc=$?
          set -e

          finalize=(
            --base-lock "$output/effective-source-lock.json"
            --output-dir "$output"
          )
          verified=arm64/locks/verified-build-sources/source-lock.json
          reconstructed=arm64/locks/reconstructed-sources/source-locks.json
          if [ -f "$verified" ]; then
            finalize+=(--verified-build-lock "$verified")
          fi
          if [ -f "$reconstructed" ]; then
            finalize+=(--reconstructed-locks "$reconstructed")
          fi

          set +e
          python3 arm64/scripts/finalize_effective_source_authority.py \
            "${finalize[@]}"
          final_rc=$?
          set -e

          summary="$output/effective-source-lock-summary.json"
          echo "exact_exit_code=$exact_rc" >> "$GITHUB_OUTPUT"
          echo "exit_code=$final_rc" >> "$GITHUB_OUTPUT"
          echo "build_allowed=$(jq -r '.build_allowed' "$summary")" >> "$GITHUB_OUTPUT"
          echo "signed_dsc_count=$(jq -r '.signed_dsc_resolved_count // 0' "$summary")" >> "$GITHUB_OUTPUT"
          echo "resolved_count=$(jq -r '.resolved_count // 0' "$summary")" >> "$GITHUB_OUTPUT"
          echo "blocker_count=$(jq -r '.rebuild_blocker_count // 0' "$summary")" >> "$GITHUB_OUTPUT"

          jq -n \
            --argjson git_lock_count "${#git_locks[@]}" \
            --argjson git_locks "$(printf '%s\n' "${git_locks[@]}" | jq -Rsc 'split("\n")[:-1]')" \
            --arg verified_build_lock "$verified" \
            --arg reconstructed_source_lock "$reconstructed" \
            --argjson exact_merge_exit_code "$exact_rc" \
            --argjson finalizer_exit_code "$final_rc" \
            '{
              schema: 2,
              git_lock_count: $git_lock_count,
              git_locks: $git_locks,
              verified_build_lock: $verified_build_lock,
              reconstructed_source_lock: $reconstructed_source_lock,
              exact_merge_exit_code: $exact_merge_exit_code,
              finalizer_exit_code: $finalizer_exit_code
            }' > "$output/input-locks.json"
          find "$output" -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > "$output/LOCKSUMS.sha256"
          cat "$summary"

      - name: Upload canonical authority, overlays, inputs, and blockers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-source-authority-v5-${{ github.run_id }}
          path: work/source-authority-v5
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit canonical authority before any native build dispatch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/effective-sources-v3
          mkdir -p arm64/locks/effective-sources-v3
          cp -a work/source-authority-v5/. arm64/locks/effective-sources-v3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/effective-sources-v3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize canonical exact and verified source authority v5'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Dispatch consumers against the finalized canonical authority
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          signed='${{ steps.merge.outputs.signed_dsc_count }}'
          if [ "$signed" -gt 0 ] \
             && [ ! -f arm64/keys/source-signing/gooroom-archive-public-keys.asc ]; then
            echo 'Signed DSC source selected; waiting for the reference-ISO key bundle.' >&2
            exit 0
          fi
          gh workflow run arm64-native-rebuild-controller-v3.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port \
            -f mode=baseline \
            -f limit=6 || true
          gh workflow run arm64-native-rebuild-controller-v3.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port \
            -f mode=backlog \
            -f limit=6 || true
          gh workflow run arm64-port-coverage.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port || true
          gh workflow run arm64-port-coverage-v2.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port || true

      - name: Preserve unresolved native-source conclusion after evidence commit
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.merge.outputs.exit_code }}' = '0'
          jq -e '.build_allowed == true and .rebuild_blocker_count == 0' \
            work/source-authority-v5/effective-source-lock-summary.json
