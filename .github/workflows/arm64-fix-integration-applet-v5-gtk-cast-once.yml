name: ARM64 fix integration applet v5 GTK cast once

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-fix-integration-applet-v5-gtk-cast-once.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: arm64-fix-integration-applet-v5-gtk-cast-once
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Preserve the explicit target GTK cast
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/integration_applet_han3u3_semantic.py')
          text = path.read_text(encoding='utf-8')
          old = 'gtk_widget_set_can_focus (priv->control, FALSE);'
          new = 'gtk_widget_set_can_focus (GTK_WIDGET (priv->control), FALSE);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one direct focus call template, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile arm64/scripts/integration_applet_han3u3_semantic.py
          grep -Fq \
            'gtk_widget_set_can_focus (GTK_WIDGET (priv->control), FALSE);' \
            arm64/scripts/integration_applet_han3u3_semantic.py

      - name: Commit exact-cast correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/integration_applet_han3u3_semantic.py
          git rm .github/workflows/arm64-fix-integration-applet-v5-gtk-cast-once.yml
          git diff --cached --check
          git commit -m 'Match integration applet target GTK cast semantics'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch corrected v5 reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run \
            arm64-reconstruct-integration-applet-han3u3-v5.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port
