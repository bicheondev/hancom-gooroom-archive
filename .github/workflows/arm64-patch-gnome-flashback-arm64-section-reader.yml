name: ARM64 patch - architecture-neutral gnome-flashback ELF section reader

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-patch-gnome-flashback-arm64-section-reader.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hancom-gooroom-33-patch-gnome-flashback-arm64-section-reader
  cancel-in-progress: true

jobs:
  patch-prove-and-dispatch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the current ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install deterministic ELF tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file python3 unzip

      - name: Replace host objcopy section extraction with a bounded ELF parser
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/verify_gnome_flashback_han3u4_arm64.py')
          text = path.read_text(encoding='utf-8')
          old = '''def section_bytes(path: Path, section: str, temporary: Path) -> bytes | None:
              sections = str(run(["readelf", "-SW", str(path)]))
              if not re.search(rf"\\]\\s+{re.escape(section)}\\s", sections):
                  return None
              temporary.parent.mkdir(parents=True, exist_ok=True)
              if temporary.exists():
                  temporary.unlink()
              run(["objcopy", f"--dump-section={section}={temporary}", str(path)])
              return temporary.read_bytes()
          '''.replace('          ', '')
          new = '''def _elf_uint(payload: bytes, offset: int, size: int, byteorder: str, label: str) -> int:
              end = offset + size
              if offset < 0 or end > len(payload):
                  raise RuntimeError(f"ELF {label} escapes the file: {offset}+{size}>{len(payload)}")
              return int.from_bytes(payload[offset:end], byteorder)


          def section_bytes(path: Path, section: str, temporary: Path) -> bytes | None:
              # Parse section headers directly so an AArch64 runner can inspect the
              # immutable AMD64 authority without relying on host-target objcopy support.
              del temporary
              payload = path.read_bytes()
              if len(payload) < 16 or payload[:4] != ELF_MAGIC:
                  raise RuntimeError(f"{path}: not an ELF file")

              elf_class = payload[4]
              data_encoding = payload[5]
              if data_encoding == 1:
                  byteorder = "little"
              elif data_encoding == 2:
                  byteorder = "big"
              else:
                  raise RuntimeError(f"{path}: unsupported ELF data encoding {data_encoding}")

              if elf_class == 1:
                  minimum_header = 52
                  section_table_offset_field = (32, 4)
                  section_entry_size_field = (46, 2)
                  section_count_field = (48, 2)
                  section_names_index_field = (50, 2)
                  minimum_section_header = 40
                  section_offset_field = (16, 4)
                  section_size_field = (20, 4)
                  section_link_field = (24, 4)
              elif elf_class == 2:
                  minimum_header = 64
                  section_table_offset_field = (40, 8)
                  section_entry_size_field = (58, 2)
                  section_count_field = (60, 2)
                  section_names_index_field = (62, 2)
                  minimum_section_header = 64
                  section_offset_field = (24, 8)
                  section_size_field = (32, 8)
                  section_link_field = (40, 4)
              else:
                  raise RuntimeError(f"{path}: unsupported ELF class {elf_class}")

              if len(payload) < minimum_header:
                  raise RuntimeError(f"{path}: truncated ELF header")

              def header_field(field: tuple[int, int], label: str) -> int:
                  return _elf_uint(payload, field[0], field[1], byteorder, label)

              section_table_offset = header_field(
                  section_table_offset_field, "section table offset"
              )
              section_entry_size = header_field(
                  section_entry_size_field, "section entry size"
              )
              section_count = header_field(section_count_field, "section count")
              section_names_index = header_field(
                  section_names_index_field, "section-name index"
              )
              if not section_table_offset or section_entry_size < minimum_section_header:
                  return None

              def read_section_header(index: int) -> dict[str, int]:
                  base = section_table_offset + index * section_entry_size
                  if base < 0 or base + section_entry_size > len(payload):
                      raise RuntimeError(f"{path}: section header {index} escapes the file")
                  return {
                      "name": _elf_uint(payload, base, 4, byteorder, "section name"),
                      "type": _elf_uint(payload, base + 4, 4, byteorder, "section type"),
                      "offset": _elf_uint(
                          payload,
                          base + section_offset_field[0],
                          section_offset_field[1],
                          byteorder,
                          "section offset",
                      ),
                      "size": _elf_uint(
                          payload,
                          base + section_size_field[0],
                          section_size_field[1],
                          byteorder,
                          "section size",
                      ),
                      "link": _elf_uint(
                          payload,
                          base + section_link_field[0],
                          section_link_field[1],
                          byteorder,
                          "section link",
                      ),
                  }

              section_zero = read_section_header(0)
              if section_count == 0:
                  section_count = section_zero["size"]
              if section_names_index == 0xFFFF:
                  section_names_index = section_zero["link"]
              if section_count <= 0 or section_names_index >= section_count:
                  raise RuntimeError(f"{path}: invalid ELF section table geometry")
              if section_table_offset + section_count * section_entry_size > len(payload):
                  raise RuntimeError(f"{path}: complete section table escapes the file")

              names_header = read_section_header(section_names_index)
              names_start = names_header["offset"]
              names_end = names_start + names_header["size"]
              if names_end > len(payload):
                  raise RuntimeError(f"{path}: section-name table escapes the file")
              names = payload[names_start:names_end]

              for index in range(section_count):
                  header = read_section_header(index)
                  name_offset = header["name"]
                  if name_offset >= len(names):
                      raise RuntimeError(f"{path}: section {index} name escapes the string table")
                  name_end = names.find(b"\\0", name_offset)
                  if name_end < 0:
                      raise RuntimeError(f"{path}: section {index} name is unterminated")
                  name = names[name_offset:name_end].decode("utf-8", "surrogateescape")
                  if name != section:
                      continue
                  if header["type"] == 8:  # SHT_NOBITS has no file-backed bytes.
                      return b""
                  start = header["offset"]
                  end = start + header["size"]
                  if end > len(payload):
                      raise RuntimeError(f"{path}: section {section} escapes the file")
                  return payload[start:end]
              return None
          '''.replace('          ', '')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'section reader anchor count is {count}, expected 1')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile arm64/scripts/verify_gnome_flashback_han3u4_arm64.py

      - name: Prove cross-architecture extraction against locked AMD64 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/section-reader-proof
          mkdir -p work/section-reader-proof
          gh run download 31940463596 \
            --repo "$GITHUB_REPOSITORY" \
            --name gnome-flashback-han3u4-amd64-elf-differential-31940463596 \
            --dir work/section-reader-proof
          python3 - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path

          module_path = Path('arm64/scripts/verify_gnome_flashback_han3u4_arm64.py')
          spec = importlib.util.spec_from_file_location('gf_arm64_verify', module_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load patched ARM64 verifier')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          root = Path('work/section-reader-proof/debug')
          expected_sha256 = '3798b83790faabf96065714593aec22f2ff574aaf94f97fb97ee664577406d18'
          expected_size = 19048
          for role in ('target', 'candidate'):
              elf = root / 'binaries' / f'{role}-gnome-flashback'
              oracle = root / 'sections' / f'{role}.gresource.gf.bin'
              extracted = module.section_bytes(elf, '.gresource.gf', root / 'unused')
              if extracted is None:
                  raise SystemExit(f'{role}: .gresource.gf was not found')
              if extracted != oracle.read_bytes():
                  raise SystemExit(f'{role}: parser bytes differ from locked objcopy oracle')
              if len(extracted) != expected_size:
                  raise SystemExit(f'{role}: unexpected section size {len(extracted)}')
              digest = hashlib.sha256(extracted).hexdigest()
              if digest != expected_sha256:
                  raise SystemExit(f'{role}: unexpected section digest {digest}')

          arm_elf = Path('/bin/true')
          machine = module.elf_header(arm_elf).get('Machine', '')
          if 'AArch64' not in machine:
              raise SystemExit(f'runner is not AArch64: {machine}')
          if module.section_bytes(arm_elf, '.section-that-does-not-exist', root / 'unused') is not None:
              raise SystemExit('absent-section result was not None')
          print('cross-architecture ELF section proof passed')
          PY

      - name: Commit the verified architecture-neutral reader
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add arm64/scripts/verify_gnome_flashback_han3u4_arm64.py
          git diff --cached --check
          git commit -m 'Read gnome-flashback ELF sections across architectures'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin arm64-port
            git rebase origin/arm64-port
            if git push origin HEAD:arm64-port; then
              pushed=1
              break
            fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Dispatch exact AMD64 proof and native ARM64 promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run \
            arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port
