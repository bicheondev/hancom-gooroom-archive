name: ARM64 branch-native post-recovery trigger v1

on:
  workflow_dispatch:
  push:
    branches: [arm64-port]
    paths:
      - 'arm64/status/linux-source-recovery-v2/latest.json'
      - 'arm64/status/session-manager-source-recovery-v2/latest.json'
      - '.github/workflows/arm64-branch-native-post-recovery-trigger-v1.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: arm64-branch-native-post-recovery-trigger-v1
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: arm64-port
    steps:
      - name: Check out latest ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Verify both exact-source gates
        id: locks
        shell: bash
        run: |
          set -euo pipefail
          linux=arm64/status/linux-source-recovery-v2/latest.json
          session=arm64/status/session-manager-source-recovery-v2/latest.json
          ready=false
          if [[ -f "$linux" && -f "$session" ]]; then
            if jq -e '.source_locked == true and .ambiguous == false and .verified_source_stanza_count == 1' "$linux" >/dev/null \
              && jq -e '.source_locked == true and ((.missing // []) | length) == 0 and ((.ambiguous // []) | length) == 0' "$session" >/dev/null; then
              ready=true
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          mkdir -p work/branch-native-post-recovery-v1 arm64/status/branch-native-post-recovery-v1
          jq -n --argjson ready "$ready" --arg linux "$linux" --arg session "$session" \
            '{schema:1,exact_sources_ready:$ready,linux_status:$linux,session_manager_status:$session}' \
            > work/branch-native-post-recovery-v1/locks.json

      - name: Discover integration v3 workflow on the branch
        if: steps.locks.outputs.ready == 'true'
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates=[]
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path.name in {
                  'arm64-continuation-orchestrator-v1.yml',
                  'arm64-post-recovery-gate-v1.yml',
                  'arm64-branch-native-post-recovery-trigger-v1.yml',
              }:
                  continue
              text=path.read_text(errors='replace').lower()
              score=None
              name=path.name.lower()
              if 'integration' in name and 'v3' in name: score=0
              elif 'integration' in name and 'nimf' in text: score=1
              elif 'integration' in text and 'nimf-amd64-builddeps-v1' in text: score=2
              if score is not None:
                  candidates.append({'path':str(path),'score':score})
          candidates.sort(key=lambda x:(x['score'],x['path']))
          Path('work/branch-native-post-recovery-v1/candidates.json').write_text(json.dumps(candidates,indent=2)+'\n')
          Path('work/branch-native-post-recovery-v1/workflow.txt').write_text((candidates[0]['path'] if candidates else '')+'\n')
          PY
          workflow="$(tr -d '\n' < work/branch-native-post-recovery-v1/workflow.txt)"
          test -n "$workflow"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

      - name: Record pre-trigger run authority
        if: steps.locks.outputs.ready == 'true' && steps.discover.outputs.workflow != ''
        id: before
        shell: bash
        run: |
          set -euo pipefail
          workflow='${{ steps.discover.outputs.workflow }}'
          gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$BRANCH" -f per_page=100 \
            | jq --arg path "$workflow" '[.workflow_runs[] | select(.path == $path)] | sort_by(.id) | last // null' \
            > work/branch-native-post-recovery-v1/before.json
          echo "run_id=$(jq -r '.id // 0' work/branch-native-post-recovery-v1/before.json)" >> "$GITHUB_OUTPUT"

      - name: Trigger integration through an arm64-port push
        if: steps.locks.outputs.ready == 'true' && steps.discover.outputs.workflow != ''
        id: push
        shell: bash
        run: |
          set -euxo pipefail
          workflow='${{ steps.discover.outputs.workflow }}'
          marker="# branch-native-retrigger: source-recovery-v2 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          # Keep the file valid YAML while guaranteeing a content-changing push.
          printf '\n%s\n' "$marker" >> "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Trigger ARM64 integration v3 after exact-source recovery'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:arm64-port; then
              echo "trigger_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin arm64-port
            git rebase origin/arm64-port
            sleep $((attempt * 2))
          done
          exit 1

      - name: Observe the branch-native integration run
        if: steps.push.outcome == 'success'
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          workflow='${{ steps.discover.outputs.workflow }}'
          before='${{ steps.before.outputs.run_id }}'
          run='null'
          run_id=0
          for _ in $(seq 1 36); do
            sleep 5
            run="$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$BRANCH" -f per_page=100 \
              | jq --arg path "$workflow" '[.workflow_runs[] | select(.path == $path)] | sort_by(.id) | last // null')"
            run_id="$(jq -r '.id // 0' <<<"$run")"
            if [[ "$run_id" != 0 && "$run_id" != "$before" ]]; then break; fi
          done
          test "$run_id" != 0
          test "$run_id" != "$before"
          for _ in $(seq 1 180); do
            run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
            [[ "$(jq -r '.status' <<<"$run")" == completed ]] && break
            sleep 10
          done
          jq '{id,name,path,status,conclusion,head_sha,event,created_at,updated_at,html_url}' <<<"$run" \
            > work/branch-native-post-recovery-v1/integration-run.json
          jq -e '.status == "completed" and .conclusion == "success"' work/branch-native-post-recovery-v1/integration-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Trigger continuation audit through an arm64-port push
        if: steps.observe.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          workflow=.github/workflows/arm64-continuation-orchestrator-v1.yml
          test -f "$workflow"
          printf '\n# branch-native-retrigger: integration-success run %s\n' '${{ steps.observe.outputs.run_id }}' >> "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Trigger ARM64 continuation audit after integration v3'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:arm64-port; then exit 0; fi
            git fetch origin arm64-port
            git rebase origin/arm64-port
            sleep $((attempt * 2))
          done
          exit 1

      - name: Write branch-native trigger record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin arm64-port || true
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          work=Path('work/branch-native-post-recovery-v1')
          def load(name):
              p=work/name
              return json.loads(p.read_text()) if p.exists() else None
          report={
              'schema':1,
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'head_sha_at_checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'locks':load('locks.json'),
              'integration_candidates':load('candidates.json'),
              'pre_trigger_run':load('before.json'),
              'integration_run':load('integration-run.json'),
              'iso_gate_modified':False,
          }
          Path('arm64/status/branch-native-post-recovery-v1/latest.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit branch-native trigger record
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          cp work/branch-native-post-recovery-v1/locks.json /tmp/locks.json 2>/dev/null || true
          # Regenerate the report against the refreshed branch so the record commit is conflict-resistant.
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          work=Path('work/branch-native-post-recovery-v1')
          def load(name):
              p=work/name
              return json.loads(p.read_text()) if p.exists() else None
          out=Path('arm64/status/branch-native-post-recovery-v1/latest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
              'schema':1,
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'branch_head_before_record':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'locks':load('locks.json'),
              'integration_candidates':load('candidates.json'),
              'pre_trigger_run':load('before.json'),
              'integration_run':load('integration-run.json'),
              'iso_gate_modified':False,
          },indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/branch-native-post-recovery-v1/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record branch-native ARM64 post-recovery trigger state'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:arm64-port; then exit 0; fi
            git fetch origin arm64-port
            git rebase origin/arm64-port
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload branch-native evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: arm64-branch-native-post-recovery-v1-${{ github.run_id }}
          path: |
            work/branch-native-post-recovery-v1
            arm64/status/branch-native-post-recovery-v1
          if-no-files-found: error
          retention-days: 30
