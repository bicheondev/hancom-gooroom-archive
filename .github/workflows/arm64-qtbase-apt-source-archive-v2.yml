name: ARM64 port - recover QtBase archival source candidate v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-qtbase-apt-source-archive-v2.yml'
      - 'arm64/scripts/resolve_source_apt.py'
      - 'arm64/scripts/resolve_source_apt_fast.py'
      - 'arm64/scripts/resolve_source_apt_archival.py'
      - 'arm64/scripts/resolve_source_apt_archival_fast.py'
      - 'arm64/locks/reference/**'
      - 'arm64/locks/vendor-binaries/**'
      - 'arm64/locks/sources-api-baseline/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hancom-gooroom-33-qtbase-archival-source-candidate
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out immutable port evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 1

      - name: Install source extraction tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev jq python3 xz-utils bzip2
          python3 -m py_compile \
            arm64/scripts/resolve_source_apt.py \
            arm64/scripts/resolve_source_apt_fast.py \
            arm64/scripts/resolve_source_apt_archival.py \
            arm64/scripts/resolve_source_apt_archival_fast.py

      - name: Create the exact QtBase recovery seed
        run: |
          set -euxo pipefail
          rm -rf work/qtbase-archival-v2
          mkdir -p work/qtbase-archival-v2/result
          jq '
            .sources |= map(
              select(
                .source == "qtbase-opensource-src"
                and .source_version == "5.15.2+dfsg-9+grm3u1"
              )
            )
          ' arm64/locks/sources-api-baseline/source-lock.json \
            > work/qtbase-archival-v2/seed.json
          test "$(jq '.sources | length' work/qtbase-archival-v2/seed.json)" = 1

      - name: Search direct indexes, then raw archival captures
        run: |
          set -euxo pipefail
          PYTHONPATH=arm64/scripts \
          python3 arm64/scripts/resolve_source_apt_archival_fast.py \
            --seed-lock work/qtbase-archival-v2/seed.json \
            --evidence arm64/locks .github/workflows arm64/scripts \
            --output-dir work/qtbase-archival-v2/result \
            --max-indexes 40
          jq . work/qtbase-archival-v2/result/apt-source-lock-summary.json
          # Captured content cannot be promoted by this workflow.
          test "$(jq -r '.summary.archival_candidate_count // 0' \
            work/qtbase-archival-v2/result/apt-source-lock.json)" -ge 0
          if [ "$(jq -r '.summary.archival_recovery_url_count // 0' \
            work/qtbase-archival-v2/result/apt-source-lock.json)" -gt 0 ]; then
            test "$(jq -r '[.sources[] | select(.status == "resolved" and (.selected.transport_recovery // {} | length) > 0)] | length' \
              work/qtbase-archival-v2/result/apt-source-lock.json)" = 0
          fi
          find work/qtbase-archival-v2/result -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/qtbase-archival-v2/result/LOCKSUMS.sha256
          sha256sum --check work/qtbase-archival-v2/result/LOCKSUMS.sha256

      - name: Upload candidate source payload and transport provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtbase-5.15.2-grm3u1-archival-source-candidate-v2
          path: work/qtbase-archival-v2/result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
