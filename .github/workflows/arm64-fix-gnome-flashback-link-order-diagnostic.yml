name: ARM64 fix - gnome-flashback link-order diagnostic input layout

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-gnome-flashback-link-order-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0
      - name: Flatten the three exact authority DEBs and republish
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin arm64-port
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-debug-gnome-flashback-link-order.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '''          gh run download "$VENDOR_RUN_ID" \\
            --repo "$GITHUB_REPOSITORY" \\
            --name "$VENDOR_ARTIFACT_NAME" \\
            --dir "$root/vendor"
          target_name="gnome-flashback_${VERSION}_amd64.deb"
          '''
          replacement = '''          gh run download "$VENDOR_RUN_ID" \\
            --repo "$GITHUB_REPOSITORY" \\
            --name "$VENDOR_ARTIFACT_NAME" \\
            --dir "$root/vendor"
          mkdir -p "$root/target-debs"
          for filename in \\
            "gnome-flashback_${VERSION}_amd64.deb" \\
            "gnome-flashback-common_${VERSION}_all.deb" \\
            "gnome-session-flashback_${VERSION}_all.deb"; do
            mapfile -t authority_matches < <(find "$root/vendor" -type f -name "$filename" -print)
            test "${#authority_matches[@]}" -eq 1
            cp -a "${authority_matches[0]}" "$root/target-debs/$filename"
          done
          target_name="gnome-flashback_${VERSION}_amd64.deb"
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'download anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          old = '            --target-deb-dir "$root/vendor" \\\n'
          new = '            --target-deb-dir "$root/target-debs" \\\n'
          if text.count(old) != 1:
              raise SystemExit(f'target directory anchor count: {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/arm64-fix-gnome-flashback-link-order-diagnostic.yml
          git add .github/workflows/arm64-debug-gnome-flashback-link-order.yml
          git commit -m 'Fix gnome-flashback link-order diagnostic inputs'
          git push origin HEAD:arm64-port
