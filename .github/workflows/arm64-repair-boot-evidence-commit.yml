name: ARM64 port - repair boot evidence commit paths

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-boot-evidence-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-boot-evidence-commit
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install YAML parser
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Make first-failure evidence commits independent of success paths
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          replacements = {
              Path('.github/workflows/arm64-stage0-live-v4.yml'): (
                  "          git add arm64/locks/stage0-v4-attempt arm64/locks/stage0-v4\n",
                  "          git add -A arm64/locks/stage0-v4-attempt\n"
                  "          if [ -e arm64/locks/stage0-v4 ]; then\n"
                  "            git add -A arm64/locks/stage0-v4\n"
                  "          fi\n",
              ),
              Path('.github/workflows/arm64-minimal-boot-iso-v3.yml'): (
                  "          git add arm64/locks/minimal-boot-v3-attempt arm64/locks/minimal-boot-v3\n",
                  "          git add -A arm64/locks/minimal-boot-v3-attempt\n"
                  "          if [ -e arm64/locks/minimal-boot-v3 ]; then\n"
                  "            git add -A arm64/locks/minimal-boot-v3\n"
                  "          fi\n",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'refusing unexpected workflow revision: {path}: count={text.count(old)}'
                  )
              text = text.replace(old, new)
              yaml.safe_load(text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and retrigger the corrected boot gates
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/arm64-stage0-live-v4.yml \
            .github/workflows/arm64-minimal-boot-iso-v3.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Always preserve first ARM64 boot failure evidence'
          git pull --rebase origin arm64-port
          git push origin HEAD:arm64-port
