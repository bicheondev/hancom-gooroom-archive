name: ARM64 port - verify preserved QtBase ARM64 build

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-verify-preserved-qtbase-run31501210331.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-verify-preserved-qtbase-run31501210331
  cancel-in-progress: false

env:
  SOURCE_NAME: qtbase-opensource-src
  TARGET_VERSION: 5.15.2+dfsg-9+grm3u1
  SOURCE_BUILD_RUN_ID: '31501210331'
  SOURCE_BUILD_ARTIFACT_ID: '9128919234'
  SOURCE_BUILD_ARTIFACT_NAME: qtbase-reconstructed-arm64-diagnostics-31501210331
  SOURCE_BUILD_ARTIFACT_SHA256: 3aaefe81234fa4a4e8a30c789b65f200abd49ef3915948c48e19f92974d89acf
  SOURCE_BUILD_CHECKOUT_SHA: c1ff1bcfa4285a8c44d400d3d47f186e908b7f58
  RECONSTRUCTION_RUN_ID: '31497018080'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact verifier and reconstruction authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install deterministic verification tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates dpkg-dev file gh jq python3 unzip
          python3 -m py_compile \
            arm64/scripts/verify_recovered_source_archive_arm64.py \
            arm64/scripts/verify_reconstructed_qtbase_arm64.py
          jq -e '
            .source == "qtbase-opensource-src"
            and .source_version == "5.15.2+dfsg-9+grm3u1"
            and .source_status == "reconstructed-not-recovered-original-source"
            and .byte_identity_claimed == false
            and .promotion_allowed == false
            and .claims.only_vendor_declared_code_patch_added == true
            and .claims.lost_original_source_archive_recovered == false
          ' arm64/locks/qtbase-grm3u1-reconstruction/latest/authority.json >/dev/null

      - name: Download the exact successful build artifact by immutable ID
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work/output
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_BUILD_ARTIFACT_ID}" \
            > work/source-artifact-metadata.json
          jq -e \
            --arg name "$SOURCE_BUILD_ARTIFACT_NAME" \
            --arg digest "sha256:$SOURCE_BUILD_ARTIFACT_SHA256" \
            --argjson run_id "$SOURCE_BUILD_RUN_ID" '
              .id == 9128919234
              and .name == $name
              and .expired == false
              and .digest == $digest
              and .workflow_run.id == $run_id
            ' work/source-artifact-metadata.json >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_BUILD_ARTIFACT_ID}/zip" \
            > work/source-artifact.zip
          echo "$SOURCE_BUILD_ARTIFACT_SHA256  work/source-artifact.zip" | sha256sum --check --strict
          unzip -q work/source-artifact.zip -d work/output
          test "$(cat work/output/logs/dpkg-buildpackage.exit-code)" = 0
          test "$(cat work/output/logs/outer-build.exit-code)" = 0
          test -f work/output/libqt5core5a_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5dbus5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5gui5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5network5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5printsupport5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5sql5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5test5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5widgets5_${TARGET_VERSION}_arm64.deb
          test -f work/output/libqt5xml5_${TARGET_VERSION}_arm64.deb
          echo "artifact_name=qtbase-opensource-src-reconstructed-exact-arm64-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify all packages, versions, and native payload machines
        shell: bash
        run: |
          set -euxo pipefail
          result=work/output/result.json
          artifact_name='${{ steps.source.outputs.artifact_name }}'
          rm -f "$result"
          python3 arm64/scripts/verify_reconstructed_qtbase_arm64.py \
            --output-dir work/output \
            --reconstruction-authority arm64/locks/qtbase-grm3u1-reconstruction/latest/authority.json \
            --generic-verifier arm64/scripts/verify_recovered_source_archive_arm64.py \
            --result "$result" \
            --artifact-name "$artifact_name"
          jq \
            --arg source_build_run_id "$SOURCE_BUILD_RUN_ID" \
            --arg source_build_artifact_id "$SOURCE_BUILD_ARTIFACT_ID" \
            --arg source_build_artifact_name "$SOURCE_BUILD_ARTIFACT_NAME" \
            --arg source_build_artifact_sha256 "$SOURCE_BUILD_ARTIFACT_SHA256" \
            --arg source_build_checkout_sha "$SOURCE_BUILD_CHECKOUT_SHA" \
            --arg reconstruction_run_id "$RECONSTRUCTION_RUN_ID" '
              . + {
                preserved_build_provenance: {
                  source_build_run_id: $source_build_run_id,
                  source_build_artifact_id: $source_build_artifact_id,
                  source_build_artifact_name: $source_build_artifact_name,
                  source_build_artifact_sha256: $source_build_artifact_sha256,
                  source_build_checkout_sha: $source_build_checkout_sha,
                  reconstruction_run_id: $reconstruction_run_id
                }
              }
            ' "$result" > "$result.tmp"
          mv "$result.tmp" "$result"
          jq -e '
            .passed == true
            and .verification_passed == true
            and .source == "qtbase-opensource-src"
            and .source_version == "5.15.2+dfsg-9+grm3u1"
            and .source_status == "reconstructed-not-recovered-original-source"
            and .required_package_count == 9
            and .foreign_payload_count == 0
            and .native_arm64_build_verified == true
            and .original_source_archive_recovered == false
            and .promotion_allowed == false
            and .verified_core_payload.kind == "ELF"
            and .verified_core_payload.machine == 183
            and .verified_core_payload.architecture == "arm64"
            and .preserved_build_provenance.source_build_artifact_id == "9128919234"
          ' "$result" >/dev/null
          (
            cd work/output
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload complete verified ARM64 QtBase package set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: work/output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

      - name: Commit compact verified ARM64 build authority
        shell: bash
        run: |
          set -euxo pipefail
          destination=arm64/locks/qtbase-grm3u1-arm64-build/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          cp work/output/result.json "$destination/"
          cp work/output/SHA256SUMS "$destination/artifact-SHA256SUMS"
          cp work/source-artifact-metadata.json "$destination/"
          cp arm64/locks/qtbase-grm3u1-reconstruction/latest/authority.json \
            "$destination/reconstruction-authority.json"
          jq -n \
            --arg reconstruction_run_id "$RECONSTRUCTION_RUN_ID" \
            --arg reconstruction_authority_sha256 "$(sha256sum arm64/locks/qtbase-grm3u1-reconstruction/latest/authority.json | awk '{print $1}')" \
            --arg source_build_run_id "$SOURCE_BUILD_RUN_ID" \
            --arg source_build_artifact_id "$SOURCE_BUILD_ARTIFACT_ID" \
            --arg source_build_artifact_name "$SOURCE_BUILD_ARTIFACT_NAME" \
            --arg source_build_artifact_sha256 "$SOURCE_BUILD_ARTIFACT_SHA256" \
            --arg source_build_checkout_sha "$SOURCE_BUILD_CHECKOUT_SHA" \
            --arg verification_run_id "$GITHUB_RUN_ID" \
            --arg verified_artifact_name '${{ steps.source.outputs.artifact_name }}' '
              {
                schema: 2,
                source: "qtbase-opensource-src",
                source_version: "5.15.2+dfsg-9+grm3u1",
                source_status: "reconstructed-not-recovered-original-source",
                reconstruction_run_id: $reconstruction_run_id,
                reconstruction_authority_sha256: $reconstruction_authority_sha256,
                source_build_run_id: $source_build_run_id,
                source_build_artifact_id: $source_build_artifact_id,
                source_build_artifact_name: $source_build_artifact_name,
                source_build_artifact_sha256: $source_build_artifact_sha256,
                source_build_checkout_sha: $source_build_checkout_sha,
                verification_run_id: $verification_run_id,
                verified_artifact_name: $verified_artifact_name,
                required_package_count: 9,
                native_arm64_build_verified: true,
                foreign_payload_count: 0,
                original_source_archive_recovered: false,
                source_gate_closed: false,
                package_layer_promotion_allowed: false,
                iso_assembly_allowed: false
              }
            ' > "$destination/authority.json"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Verify preserved reconstructed QtBase ARM64 build'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
