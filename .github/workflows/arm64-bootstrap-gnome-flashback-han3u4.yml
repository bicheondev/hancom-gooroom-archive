name: ARM64 port - stage gnome-flashback han3u4 plain blobs

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-bootstrap-gnome-flashback-han3u4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-gnome-flashback-han3u4-plain-blobs
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Decode, validate, and stage immutable plain Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work/files
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          import zlib

          payloads = {
              'arm64/scripts/verify_gnome_flashback_han3u4_arm64.py': (
                  'fb0fc9cfd467f2795069b58d003815bc35e4e5bb',
                  'aa43bf923308ebc8a63993b38ba1302c982bd9529bd20fd49064a86098c497ec',
              ),
              'arm64/scripts/promote_gnome_flashback_han3u4.py': (
                  '55d5c3998ff403622f94472420a513a819c509fc',
                  '1116779def5e40188d2594f1595ad1d8a9e23a6e83b2f445027d2c84cfde52e5',
              ),
              '.github/workflows/arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml': (
                  '1888925216e225aba6392b908b0f1fa8292eaff4',
                  '6d8d700839137ff2271a778621bef50084a51cccc8435d17a393073270f87954',
              ),
          }
          api = os.environ['GITHUB_API_URL']
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          rows = []
          for name, (compressed_blob_sha, expected_sha256) in payloads.items():
              request = urllib.request.Request(
                  f'{api}/repos/{repository}/git/blobs/{compressed_blob_sha}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  source = json.load(response)
              if source.get('encoding') != 'base64':
                  raise SystemExit(f'{name}: unexpected compressed blob encoding')
              compressed = base64.b64decode(source['content'])
              clear = zlib.decompress(compressed)
              digest = hashlib.sha256(clear).hexdigest()
              if digest != expected_sha256:
                  raise SystemExit(f'{name}: decoded SHA-256 mismatch: {digest}')

              local = Path('work/files') / name
              local.parent.mkdir(parents=True, exist_ok=True)
              local.write_bytes(clear)

              body = json.dumps({
                  'content': base64.b64encode(clear).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              create = urllib.request.Request(
                  f'{api}/repos/{repository}/git/blobs',
                  data=body,
                  headers=headers,
                  method='POST',
              )
              with urllib.request.urlopen(create, timeout=60) as response:
                  staged = json.load(response)
              plain_blob_sha = staged.get('sha')
              if not isinstance(plain_blob_sha, str) or len(plain_blob_sha) != 40:
                  raise SystemExit(f'{name}: invalid staged blob response: {staged}')
              rows.append({
                  'path': name,
                  'mode': '100755' if name.endswith('.py') else '100644',
                  'compressed_blob_sha': compressed_blob_sha,
                  'plain_blob_sha': plain_blob_sha,
                  'size': len(clear),
                  'sha256': digest,
              })

          Path('work/blob-map.json').write_text(
              json.dumps({'schema': 1, 'files': rows}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY

          python3 -m py_compile \
            work/files/arm64/scripts/verify_gnome_flashback_han3u4_arm64.py \
            work/files/arm64/scripts/promote_gnome_flashback_han3u4.py
          grep -Fq 'runs-on: ubuntu-24.04-arm' \
            work/files/.github/workflows/arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml
          test "$(jq '.files | length' work/blob-map.json)" = 3

      - name: Upload the staged plain-blob map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnome-flashback-han3u4-plain-blobs-${{ github.run_id }}
          path: work/blob-map.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
