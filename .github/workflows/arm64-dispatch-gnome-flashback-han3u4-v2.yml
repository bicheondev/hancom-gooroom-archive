name: ARM64 port - dispatch current gnome-flashback ELF differential

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dispatch-gnome-flashback-han3u4-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: hancom-gooroom-33-dispatch-current-gnome-flashback-elf-differential
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch the current exact AMD64 ELF differential
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run \
            arm64-debug-gnome-flashback-han3u4.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port
