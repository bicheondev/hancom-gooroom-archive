name: ARM64 port - dispatch exact gooroom-guide reconstruction v3

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dispatch-gooroom-guide-reconstruction-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: arm64-dispatch-exact-gooroom-guide-reconstruction-v3
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the permanent end-to-end workflow at the current branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run \
              arm64-reconstruct-build-promote-gooroom-guide-han3u1.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
