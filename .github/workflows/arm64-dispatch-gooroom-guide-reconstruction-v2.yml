name: ARM64 port - dispatch gooroom-guide retained diagnostics v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dispatch-gooroom-guide-reconstruction-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: arm64-dispatch-gooroom-guide-retained-diagnostics-v2
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch retained AMD64 ELF diagnostics at the current branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run \
              arm64-diagnose-gooroom-guide-amd64-elf.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
