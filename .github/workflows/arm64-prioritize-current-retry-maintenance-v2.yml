name: ARM64 port - prioritize newest infrastructure retry v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-prioritize-current-retry-maintenance-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-prioritize-current-retry-maintenance-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Prioritize the newest repaired builder run
        shell: bash
        run: |
          set -euxo pipefail
          workflow=.github/workflows/arm64-infrastructure-retry-v3.yml
          test -f "$workflow"
          count="$(grep -c '^  cancel-in-progress: false$' "$workflow" || true)"
          if [ "$count" = 1 ]; then
            sed -i 's/^  cancel-in-progress: false$/  cancel-in-progress: true/' "$workflow"
          elif ! grep -qx '  cancel-in-progress: true' "$workflow"; then
            echo 'expected retry concurrency setting was not found' >&2
            exit 1
          fi
          grep -A2 '^concurrency:' "$workflow"

          git rm -f .github/workflows/arm64-prioritize-current-retry-maintenance-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Prioritize the newest ARM64 infrastructure retry builder'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
