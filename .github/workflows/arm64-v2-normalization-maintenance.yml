name: ARM64 port - normalize v2 rootfs and ISO path

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-v2-normalization-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-v2-normalization
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Keep only complete v2 rootfs and finalizer definitions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arm64-final-live-iso.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'arm64/scripts/finalize_arm64_live_rootfs.sh',
              'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
          )
          if 'arm64/scripts/finalize_arm64_live_rootfs_v2.sh' not in text:
              raise SystemExit('final live ISO workflow was not updated to v2')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/arm64-exact-rootfs.yml 2>/dev/null || true
          git rm -f .github/workflows/arm64-rootfs-artifact-maintenance.yml 2>/dev/null || true
          git rm -f .github/workflows/arm64-live-finalizer-maintenance.yml 2>/dev/null || true
          git rm -f arm64/scripts/finalize_arm64_live_rootfs.sh 2>/dev/null || true
          git rm -f .github/workflows/arm64-v2-normalization-maintenance.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-final-live-iso.yml
          git commit -m 'Normalize ARM64 rootfs and final ISO v2 path'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
