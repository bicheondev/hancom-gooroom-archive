name: ARM64 port - audit exact-source control plane v3

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-exact-source-control-plane-audit-v3.yml'
      - '.github/workflows/arm64-source-keyring-lock.yml'
      - '.github/workflows/arm64-wayback-source-recovery.yml'
      - '.github/workflows/arm64-source-authority-v4.yml'
      - '.github/workflows/arm64-native-rebuild-controller-v3.yml'
      - '.github/workflows/arm64-rebuild-failure-audit-v3.yml'
      - '.github/workflows/arm64-dependency-retry-controller-v3.yml'
      - '.github/workflows/arm64-publish-rebuild-packages-v3.yml'
      - '.github/workflows/arm64-package-acquisition-plan-v3.yml'
      - '.github/workflows/arm64-port-coverage-v2.yml'
      - 'arm64/scripts/audit_exact_source_control_plane_v3.py'
      - 'arm64/scripts/**v3*'
      - 'arm64/scripts/**v4*'
      - 'arm64/scripts/**v5*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-exact-source-control-plane-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete active control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Audit exact authority, controllers, pins, and follow-up wiring
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf work/exact-source-control-plane-audit-v3
          mkdir -p work/exact-source-control-plane-audit-v3
          set +e
          python3 arm64/scripts/audit_exact_source_control_plane_v3.py \
            --workflow-dir .github/workflows \
            --script-dir arm64/scripts \
            --output-dir work/exact-source-control-plane-audit-v3 \
            2>&1 | tee work/exact-source-control-plane-audit-v3/workflow-audit.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/exact-source-control-plane-audit-v3 -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/exact-source-control-plane-audit-v3/LOCKSUMS.sha256
          cat work/exact-source-control-plane-audit-v3/summary.json

      - name: Upload complete control-plane audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-exact-source-control-plane-audit-v3-${{ github.run_id }}
          path: work/exact-source-control-plane-audit-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit audit status before enforcing it
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/status/exact-source-control-plane-v3
          mkdir -p arm64/status/exact-source-control-plane-v3
          cp -a work/exact-source-control-plane-audit-v3/. \
            arm64/status/exact-source-control-plane-v3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/exact-source-control-plane-v3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Audit exact Git and signed DSC ARM64 control plane v3'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce a single pinned fail-closed active graph
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.audit.outputs.exit_code }}' = '0'
          jq -e '.passed == true and .error_count == 0' \
            work/exact-source-control-plane-audit-v3/summary.json
