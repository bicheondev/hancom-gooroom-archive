name: ARM64 port - probe Wayback for exact blocker dsc

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-probe-wayback-blocker-dsc.yml'
      - 'arm64/scripts/probe_wayback_blocker_dsc.py'
      - 'arm64/locks/apt-source-fallback-v2/unresolved.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-wayback-blocker-dsc
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact blocker URLs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Probe CDX and verify captured Source and Version fields
        id: probe
        shell: bash
        run: |
          set -uxo pipefail
          rm -rf work/wayback-dsc-probe
          mkdir -p work/wayback-dsc-probe
          set +e
          python3 arm64/scripts/probe_wayback_blocker_dsc.py \
            --unresolved arm64/locks/apt-source-fallback-v2/unresolved.json \
            --output-dir work/wayback-dsc-probe \
            2>&1 | tee work/wayback-dsc-probe/workflow.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/wayback-dsc-probe -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/wayback-dsc-probe/LOCKSUMS.sha256
          cat work/wayback-dsc-probe/summary.json

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-wayback-blocker-dsc-probe
          path: work/wayback-dsc-probe
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit the capture inventory without promoting it to source authority
        if: always()
        run: |
          set -euxo pipefail
          target=arm64/locks/wayback-dsc-probe
          rm -rf "$target"
          mkdir -p "$target"
          cp -a work/wayback-dsc-probe/. "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Probe Wayback for exact missing vendor source descriptors'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce successful completion of the discovery probe
        if: always()
        run: |
          set -euxo pipefail
          test '${{ steps.probe.outputs.exit_code }}' = '0'
          jq -e '.target_count == 9' work/wayback-dsc-probe/summary.json
