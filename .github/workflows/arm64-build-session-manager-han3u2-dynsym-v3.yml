name: ARM64 build session manager han3u2 after ABI v3

on:
  push:
    branches: [arm64-port]
    paths:
      - 'arm64/locks/gooroom-session-manager-han3u2-dynsym-v3/latest/authority.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: arm64-build-session-manager-han3u2-dynsym-v3
  cancel-in-progress: false

env:
  SOURCE: gooroom-session-manager
  VERSION: 0.3.9+grm3u1+han3u2
  SEMANTIC_AUTHORITY: arm64/locks/gooroom-session-manager-han3u2-dynsym-v3/latest/authority.json
  SOURCE_ARTIFACT_ID: '9395357037'
  SOURCE_ARTIFACT_NAME: gooroom-session-manager-han3u2-reconstruction-v1
  SOURCE_ARTIFACT_DIGEST: sha256:dd3cfe2bef25a3df27dba5b7f5ad62a19743c98ed9e1adfcd8e6c439bc9ae7bf
  LOCK_DIR: arm64/locks/gooroom-session-manager-han3u2-arm64-build/latest

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out ARM64 authority branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install host and emulation tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binfmt-support ca-certificates dpkg-dev file jq \
            qemu-user-static unzip
          docker run --rm --privileged tonistiigi/binfmt:qemu-v8.1.5 \
            --install arm64
          rm -rf work/session-manager-arm64-v3
          mkdir -p work/session-manager-arm64-v3/{artifact,source,output,validation}

      - name: Require semantic ABI v3 authority
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$SEMANTIC_AUTHORITY"
          jq -e --arg package "$SOURCE" --arg version "$VERSION" '
            .schema == 3 and
            .package == $package and
            .version == $version and
            .semantic_binary_equivalent_v3 == true and
            .source_reconstruction_semantically_verified == true and
            .arm64_build_allowed == true and
            .package_layer_promotion_allowed == true and
            .source_artifact.id == "9395357037" and
            .source_artifact.digest == "sha256:dd3cfe2bef25a3df27dba5b7f5ad62a19743c98ed9e1adfcd8e6c439bc9ae7bf"
          ' "$SEMANTIC_AUTHORITY" >/dev/null

      - name: Download immutable reconstructed source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          root=work/session-manager-arm64-v3
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            > "$root/artifact/metadata.json"
          jq -e \
            --arg id "$SOURCE_ARTIFACT_ID" \
            --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" '
              (.id | tostring) == $id and
              .name == $name and
              .digest == $digest and
              .expired == false
            ' "$root/artifact/metadata.json" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > "$root/artifact/source.zip"
          unzip -q "$root/artifact/source.zip" -d "$root/artifact/unpacked"
          archive="$(find "$root/artifact/unpacked" -type f \
            -path '*/source-authority/reconstructed-source.tar' -print -quit)"
          lock="$(find "$root/artifact/unpacked" -type f \
            -path '*/source-authority/source-lock.json' -print -quit)"
          test -n "$archive"
          test -n "$lock"
          jq -e --arg package "$SOURCE" --arg version "$VERSION" '
            .schema == 1 and .package == $package and .version == $version and
            .source_archive_sha256 != null and .reconstructed_tree_sha != null
          ' "$lock" >/dev/null
          test "$(sha256sum "$archive" | awk '{print $1}')" = \
            "$(jq -r '.source_archive_sha256' "$lock")"
          tar -xf "$archive" -C "$root/source"
          test "$(dpkg-parsechangelog -l"$root/source/debian/changelog" -SVersion)" = "$VERSION"
          cp "$lock" "$root/validation/source-lock.json"

      - name: Build native ARM64 packages in Debian 11
        shell: bash
        run: |
          set -euxo pipefail
          root="$(pwd)/work/session-manager-arm64-v3"
          source_date_epoch="$(date -u -d "$(dpkg-parsechangelog -l"$root/source/debian/changelog" -SDate)" +%s)"
          chmod -R a+rX "$root/source"
          docker run --rm --platform linux/arm64 \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEB_BUILD_OPTIONS='parallel=2 nocheck' \
            -e DEB_BUILD_MAINT_OPTIONS='hardening=+all reproducible=+fixfilepath' \
            -e SOURCE_DATE_EPOCH="$source_date_epoch" \
            -v "$root/source:/input:ro" \
            -v "$root/output:/output" \
            debian:bullseye \
            bash -euxo pipefail -c '
              printf "%s\n" \
                "deb http://deb.debian.org/debian bullseye main contrib non-free" \
                "deb http://deb.debian.org/debian bullseye-updates main contrib non-free" \
                "deb http://security.debian.org/debian-security bullseye-security main contrib non-free" \
                > /etc/apt/sources.list
              apt-get -o Acquire::Retries=6 update
              apt-get -o Acquire::Retries=6 install -y --no-install-recommends \
                build-essential ca-certificates debhelper devscripts dpkg-dev \
                equivs fakeroot git
              mkdir -p /build/source
              cp -a /input/. /build/source/
              cd /build/source
              mk-build-deps --install --remove \
                --tool "apt-get -o Acquire::Retries=6 -y --no-install-recommends" \
                debian/control
              dpkg-buildpackage -b -us -uc -j2
              cp -av /build/*.deb /build/*.buildinfo /build/*.changes /output/
            '
          test -n "$(find "$root/output" -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Verify metadata and reject every foreign ELF
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('work/session-manager-arm64-v3')
          output = root / 'output'
          extracted = root / 'validation' / 'extracted'
          extracted.mkdir(parents=True, exist_ok=True)
          source = os.environ['SOURCE']
          version = os.environ['VERSION']
          packages = []
          errors = []

          def field(path, name):
              return subprocess.check_output(
                  ['dpkg-deb', '-f', str(path), name], text=True
              ).strip()

          for deb in sorted(output.glob('*.deb')):
              package = field(deb, 'Package')
              actual_version = field(deb, 'Version')
              architecture = field(deb, 'Architecture')
              source_field = field(deb, 'Source').split(' ', 1)[0]
              pkgroot = extracted / package
              subprocess.run(['dpkg-deb', '-x', str(deb), str(pkgroot)], check=True)
              elfs = []
              for path in sorted(p for p in pkgroot.rglob('*') if p.is_file()):
                  with path.open('rb') as stream:
                      if stream.read(4) != b'\x7fELF':
                          continue
                  desc = subprocess.check_output(['file', '-b', str(path)], text=True).strip()
                  arm64 = 'ARM aarch64' in desc or 'ARM64' in desc
                  elfs.append({
                      'path': path.relative_to(pkgroot).as_posix(),
                      'file': desc,
                      'arm64': arm64,
                  })
                  if not arm64:
                      errors.append({'kind': 'foreign-elf', 'package': package, 'file': desc})
              checks = {
                  'version': actual_version == version,
                  'architecture': architecture in {'arm64', 'all'},
                  'source': source_field == source,
              }
              if not all(checks.values()):
                  errors.append({'kind': 'metadata', 'package': package, 'checks': checks})
              packages.append({
                  'filename': deb.name,
                  'package': package,
                  'version': actual_version,
                  'architecture': architecture,
                  'size': deb.stat().st_size,
                  'sha256': hashlib.sha256(deb.read_bytes()).hexdigest(),
                  'elfs': elfs,
              })

          principal = [p for p in packages if p['package'] == source and p['architecture'] == 'arm64']
          if len(principal) != 1:
              errors.append({'kind': 'principal-package-count', 'count': len(principal)})
          report = {
              'schema': 1,
              'source': source,
              'version': version,
              'target_architecture': 'arm64',
              'packages': packages,
              'package_count': len(packages),
              'principal_package_count': len(principal),
              'foreign_elf_count': sum(e['kind'] == 'foreign-elf' for e in errors),
              'verified': bool(packages) and not errors,
              'errors': errors,
          }
          (root / 'validation' / 'build-verification.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if not report['verified']:
              raise SystemExit(json.dumps(report, indent=2, sort_keys=True))
          PY
          jq -e '.verified == true and .foreign_elf_count == 0 and .principal_package_count == 1' \
            work/session-manager-arm64-v3/validation/build-verification.json >/dev/null

      - name: Upload verified native package bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-session-manager-han3u2-arm64-${{ github.run_id }}
          path: |
            work/session-manager-arm64-v3/output
            work/session-manager-arm64-v3/validation/build-verification.json
            work/session-manager-arm64-v3/validation/source-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Seal package-promotion authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          root=work/session-manager-arm64-v3
          artifact_name="gooroom-session-manager-han3u2-arm64-${GITHUB_RUN_ID}"
          artifact=''
          for attempt in $(seq 1 20); do
            artifact="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | jq -c --arg name "$artifact_name" \
                '[.artifacts[] | select(.name == $name and .expired == false)] | last // empty')"
            test -z "$artifact" || break
            sleep 3
          done
          test -n "$artifact"
          rm -rf "$LOCK_DIR"
          mkdir -p "$LOCK_DIR"
          cp "$root/validation/build-verification.json" "$LOCK_DIR/"
          cp "$root/validation/source-lock.json" "$LOCK_DIR/"
          printf '%s\n' "$artifact" > "$LOCK_DIR/artifact-metadata.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          semantic_path = Path(os.environ['SEMANTIC_AUTHORITY'])
          semantic = json.loads(semantic_path.read_text(encoding='utf-8'))
          root = Path('work/session-manager-arm64-v3/validation')
          verification = json.loads((root / 'build-verification.json').read_text())
          artifact = json.loads(Path(os.environ['LOCK_DIR'], 'artifact-metadata.json').read_text())
          authority = {
              'schema': 1,
              'source': os.environ['SOURCE'],
              'source_version': os.environ['VERSION'],
              'target_architecture': 'arm64',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'actions_run_id': os.environ['GITHUB_RUN_ID'],
              'semantic_authority_path': str(semantic_path),
              'semantic_authority_sha256': hashlib.sha256(semantic_path.read_bytes()).hexdigest(),
              'semantic_binary_equivalent_v3': semantic['semantic_binary_equivalent_v3'],
              'native_arm64_build_verified': verification['verified'],
              'foreign_elf_count': verification['foreign_elf_count'],
              'package_layer_promotion_allowed': bool(
                  semantic['semantic_binary_equivalent_v3'] and
                  verification['verified'] and
                  verification['foreign_elf_count'] == 0 and
                  verification['principal_package_count'] == 1
              ),
              'packages': [
                  {k: row[k] for k in ('filename','package','version','architecture','size','sha256')}
                  for row in verification['packages']
              ],
              'artifact': {
                  'id': str(artifact['id']),
                  'name': artifact['name'],
                  'digest': artifact.get('digest'),
                  'size_in_bytes': artifact['size_in_bytes'],
                  'expired': artifact['expired'],
              },
              'policy': 'canonical-amd64-runtime-abi-equivalence-plus-native-arm64-build-plus-zero-foreign-elf',
          }
          Path(os.environ['LOCK_DIR'], 'package-promotion-authority.json').write_text(
              json.dumps(authority, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          (
            cd "$LOCK_DIR"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          jq -e '.package_layer_promotion_allowed == true and .foreign_elf_count == 0' \
            "$LOCK_DIR/package-promotion-authority.json" >/dev/null

      - name: Commit compact native-build authority
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOCK_DIR"
          git commit -m 'Lock session manager han3u2 native ARM64 build'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
