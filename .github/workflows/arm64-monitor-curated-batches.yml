name: ARM64 port - monitor initial curated rebuild batches and advance

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-monitor-curated-batches.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-monitor-curated-batches
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out branch for the final launch record and self-removal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Wait until no curated batch run remains queued or in progress
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/curated-monitor
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$start" > work/curated-monitor/started-at.txt
          for iteration in $(seq 1 330); do
            gh run list \
              --repo '${{ github.repository }}' \
              --workflow arm64-native-rebuild-batch-v2.yml \
              --branch arm64-port \
              --limit 30 \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle,event \
              > work/curated-monitor/runs.json
            active="$(jq '[.[] | select(
              .status == "queued"
              or .status == "in_progress"
              or .status == "pending"
              or .status == "requested"
              or .status == "waiting"
            )] | length' work/curated-monitor/runs.json)"
            jq -n \
              --argjson iteration "$iteration" \
              --argjson active "$active" \
              --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{iteration:$iteration,active_run_count:$active,checked_at:$checked_at}' \
              | tee -a work/curated-monitor/poll.jsonl
            if [ "$active" -eq 0 ]; then
              break
            fi
            sleep 60
          done
          active="$(jq '[.[] | select(
            .status == "queued"
            or .status == "in_progress"
            or .status == "pending"
            or .status == "requested"
            or .status == "waiting"
          )] | length' work/curated-monitor/runs.json)"
          test "$active" = 0
          jq '{
            schema: 1,
            workflow: "arm64-native-rebuild-batch-v2.yml",
            completed_count: ([.[] | select(.status == "completed")] | length),
            success_count: ([.[] | select(.conclusion == "success")] | length),
            failure_count: ([.[] | select(.conclusion == "failure")] | length),
            cancelled_count: ([.[] | select(.conclusion == "cancelled")] | length),
            latest_runs: .
          }' work/curated-monitor/runs.json \
            > work/curated-monitor/summary.json

      - name: Advance package, failure, coverage, and acquisition gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          dispatch() {
            local workflow="$1"
            for attempt in 1 2 3 4; do
              if gh workflow run "$workflow" \
                --repo '${{ github.repository }}' \
                --ref arm64-port; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          dispatch arm64-publish-rebuild-packages.yml
          dispatch arm64-rebuild-failure-audit.yml
          dispatch arm64-port-coverage.yml
          dispatch arm64-package-acquisition-plan-v2.yml
          dispatch arm64-ci-state-snapshot.yml

      - name: Persist monitor evidence and remove the one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          rm -rf arm64/status/curated-batch-monitor
          mkdir -p arm64/status/curated-batch-monitor
          cp work/curated-monitor/summary.json arm64/status/curated-batch-monitor/
          cp work/curated-monitor/poll.jsonl arm64/status/curated-batch-monitor/
          cp work/curated-monitor/started-at.txt arm64/status/curated-batch-monitor/
          git rm -f .github/workflows/arm64-monitor-curated-batches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/curated-batch-monitor
          git commit -m 'Record completion of initial curated ARM64 rebuild batches'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
