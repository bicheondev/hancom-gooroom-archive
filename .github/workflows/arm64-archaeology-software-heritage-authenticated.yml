name: ARM64 port - authenticated Software Heritage exact-source archaeology

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-authenticated-software-heritage-archaeology
  cancel-in-progress: true

jobs:
  archaeology:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SWH_BEARER_TOKEN: ${{ secrets.SWH_BEARER_TOKEN }}
    steps:
      - name: Check out exact package changelog evidence and archaeology code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Require a repository-scoped Software Heritage bearer token
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$SWH_BEARER_TOKEN"
          printf 'Software Heritage authentication is configured.\n'

      - name: Verify authenticated and exact-source programs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            arm64/scripts/archaeology_software_heritage_exact_sources.py \
            arm64/scripts/run_software_heritage_archaeology_authenticated.py

      - name: Traverse all archived candidate origins with authenticated pacing
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/software-heritage-authenticated-archaeology
          mkdir -p work/software-heritage-authenticated-archaeology
          python3 arm64/scripts/run_software_heritage_archaeology_authenticated.py \
            --output-dir work/software-heritage-authenticated-archaeology \
            --timeout 35
          jq -e '
            .schema == 1
            and .target_count == 7
            and .exact_revision_target_count >= 0
            and .exact_revision_target_count <= 7
            and .unresolved_target_count + .exact_revision_target_count == 7
            and .promotion_allowed == false
          ' work/software-heritage-authenticated-archaeology/summary.json >/dev/null

      - name: Seal complete positive or negative authenticated evidence
        shell: bash
        run: |
          set -euxo pipefail
          evidence=work/software-heritage-authenticated-archaeology
          (
            cd "$evidence"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          {
            echo '## Authenticated Software Heritage exact-source archaeology'
            echo
            echo '```json'
            cat "$evidence/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete authenticated archaeology evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-authenticated-software-heritage-archaeology
          path: work/software-heritage-authenticated-archaeology
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Merge authenticated results into current exact-source authority
        shell: bash
        run: |
          set -euxo pipefail
          source=work/software-heritage-authenticated-archaeology
          destination=arm64/locks/software-heritage-exact-source-archaeology/latest
          mkdir -p "$destination"
          for name in \
            gnome-flashback \
            gooroom-dockbarx-applet \
            gooroom-guide \
            gooroom-integration-applet \
            gooroom-session-manager \
            linux \
            qtbase-opensource-src; do
            rm -rf "$destination/$name"
            cp -a "$source/$name" "$destination/$name"
          done
          cp "$source/summary.json" \
            "$destination/authenticated-summary.json"
          cp "$source/LOCKSUMS.sha256" \
            "$destination/authenticated-LOCKSUMS.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Audit exact sources with authenticated Software Heritage access'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
