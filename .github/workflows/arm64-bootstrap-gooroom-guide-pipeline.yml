name: ARM64 port - install gooroom-guide reconstruction pipeline

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-bootstrap-gooroom-guide-pipeline.yml'
      - '.github/bootstrap-assets/gooroom-guide-pipeline.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: arm64-bootstrap-gooroom-guide-pipeline
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the latest ARM64 evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install reviewed files and self-remove
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/bootstrap-assets/gooroom-guide-pipeline.part1 \
              .github/bootstrap-assets/gooroom-guide-pipeline.part2 \
            | base64 -d > /tmp/gooroom-guide-pipeline.tar.xz
          echo '55435fa5d8caf833ed9d948cee422d86e0cb649ca534dbf5a41564bfdca91d79  /tmp/gooroom-guide-pipeline.tar.xz' \
            | sha256sum --check --strict -
          tar -xJf /tmp/gooroom-guide-pipeline.tar.xz -C .
          chmod 0755 arm64/scripts/promote_gooroom_guide_han3u1.py
          python3 -m py_compile \
            arm64/scripts/reconstruct_gooroom_guide_han3u1.py \
            arm64/scripts/verify_gooroom_guide_han3u1_amd64.py \
            arm64/scripts/verify_gooroom_guide_arm64.py \
            arm64/scripts/promote_gooroom_guide_han3u1.py
          bash -n arm64/scripts/build_gooroom_guide_han3u1_chroot.sh
          grep -Fq 'gooroom-guide_0.5.3+grm3u1+han3u1_amd64.deb' \
            .github/workflows/arm64-reconstruct-build-promote-gooroom-guide-han3u1.yml
          rm -f \
            .github/bootstrap-assets/gooroom-guide-pipeline.part1 \
            .github/bootstrap-assets/gooroom-guide-pipeline.part2 \
            .github/workflows/arm64-bootstrap-gooroom-guide-pipeline.yml

      - name: Commit and push the permanent pipeline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            arm64/scripts/reconstruct_gooroom_guide_han3u1.py \
            arm64/scripts/build_gooroom_guide_han3u1_chroot.sh \
            arm64/scripts/verify_gooroom_guide_han3u1_amd64.py \
            arm64/scripts/verify_gooroom_guide_arm64.py \
            arm64/scripts/promote_gooroom_guide_han3u1.py \
            .github/workflows/arm64-reconstruct-build-promote-gooroom-guide-han3u1.yml \
            .github/workflows/arm64-bootstrap-gooroom-guide-pipeline.yml \
            .github/bootstrap-assets/gooroom-guide-pipeline.part1 \
            .github/bootstrap-assets/gooroom-guide-pipeline.part2
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Permanent gooroom-guide pipeline is already current.'
          else
            git commit -m 'Add exact gooroom-guide han3u1 ARM64 reconstruction pipeline'
            pushed=false
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin arm64-port
              if git push origin HEAD:arm64-port; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            test "$pushed" = true
          fi

      - name: Dispatch the permanent end-to-end workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run arm64-reconstruct-build-promote-gooroom-guide-han3u1.yml \
              --repo "$GITHUB_REPOSITORY" --ref arm64-port; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
