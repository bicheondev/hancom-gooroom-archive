name: ARM64 capture blocker workflow runs v1

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-capture-blocker-runs-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0
      - name: Capture latest blocker runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=arm64/status/blocker-runs-v1
          mkdir -p "$out"
          workflows=(
            arm64-analyze-integration-applet-han3u3-reconstruction-v2.yml
            arm64-orchestrate-integration-applet-han3u3-v1.yml
            arm64-orchestrate-session-manager-han3u2-v1.yml
            arm64-orchestrate-kernel-resolution-v1.yml
            arm64-resolve-linux-5.10.0-23-grm3u1-v1.yml
            arm64-final-convergence-v1.yml
          )
          printf '{"schema":1,"captured_at":"%s","workflows":[' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$out/latest.json"
          first=true
          for workflow in "${workflows[@]}"; do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=arm64-port&per_page=10" > "$out/${workflow}.json" 2>"$out/${workflow}.err"; then
              row="$(jq -c --arg workflow "$workflow" '{workflow:$workflow,registered:true,runs:[.workflow_runs[]|{id,name,event,status,conclusion,head_sha,run_number,created_at,updated_at,html_url}]}' "$out/${workflow}.json")"
            else
              row="$(jq -n -c --arg workflow "$workflow" --arg error "$(cat "$out/${workflow}.err")" '{workflow:$workflow,registered:false,error:$error,runs:[]}')"
            fi
            if [[ "$first" == true ]]; then first=false; else printf ',' >> "$out/latest.json"; fi
            printf '%s' "$row" >> "$out/latest.json"
          done
          printf ']}' >> "$out/latest.json"
          jq '.' "$out/latest.json" > "$out/latest.pretty.json"
          mv "$out/latest.pretty.json" "$out/latest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out/latest.json"
          git commit -m 'Record latest ARM64 blocker runs' || exit 0
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
