name: ARM64 port - coordinate source key and Wayback recovery v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-source-recovery-monitor-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-source-recovery-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Check out the branch for compact monitor evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Dispatch a fresh keyring and Wayback recovery pair
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/source-recovery-monitor-v2
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$start" > work/source-recovery-monitor-v2/started-at.txt
          gh workflow run arm64-source-keyring-lock.yml \
            --repo '${{ github.repository }}' --ref arm64-port
          gh workflow run arm64-wayback-source-recovery.yml \
            --repo '${{ github.repository }}' --ref arm64-port
          echo "started_at=$start" >> "$GITHUB_OUTPUT"

      - name: Require a post-dispatch run from both workflows and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euxo pipefail
          workflows=(
            arm64-source-keyring-lock.yml
            arm64-wayback-source-recovery.yml
          )
          : > work/source-recovery-monitor-v2/poll.jsonl
          for iteration in $(seq 1 230); do
            active=0
            seen_workflows=0
            combined='[]'
            for workflow in "${workflows[@]}"; do
              output="work/source-recovery-monitor-v2/${workflow%.yml}.json"
              gh run list \
                --repo '${{ github.repository }}' \
                --workflow "$workflow" \
                --branch arm64-port \
                --limit 20 \
                --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle \
                > "$output.all"
              jq --arg start "$STARTED_AT" \
                '[.[] | select(.createdAt >= $start)]' \
                "$output.all" > "$output"
              seen="$(jq 'length' "$output")"
              if [ "$seen" -gt 0 ]; then
                seen_workflows=$((seen_workflows + 1))
              fi
              count="$(jq '[.[] | select(
                .status == "queued"
                or .status == "in_progress"
                or .status == "pending"
                or .status == "requested"
                or .status == "waiting"
              )] | length' "$output")"
              active=$((active + count))
              combined="$(jq -cn \
                --argjson left "$combined" \
                --arg workflow "$workflow" \
                --slurpfile rows "$output" \
                '$left + [($rows[0][] | . + {workflow:$workflow})]')"
            done
            jq -cn \
              --argjson iteration "$iteration" \
              --argjson active "$active" \
              --argjson seen_workflows "$seen_workflows" \
              --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                iteration:$iteration,
                active_run_count:$active,
                seen_workflow_count:$seen_workflows,
                checked_at:$checked_at
              }' | tee -a work/source-recovery-monitor-v2/poll.jsonl
            printf '%s\n' "$combined" > work/source-recovery-monitor-v2/runs.json
            if [ "$seen_workflows" -eq 2 ] && [ "$active" -eq 0 ]; then
              break
            fi
            sleep 60
          done
          seen_workflows="$(jq '[.[].workflow] | unique | length' \
            work/source-recovery-monitor-v2/runs.json)"
          active="$(jq '[.[] | select(
            .status == "queued"
            or .status == "in_progress"
            or .status == "pending"
            or .status == "requested"
            or .status == "waiting"
          )] | length' work/source-recovery-monitor-v2/runs.json)"
          test "$seen_workflows" = 2
          test "$active" = 0
          jq '{
            schema: 2,
            completed_count: ([.[] | select(.status == "completed")] | length),
            success_count: ([.[] | select(.conclusion == "success")] | length),
            failure_count: ([.[] | select(.conclusion == "failure")] | length),
            cancelled_count: ([.[] | select(.conclusion == "cancelled")] | length),
            workflows_seen: ([.[].workflow] | unique),
            runs: .
          }' work/source-recovery-monitor-v2/runs.json \
            > work/source-recovery-monitor-v2/summary.json

      - name: Merge authority only after both fresh recovery runs finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-source-authority-v4.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port

      - name: Commit monitor evidence and remove both one-shot coordinators
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          rm -rf arm64/status/source-recovery-monitor
          mkdir -p arm64/status/source-recovery-monitor
          cp work/source-recovery-monitor-v2/summary.json \
            arm64/status/source-recovery-monitor/
          cp work/source-recovery-monitor-v2/poll.jsonl \
            arm64/status/source-recovery-monitor/
          cp work/source-recovery-monitor-v2/started-at.txt \
            arm64/status/source-recovery-monitor/
          git rm -f \
            .github/workflows/arm64-source-recovery-monitor.yml \
            .github/workflows/arm64-source-recovery-monitor-v2.yml \
            2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/source-recovery-monitor .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record coordinated exact source recovery completion'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
