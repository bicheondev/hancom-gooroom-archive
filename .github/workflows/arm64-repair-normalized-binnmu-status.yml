name: ARM64 port - repair normalized source-exact binNMU status

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-normalized-binnmu-status.yml'
      - 'arm64/scripts/repair_normalized_binnmu_status.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-normalized-binnmu-status
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the package-map normalizer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install source-exact binNMU aliases
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_normalized_binnmu_status.py \
            --target arm64/scripts/normalize_debian_arm64_map.py
          python3 -m py_compile \
            arm64/scripts/repair_normalized_binnmu_status.py \
            arm64/scripts/normalize_debian_arm64_map.py
          grep -Fq '"source-exact-binnmu"' \
            arm64/scripts/normalize_debian_arm64_map.py

      - name: Commit corrected package-map normalization
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/normalize_debian_arm64_map.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Normalize source-exact ARM64 binNMU mappings'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
