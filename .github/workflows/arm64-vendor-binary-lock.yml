name: ARM64 port - lock exact historical vendor binaries

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-vendor-binary-lock.yml'
      - 'arm64/scripts/lock_vendor_binaries.py'
      - 'arm64/locks/reference/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-vendor-binary-lock
  cancel-in-progress: true

env:
  ISO_NAME: Hancom-Gooroom-3.3-amd64.hybrid.iso
  ISO_SIZE: '1566277632'
  ISO_SHA256: ba3ac40c66c255bccb53b7e5e8bbe1fdee6cec93a63669d1f4c9d75555d7644a

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install image and package tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools dpkg-dev jq ca-certificates

      - name: Extract historical vendor indexes from the exact ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p work/iso-root work/vendor-indexes
          gh release download v3.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ISO_NAME" \
            --dir work
          test "$(stat -c '%s' "work/$ISO_NAME")" = "$ISO_SIZE"
          printf '%s  %s\n' "$ISO_SHA256" "work/$ISO_NAME" | sha256sum --check --strict
          xorriso -osirrox on -indev "work/$ISO_NAME" -extract / work/iso-root
          SQUASHFS="$(find work/iso-root -type f -name filesystem.squashfs -print -quit)"
          test -n "$SQUASHFS"
          unsquashfs -cat "$SQUASHFS" \
            var/lib/apt/lists/update.hancomgooroom.com_gooroom_dists_gooroom-3.0_main_binary-amd64_Packages \
            > work/vendor-indexes/gooroom-Packages
          unsquashfs -cat "$SQUASHFS" \
            var/lib/apt/lists/update.hancomgooroom.com_hancom_dists_hancom-3.0_main_binary-amd64_Packages \
            > work/vendor-indexes/hancom-Packages
          sha256sum work/vendor-indexes/* | sort -k2 > work/vendor-indexes/INDEXSUMS.sha256

      - name: Download and verify every exact vendor binary still in the pool
        id: lock
        run: |
          set -uxo pipefail
          rm -rf work/vendor-binary-lock work/vendor-debs
          set +e
          python3 arm64/scripts/lock_vendor_binaries.py \
            --reference arm64/locks/reference/amd64-reference.json \
            --packages work/vendor-indexes/gooroom-Packages \
            --packages-metadata '{"repository":"gooroom","suite":"gooroom-3.0","base_url":"http://update.hancomgooroom.com/gooroom"}' \
            --packages work/vendor-indexes/hancom-Packages \
            --packages-metadata '{"repository":"hancom","suite":"hancom-3.0","base_url":"http://update.hancomgooroom.com/hancom"}' \
            --output-dir work/vendor-binary-lock \
            --download-dir work/vendor-debs \
            --workers 8 \
            --attempts 4
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/vendor-binary-lock -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > work/vendor-binary-lock/LOCKSUMS.sha256
          find work/vendor-debs -type f -name '*.deb' -print0 \
            | sort -z | xargs -0 -r sha256sum > work/vendor-binary-lock/DEBSUMS.sha256
          cat work/vendor-binary-lock/vendor-binary-lock-summary.json

      - name: Upload locked reference binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-exact-vendor-debs
          path: |
            work/vendor-debs
            work/vendor-indexes/INDEXSUMS.sha256
            work/vendor-binary-lock
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit the binary lock manifest
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/vendor-binaries
          mkdir -p arm64/locks/vendor-binaries
          cp -a work/vendor-binary-lock/. arm64/locks/vendor-binaries/
          cp work/vendor-indexes/INDEXSUMS.sha256 arm64/locks/vendor-binaries/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/vendor-binaries
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Lock exact Hancom Gooroom 3.3 vendor binaries'
          git pull --rebase origin arm64-port
          git push origin HEAD:arm64-port

      - name: Report incomplete pool retention without substituting versions
        run: |
          set -euxo pipefail
          jq . work/vendor-binary-lock/vendor-binary-lock-summary.json
          if [ '${{ steps.lock.outputs.exit_code }}' != '0' ]; then
            echo 'Some installed packages are no longer present in the vendor pool; they remain recoverable from the ISO rootfs only.' >&2
          fi
