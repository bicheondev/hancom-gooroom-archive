name: ARM64 port - consolidate exact source recovery

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-summarize-exact-source-recovery.yml'
      - 'arm64/scripts/summarize_exact_source_recovery.py'
      - 'arm64/locks/reference-iso-source-residue/latest/**'
      - 'arm64/locks/exact-source-recovery-v2/latest/**'
      - 'arm64/locks/exact-source-commoncrawl/latest/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-consolidated-exact-source-recovery
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current ARM64 recovery authorities
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Validate summarizer and build consolidated authority
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile arm64/scripts/summarize_exact_source_recovery.py
          output=work/consolidated-exact-source-recovery
          rm -rf "$output"
          mkdir -p "$output"
          python3 arm64/scripts/summarize_exact_source_recovery.py \
            --reference arm64/locks/reference-iso-source-residue/latest \
            --wayback-v2 arm64/locks/exact-source-recovery-v2/latest \
            --commoncrawl arm64/locks/exact-source-commoncrawl/latest \
            --output-dir "$output"
          jq -e '
            .schema == 1
            and .target_count == 7
            and (.recovered_pending_verification_count + .unresolved_count == 7)
            and .package_layer_promotion_allowed == false
            and .iso_assembly_allowed == false
          ' "$output/summary.json" >/dev/null

      - name: Seal consolidated authority
        shell: bash
        run: |
          set -euxo pipefail
          output=work/consolidated-exact-source-recovery
          (
            cd "$output"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Publish consolidated report in the run summary
        shell: bash
        run: |
          set -euxo pipefail
          cat work/consolidated-exact-source-recovery/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated exact-source authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-consolidated-exact-source-recovery
          path: work/consolidated-exact-source-recovery
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Commit consolidated authority
        shell: bash
        run: |
          set -euxo pipefail
          source=work/consolidated-exact-source-recovery
          destination=arm64/status/exact-source-recovery
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$source/." "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            echo 'Consolidated exact-source recovery authority is already current.'
            exit 0
          fi
          git commit -m 'Consolidate exact source recovery authority'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
