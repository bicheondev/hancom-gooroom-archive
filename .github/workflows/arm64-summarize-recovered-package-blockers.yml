name: ARM64 port - summarize recovered package blockers

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-summarize-recovered-package-blockers.yml'
      - 'arm64/scripts/summarize_recovered_package_blockers.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-summarize-recovered-package-blockers
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recovered package evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Select latest complete recovered package audit
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' > work-source.env
          from pathlib import Path

          root = Path('arm64/locks/recovered-package-pool')
          candidates = []
          for directory in root.iterdir() if root.exists() else []:
              if not directory.is_dir() or not directory.name.isdigit():
                  continue
              if (directory / 'summary.json').is_file() and (directory / 'blockers.json').is_file():
                  candidates.append(directory)
          if not candidates:
              raise SystemExit('no complete recovered package audit exists')
          selected = max(candidates, key=lambda path: int(path.name))
          print(f"source_dir={selected}")
          print(f"source_run_id={selected.name}")
          PY
          cat work-source.env >> "$GITHUB_OUTPUT"
          cat work-source.env

      - name: Build compact reason and source authority
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/blocker-summary
          python3 -m py_compile arm64/scripts/summarize_recovered_package_blockers.py
          python3 arm64/scripts/summarize_recovered_package_blockers.py \
            --blockers '${{ steps.source.outputs.source_dir }}/blockers.json' \
            --summary '${{ steps.source.outputs.source_dir }}/summary.json' \
            --output-dir work/blocker-summary
          jq -e '.blocker_count > 0 and .source_group_count > 0' \
            work/blocker-summary/compact-blockers.json
          sha256sum work/blocker-summary/* | sort -k2 \
            > work/blocker-summary/LOCKSUMS.sha256

      - name: Upload compact blocker authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-arm64-compact-blockers-${{ steps.source.outputs.source_run_id }}
          path: work/blocker-summary
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit latest compact blocker authority
        shell: bash
        run: |
          set -euxo pipefail
          target=arm64/locks/recovered-package-pool/latest
          rm -rf "$target"
          mkdir -p "$target"
          cp -a work/blocker-summary/. "$target/"
          jq -n \
            --arg source_run_id '${{ steps.source.outputs.source_run_id }}' \
            --arg actions_run_id '${{ github.run_id }}' \
            '{schema:1,source_recovery_run_id:$source_run_id,summary_actions_run_id:$actions_run_id}' \
            > "$target/artifact-lock.json"
          sha256sum "$target"/* | sort -k2 > "$target/LOCKSUMS.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Summarize latest ARM64 package blockers'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
