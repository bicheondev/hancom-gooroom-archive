name: ARM64 port - final v2 consolidation including graphical boot gate

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-final-consolidation-v2-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-final-consolidation
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Wait for earlier one-shot writers and reset to latest branch
        shell: bash
        run: |
          set -euxo pipefail
          sleep 120
          git fetch origin arm64-port
          git reset --hard origin/arm64-port

      - name: Apply every secret-safe v2 patch idempotently
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'actions/checkout@v4': 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'actions/download-artifact@v4': 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093',
              'docker/setup-qemu-action@v3': 'docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130',
              'arm64/scripts/build_locked_source_arm64.sh': 'arm64/scripts/build_locked_source_arm64_v2.sh',
              'arm64/scripts/collect_native_rebuild_results.py': 'arm64/scripts/collect_native_rebuild_results_v2.py',
              'arm64/scripts/finalize_arm64_live_rootfs.sh': 'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
              'arm64/scripts/build_package_acquisition_plan.py': 'arm64/scripts/build_package_acquisition_plan_v2.py',
              'arm64/scripts/materialize_package_acquisition_plan.py': 'arm64/scripts/materialize_package_acquisition_plan_v2.py',
              'arm64/scripts/prepare_rebuild_release_assets.py': 'arm64/scripts/prepare_rebuild_release_assets_v2.py',
              'arm64/scripts/configure_graphical_boot_gate.sh': 'arm64/scripts/configure_graphical_boot_gate_v2.sh',
              'arm64-dependency-retry.yml': 'arm64-dependency-retry-v2.yml',
          }
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile \
            arm64/scripts/wire_progress_dispatches.py \
            arm64/scripts/wire_installed_boot_dispatch.py \
            arm64/scripts/wire_graphical_boot_gate_v2.py
          python3 arm64/scripts/wire_progress_dispatches.py \
            --workflow-dir .github/workflows
          python3 arm64/scripts/wire_installed_boot_dispatch.py \
            --workflow .github/workflows/arm64-final-live-iso.yml
          python3 arm64/scripts/wire_graphical_boot_gate_v2.py \
            --final-workflow .github/workflows/arm64-final-live-iso.yml \
            --live-qemu arm64/scripts/test_arm64_iso_qemu.sh \
            --installed-qemu arm64/scripts/test_arm64_installed_disk_qemu.sh

      - name: Remove superseded scripts and all one-shot workflows
        shell: bash
        run: |
          set -euxo pipefail
          superseded_workflows=(
            .github/workflows/arm64-native-rebuild-batch.yml
            .github/workflows/arm64-exact-rootfs.yml
            .github/workflows/arm64-package-acquisition-plan.yml
            .github/workflows/arm64-dependency-retry.yml
            .github/workflows/arm64-package-smoke.yml
            .github/workflows/arm64-start-curated-batches.yml
          )
          superseded_scripts=(
            arm64/scripts/build_locked_source_arm64.sh
            arm64/scripts/finalize_arm64_live_rootfs.sh
            arm64/scripts/build_package_acquisition_plan.py
            arm64/scripts/prepare_rebuild_release_assets.py
            arm64/scripts/collect_native_rebuild_results.py
            arm64/scripts/configure_graphical_boot_gate.sh
            arm64/scripts/wire_graphical_boot_gate.py
          )
          for path in "${superseded_workflows[@]}" "${superseded_scripts[@]}"; do
            git rm -f "$path" 2>/dev/null || rm -f "$path"
          done
          while IFS= read -r -d '' path; do
            git rm -f "$path" 2>/dev/null || rm -f "$path"
          done < <(find .github/workflows -maxdepth 1 -type f \
            -name '*maintenance*.yml' -print0 | sort -z)

      - name: Commit final consolidated graph
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows arm64/scripts
          if git diff --cached --quiet; then
            echo 'Final v2 graph was already consolidated.'
            exit 0
          fi
          git commit -m 'Consolidate final graphical Hancom Gooroom ARM64 v2 pipeline'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Dispatch authoritative audits and active controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          dispatch() {
            local workflow="$1"
            shift
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" \
                --repo '${{ github.repository }}' \
                --ref arm64-port "$@"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          dispatch arm64-workflow-secret-audit.yml
          dispatch arm64-active-pipeline-audit.yml
          dispatch arm64-pipeline-lint.yml
          dispatch arm64-pipeline-unit-tests.yml
          dispatch arm64-lock-schema-audit.yml || true
          dispatch arm64-effective-source-lock.yml || true
          dispatch arm64-baseline-rebuild-evidence.yml || true
          dispatch arm64-native-rebuild-backlog.yml -f limit=6 || true
          dispatch arm64-rebuild-failure-audit.yml || true
          dispatch arm64-publish-rebuild-packages.yml || true
          dispatch arm64-package-acquisition-plan-v2.yml || true
          dispatch arm64-ci-state-snapshot.yml || true
