name: ARM64 port - finalize single v2 execution path

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-final-cleanup-maintenance-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-final-v2-cleanup
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Normalize every active workflow to immutable v2 components
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'actions/download-artifact@v4': 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093',
              'docker/setup-qemu-action@v3': 'docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130',
              'arm64/scripts/build_locked_source_arm64.sh': 'arm64/scripts/build_locked_source_arm64_v2.sh',
              'arm64/scripts/collect_native_rebuild_results.py': 'arm64/scripts/collect_native_rebuild_results_v2.py',
              'arm64/scripts/finalize_arm64_live_rootfs.sh': 'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
              'arm64/scripts/build_package_acquisition_plan.py': 'arm64/scripts/build_package_acquisition_plan_v2.py',
              'arm64/scripts/materialize_package_acquisition_plan.py': 'arm64/scripts/materialize_package_acquisition_plan_v2.py',
              'arm64/scripts/prepare_rebuild_release_assets.py': 'arm64/scripts/prepare_rebuild_release_assets_v2.py',
              'arm64-dependency-retry.yml': 'arm64-dependency-retry-v2.yml',
          }
          changed = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY

          superseded_workflows=(
            .github/workflows/arm64-native-rebuild-batch.yml
            .github/workflows/arm64-exact-rootfs.yml
            .github/workflows/arm64-package-acquisition-plan.yml
            .github/workflows/arm64-dependency-retry.yml
            .github/workflows/arm64-package-smoke.yml
            .github/workflows/arm64-rebuild-workflow-maintenance.yml
            .github/workflows/arm64-rebuild-workflow-maintenance-v2.yml
            .github/workflows/arm64-rootfs-artifact-maintenance.yml
            .github/workflows/arm64-live-finalizer-maintenance.yml
            .github/workflows/arm64-v2-normalization-maintenance.yml
            .github/workflows/arm64-persistent-acquisition-maintenance.yml
            .github/workflows/arm64-builder-v2-maintenance.yml
            .github/workflows/arm64-pin-actions-maintenance.yml
            .github/workflows/arm64-final-cleanup-maintenance-v3.yml
          )
          superseded_scripts=(
            arm64/scripts/build_locked_source_arm64.sh
            arm64/scripts/finalize_arm64_live_rootfs.sh
            arm64/scripts/build_package_acquisition_plan.py
            arm64/scripts/prepare_rebuild_release_assets.py
            arm64/scripts/collect_native_rebuild_results.py
          )
          for path in "${superseded_workflows[@]}" "${superseded_scripts[@]}"; do
            git rm -f "$path" 2>/dev/null || rm -f "$path"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows arm64/scripts
          if git diff --cached --quiet; then
            echo 'No v2 normalization changes were required.'
          else
            git commit -m 'Finalize single Hancom Gooroom ARM64 v2 execution path'
            for attempt in 1 2 3 4; do
              git pull --rebase origin arm64-port
              if git push origin HEAD:arm64-port; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Dispatch audits and current build waves on the normalized branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          workflows=(
            arm64-active-pipeline-audit.yml
            arm64-pipeline-lint.yml
            arm64-lock-schema-audit.yml
            arm64-normalize-package-map.yml
            arm64-port-coverage.yml
            arm64-publish-rebuild-packages.yml
            arm64-package-acquisition-plan-v2.yml
            arm64-baseline-rebuild-evidence.yml
            arm64-dependency-retry-v2.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" \
              --repo '${{ github.repository }}' \
              --ref arm64-port || true
          done
          gh workflow run arm64-native-rebuild-backlog.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port \
            -f limit=6 || true
