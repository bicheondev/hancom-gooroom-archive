name: ARM64 bootstrap integration applet vendor source debug v6 repair

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml'
      - 'arm64/triggers/integration-applet-vendor-source-debug-v6-bootstrap'

permissions:
  contents: write

concurrency:
  group: arm64-bootstrap-integration-applet-vendor-source-debug-v6-repair
  cancel-in-progress: true

env:
  SOURCE_COMMIT: f1f3376268c9dd96aa73265fd3737c1fdad10d2c
  TARGET: .github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml
  ONE_SHOT: .github/workflows/arm64-fix-vendor-source-debug-v6-once.yml

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Restore, patch, and validate the recovery workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "${SOURCE_COMMIT}:${TARGET}"
          git show "${SOURCE_COMMIT}:${TARGET}" > "$TARGET"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['TARGET'])
          text = path.read_text(encoding='utf-8')

          old_version = '\n'.join([
              '            version = subprocess.check_output(',
              "                ['dpkg-parsechangelog', '-l', str(dsc), '-SVersion'],",
              '                text=True,',
              '            ).strip()',
              "            if version != '0.3.1+grm3u1+han3u3':",
              "                raise RuntimeError(f'unexpected source version: {version}')",
              '',
          ])
          new_version = '\n'.join([
              '            version_match = re.search(',
              "                r'^Version:\\s*(\\S+)\\s*$',",
              '                text,',
              '                flags=re.MULTILINE,',
              '            )',
              '            if not version_match:',
              "                raise RuntimeError('Version field was not found in vendor DSC')",
              '            version = version_match.group(1)',
              "            if version != '0.3.1+grm3u1+han3u3':",
              "                raise RuntimeError(f'unexpected source version: {version}')",
              '',
          ])
          if old_version not in text:
              raise SystemExit('DSC version parser anchor not found in locked source workflow')
          text = text.replace(old_version, new_version, 1)

          old_match = "              'exact_matching_debug_payload_recovered': len(matching_files) == len(target_ids) and bool(target_ids),\n"
          new_match = "              'exact_matching_debug_payload_recovered': ({row['build_id'] for row in matching_files} == target_ids and bool(target_ids)),\n"
          if old_match not in text:
              raise SystemExit('debug Build-ID matcher anchor not found in locked source workflow')
          text = text.replace(old_match, new_match, 1)

          workflow_path = "      - '.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml'\n"
          recovery_trigger = "      - 'arm64/triggers/integration-applet-vendor-source-debug-v6'\n"
          if recovery_trigger not in text:
              if workflow_path not in text:
                  raise SystemExit('push path anchor not found in locked source workflow')
              text = text.replace(workflow_path, workflow_path + recovery_trigger, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -F "Version field was not found in vendor DSC" "$TARGET"
          grep -F "{row['build_id'] for row in matching_files} == target_ids" "$TARGET"
          grep -F "arm64/triggers/integration-applet-vendor-source-debug-v6" "$TARGET"
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0), aliases: true)' "$TARGET"
          git diff --check -- "$TARGET"

      - name: Commit the restored repair and retire the one-shot
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if [[ -e "$ONE_SHOT" ]]; then
            git rm "$ONE_SHOT"
          fi
          git diff --cached --check
          git commit -m 'Repair integration applet vendor source and debug recovery v6'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
