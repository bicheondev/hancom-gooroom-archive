name: ARM64 port - native exact-source rebuild batch v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-native-rebuild-batch-v2.yml'
      - 'arm64/rebuild-batches.json'
      - 'arm64/scripts/select_native_rebuild_batch.py'
      - 'arm64/scripts/verify_arm64_rebuild.py'
      - 'arm64/scripts/collect_native_rebuild_results_v2.py'
  workflow_dispatch:
    inputs:
      batch:
        description: Rebuild batch from arm64/rebuild-batches.json
        required: true
        default: desktop-leaf-1
        type: choice
        options:
          - desktop-leaf-1
          - desktop-leaf-2
          - desktop-core-1
          - system-core-1

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-native-rebuild-${{ github.event.inputs.batch || 'desktop-leaf-1' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      batch: ${{ steps.plan.outputs.batch }}
      lock_path: ${{ steps.plan.outputs.lock_path }}
    steps:
      - name: Check out exact locks and rebuild tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Select exact-source native rebuilds
        id: plan
        shell: bash
        run: |
          set -euxo pipefail
          batch='${{ github.event.inputs.batch }}'
          test -n "$batch" || batch=desktop-leaf-1

          lock=arm64/locks/sources-api-baseline/source-lock.json
          if [ -f arm64/locks/effective-sources/effective-source-lock.json ]; then
            lock=arm64/locks/effective-sources/effective-source-lock.json
          fi
          test -f "$lock"

          mkdir -p work
          python3 arm64/scripts/select_native_rebuild_batch.py \
            --lock "$lock" \
            --reference arm64/locks/reference/amd64-reference.json \
            --plan arm64/rebuild-batches.json \
            --batch "$batch" \
            --output work/native-rebuild-plan.json

          echo "matrix=$(jq -c '.matrix' work/native-rebuild-plan.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r '.selected_count' work/native-rebuild-plan.json)" >> "$GITHUB_OUTPUT"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "lock_path=$lock" >> "$GITHUB_OUTPUT"

          {
            echo '## Native ARM64 rebuild plan'
            echo
            echo "- Batch: \`$batch\`"
            echo "- Exact lock: \`$lock\`"
            echo "- Selected: \`$(jq -r '.selected_count' work/native-rebuild-plan.json)\`"
            echo "- Skipped: \`$(jq -r '.skipped_count' work/native-rebuild-plan.json)\`"
            echo
            echo '```json'
            jq '{selected, skipped}' work/native-rebuild-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable batch plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-arm64-rebuild-plan-${{ steps.plan.outputs.batch }}
          path: work/native-rebuild-plan.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out exact source locks and builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Verify native ARM64 host and install verifier tools
        shell: bash
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'This rebuild must execute on native ARM64.' >&2; exit 1 ;;
          esac
          docker version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git jq dpkg-dev ca-certificates python3
          python3 -m py_compile \
            arm64/scripts/select_native_rebuild_batch.py \
            arm64/scripts/verify_arm64_rebuild.py \
            arm64/scripts/collect_native_rebuild_results_v2.py

      - name: Build exact locked source as native ARM64
        id: build
        continue-on-error: true
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z
          HANCOM_GOOROOM_REFERENCE_JSON: arm64/locks/reference/amd64-reference.json
          HANCOM_GOOROOM_REQUIRED_PACKAGES: ${{ matrix.required_native_packages_space }}
        shell: bash
        run: |
          set -o pipefail
          output="work/rebuild/${{ matrix.source }}"
          rm -rf "$output"
          mkdir -p "$output"
          chmod +x arm64/scripts/build_locked_source_arm64_v2.sh
          set +e
          arm64/scripts/build_locked_source_arm64_v2.sh \
            '${{ needs.plan.outputs.lock_path }}' \
            '${{ matrix.source }}' \
            "$output" \
            2>&1 | tee "$output/workflow-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify versions, source identity, architecture, and ELF payloads
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/verify_arm64_rebuild.py \
            --lock '${{ needs.plan.outputs.lock_path }}' \
            --reference arm64/locks/reference/amd64-reference.json \
            --source '${{ matrix.source }}' \
            --source-version '${{ matrix.source_version }}' \
            --directory 'work/rebuild/${{ matrix.source }}' \
            --output 'work/rebuild/${{ matrix.source }}/verification.json'

      - name: Write structured matrix result
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          output='work/rebuild/${{ matrix.source }}'
          mkdir -p "$output"
          jq -n \
            --arg source '${{ matrix.source }}' \
            --arg source_version '${{ matrix.source_version }}' \
            --arg repository '${{ matrix.repository_full_name }}' \
            --arg commit_sha '${{ matrix.commit_sha }}' \
            --arg tree_sha '${{ matrix.tree_sha }}' \
            --arg build_outcome '${{ steps.build.outcome }}' \
            --arg build_exit_code '${{ steps.build.outputs.exit_code }}' \
            --arg verify_outcome '${{ steps.verify.outcome }}' \
            --argjson required_native_packages '${{ toJSON(matrix.required_native_packages) }}' \
            --argjson reused_all_packages '${{ toJSON(matrix.reused_all_packages) }}' \
            '{
              schema: 1,
              source: $source,
              source_version: $source_version,
              repository_full_name: $repository,
              commit_sha: $commit_sha,
              tree_sha: $tree_sha,
              build_outcome: $build_outcome,
              build_exit_code: $build_exit_code,
              verify_outcome: $verify_outcome,
              required_native_packages: $required_native_packages,
              reused_all_packages: $reused_all_packages,
              passed: ($build_outcome == "success" and $verify_outcome == "success")
            }' > "$output/job-result.json"

      - name: Upload package and complete failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: work/rebuild/${{ matrix.source }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce successful build and verification
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          jq -e '.passed == true' 'work/rebuild/${{ matrix.source }}/job-result.json'

  collect:
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download all package and failure artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: arm64-rebuild-*
          path: work/rebuild-artifacts
          merge-multiple: false

      - name: Convert artifacts to compact persistent evidence
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/rebuild-results
          python3 arm64/scripts/collect_native_rebuild_results_v2.py \
            --artifacts-dir work/rebuild-artifacts \
            --output-dir work/rebuild-results \
            --run-id '${{ github.run_id }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --batch '${{ needs.plan.outputs.batch }}'
          find work/rebuild-results -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/rebuild-results/LOCKSUMS.sha256
          cat work/rebuild-results/summary.json

      - name: Upload consolidated rebuild evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-arm64-rebuild-results-${{ needs.plan.outputs.batch }}-${{ github.run_id }}
          path: work/rebuild-results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit compact success and failure records
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p arm64/locks/rebuild-results/runs/${{ github.run_id }}
          cp work/rebuild-results/summary.json \
            arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          cp work/rebuild-results/failed.json \
            arm64/locks/rebuild-results/runs/${{ github.run_id }}/
          cp work/rebuild-results/LOCKSUMS.sha256 \
            arm64/locks/rebuild-results/runs/${{ github.run_id }}/

          while IFS= read -r result; do
            relative="${result#work/rebuild-results/}"
            destination="arm64/locks/rebuild-results/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$result" "$destination"
          done < <(find work/rebuild-results -mindepth 3 -type f -name '*.json' | sort)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/rebuild-results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record native ARM64 rebuild batch ${{ needs.plan.outputs.batch }}"

          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Publish newly completed curated batch packages explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          dispatch() {
            local workflow="$1"
            shift
            for attempt in 1 2 3 4; do
              if gh workflow run "$workflow" \
                --repo '${{ github.repository }}' \
                --ref arm64-port "$@"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          if [ -f work/rebuild-results/summary.json ] \
             && [ "$(jq -r '.passed_count // 0' work/rebuild-results/summary.json)" -gt 0 ]; then
            dispatch arm64-publish-rebuild-packages.yml
          fi
          dispatch arm64-port-coverage.yml || true
