name: ARM64 port - export consolidated v2 patch

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-export-v2-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hancom-gooroom-33-export-v2-consolidation
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the current port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Produce the exact consolidation working tree
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euxo pipefail
          base_commit="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"

          python3 -B - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'actions/download-artifact@v4': 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093',
              'docker/setup-qemu-action@v3': 'docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130',
              'arm64/scripts/build_locked_source_arm64.sh': 'arm64/scripts/build_locked_source_arm64_v2.sh',
              'arm64/scripts/collect_native_rebuild_results.py': 'arm64/scripts/collect_native_rebuild_results_v2.py',
              'arm64/scripts/finalize_arm64_live_rootfs.sh': 'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
              'arm64/scripts/build_package_acquisition_plan.py': 'arm64/scripts/build_package_acquisition_plan_v2.py',
              'arm64/scripts/materialize_package_acquisition_plan.py': 'arm64/scripts/materialize_package_acquisition_plan_v2.py',
              'arm64/scripts/prepare_rebuild_release_assets.py': 'arm64/scripts/prepare_rebuild_release_assets_v2.py',
              'arm64/scripts/configure_graphical_boot_gate.sh': 'arm64/scripts/configure_graphical_boot_gate_v2.sh',
              'arm64-dependency-retry.yml': 'arm64-dependency-retry-v2.yml',
          }
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          python3 -B arm64/scripts/wire_progress_dispatches.py \
            --workflow-dir .github/workflows
          python3 -B arm64/scripts/wire_installed_boot_dispatch.py \
            --workflow .github/workflows/arm64-final-live-iso.yml
          python3 -B arm64/scripts/wire_graphical_boot_gate_v2.py \
            --final-workflow .github/workflows/arm64-final-live-iso.yml \
            --live-qemu arm64/scripts/test_arm64_iso_qemu.sh \
            --installed-qemu arm64/scripts/test_arm64_installed_disk_qemu.sh

          superseded_workflows=(
            .github/workflows/arm64-native-rebuild-batch.yml
            .github/workflows/arm64-exact-rootfs.yml
            .github/workflows/arm64-package-acquisition-plan.yml
            .github/workflows/arm64-dependency-retry.yml
            .github/workflows/arm64-package-smoke.yml
            .github/workflows/arm64-start-curated-batches.yml
          )
          superseded_scripts=(
            arm64/scripts/build_locked_source_arm64.sh
            arm64/scripts/finalize_arm64_live_rootfs.sh
            arm64/scripts/build_package_acquisition_plan.py
            arm64/scripts/prepare_rebuild_release_assets.py
            arm64/scripts/collect_native_rebuild_results.py
            arm64/scripts/configure_graphical_boot_gate.sh
            arm64/scripts/wire_graphical_boot_gate.py
          )
          rm -f "${superseded_workflows[@]}" "${superseded_scripts[@]}"
          find .github/workflows -maxdepth 1 -type f -name '*maintenance*.yml' -delete
          rm -f .github/workflows/arm64-export-v2-consolidation.yml
          find arm64/scripts -type d -name __pycache__ -prune -exec rm -rf '{}' +

          git add -A .github/workflows arm64/scripts
          mkdir -p work/consolidation-export/changed
          printf '%s\n' "$base_commit" > work/consolidation-export/base-commit.txt
          printf '%s\n' "$base_tree" > work/consolidation-export/base-tree.txt
          git diff --cached --binary --no-renames \
            > work/consolidation-export/consolidation.patch
          git diff --cached --name-status --no-renames \
            > work/consolidation-export/name-status.tsv
          git diff --cached --name-only --diff-filter=D --no-renames \
            > work/consolidation-export/deleted-paths.txt
          git diff --cached --numstat --no-renames \
            > work/consolidation-export/numstat.tsv

          while IFS= read -r -d '' path; do
            destination="work/consolidation-export/changed/$path"
            mkdir -p "$(dirname "$destination")"
            cp -a "$path" "$destination"
          done < <(git diff --cached --name-only --diff-filter=AM --no-renames -z)

          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path

          root = Path('work/consolidation-export')
          changed_root = root / 'changed'
          files = []
          for path in sorted(changed_root.rglob('*')):
              if not path.is_file():
                  continue
              relative = str(path.relative_to(changed_root))
              data = path.read_bytes()
              source = Path(relative)
              mode = '100755' if source.exists() and os.access(source, os.X_OK) else '100644'
              files.append({
                  'path': relative,
                  'mode': mode,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          deleted = [
              line.strip()
              for line in (root / 'deleted-paths.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          manifest = {
              'schema': 1,
              'base_commit': (root / 'base-commit.txt').read_text().strip(),
              'base_tree': (root / 'base-tree.txt').read_text().strip(),
              'changed_file_count': len(files),
              'deleted_file_count': len(deleted),
              'changed_files': files,
              'deleted_paths': deleted,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

          find work/consolidation-export -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/consolidation-export/SHA256SUMS
          cat work/consolidation-export/manifest.json

      - name: Upload the consolidation patch and complete changed files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-arm64-v2-consolidation-export
          path: work/consolidation-export
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
