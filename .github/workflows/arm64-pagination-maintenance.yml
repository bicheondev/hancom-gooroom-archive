name: ARM64 port - fix paginated API evidence collection

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-pagination-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-pagination-maintenance
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Slurp paginated JSON pages before parsing
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/arm64-recover-exact-package-pool.yml'),
              Path('.github/workflows/arm64-recover-existing-iso.yml'),
              Path('.github/workflows/arm64-stage0-auto-repair.yml'),
          ]
          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'gh api --paginate \\\n',
                  'gh api --paginate --slurp \\\n',
              )
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY

          git rm -f .github/workflows/arm64-pagination-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix paginated GitHub API JSON collection'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
