name: ARM64 port - fast exact Wayback recovery for current blockers

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-wayback-source-recovery-fast.yml'
      - 'arm64/scripts/recover_vendor_sources_wayback.py'
      - 'arm64/scripts/recover_vendor_sources_wayback_fast.py'
      - 'arm64/locks/effective-sources-v3/**'
      - 'arm64/locks/vendor-pool-sources/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-wayback-source-recovery-fast
  cancel-in-progress: true

env:
  ISO_NAME: Hancom-Gooroom-3.3-amd64.hybrid.iso
  ISO_SIZE: '1566277632'
  ISO_SHA256: ba3ac40c66c255bccb53b7e5e8bbe1fdee6cec93a63669d1f4c9d75555d7644a
  SOURCE_RELEASE_TAG: v3.3-arm64-sources-fast

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out current exact source blockers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install ISO signature and recovery tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools gpgv jq ca-certificates python3
          python3 -m py_compile \
            arm64/scripts/recover_vendor_sources_wayback.py \
            arm64/scripts/recover_vendor_sources_wayback_fast.py

      - name: Extract trusted archive keyrings from the exact reference ISO
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/iso-root work/keyrings
          gh release download v3.3 \
            --repo '${{ github.repository }}' \
            --pattern "$ISO_NAME" \
            --dir work
          test "$(stat -c '%s' "work/$ISO_NAME")" = "$ISO_SIZE"
          printf '%s  %s\n' "$ISO_SHA256" "work/$ISO_NAME" \
            | sha256sum --check --strict
          xorriso -osirrox on -indev "work/$ISO_NAME" -extract / work/iso-root
          squashfs="$(find work/iso-root -type f -name filesystem.squashfs -print -quit)"
          test -n "$squashfs"
          for version in 1.0 2.0 3.0; do
            unsquashfs -cat "$squashfs" \
              "etc/apt/trusted.gpg.d/gooroom-archive-${version}.gpg" \
              > "work/keyrings/gooroom-archive-${version}.gpg"
          done
          sha256sum work/keyrings/* | sort -k2 > work/keyrings/KEYRINGS.sha256

      - name: Restrict the vendor-pool evidence to current native blockers
        shell: bash
        run: |
          set -euxo pipefail
          blockers=arm64/locks/effective-sources-v3/effective-source-rebuild-blockers.json
          vendor=arm64/locks/vendor-pool-sources/vendor-pool-source-lock.json
          test -f "$blockers"
          test -f "$vendor"
          mkdir -p work/fast-wayback
          python3 - "$vendor" "$blockers" work/fast-wayback/filtered-vendor-pool-lock.json <<'PY'
          import json, sys
          from pathlib import Path
          vendor = json.loads(Path(sys.argv[1]).read_text())
          blockers = json.loads(Path(sys.argv[2]).read_text())
          keys = {(row['source'], row['source_version']) for row in blockers}
          rows = [
              row for row in vendor.get('sources', [])
              if (row.get('source'), row.get('source_version')) in keys
          ]
          document = {
              'summary': {
                  'schema': 1,
                  'policy': 'current-effective-native-source-blockers-only',
                  'requested_count': len(keys),
                  'selected_count': len(rows),
                  'missing_count': len(keys) - len(rows),
              },
              'sources': rows,
          }
          if len(rows) != len(keys):
              found = {(row.get('source'), row.get('source_version')) for row in rows}
              missing = sorted(keys - found)
              raise SystemExit(f'missing vendor pool evidence for blockers: {missing}')
          Path(sys.argv[3]).write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(document['summary'], indent=2))
          PY

      - name: Probe bounded Wayback captures with unchanged acceptance gates
        id: recover
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf work/fast-wayback/result
          set +e
          python3 arm64/scripts/recover_vendor_sources_wayback_fast.py \
            --vendor-pool-lock work/fast-wayback/filtered-vendor-pool-lock.json \
            --keyring work/keyrings/gooroom-archive-1.0.gpg \
            --keyring work/keyrings/gooroom-archive-2.0.gpg \
            --keyring work/keyrings/gooroom-archive-3.0.gpg \
            --output-dir work/fast-wayback/result \
            --workers 9 \
            2>&1 | tee work/fast-wayback/recovery.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/fast-wayback/result -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/fast-wayback/result/LOCKSUMS.sha256
          cat work/fast-wayback/result/summary.json

      - name: Upload complete fast recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-wayback-fast-exact-sources
          path: |
            work/keyrings/KEYRINGS.sha256
            work/fast-wayback
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish recovered source files to an immutable prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          resolved="$(jq -r '.resolved_count // 0' work/fast-wayback/result/summary.json)"
          if [ "$resolved" -eq 0 ]; then
            jq -n --slurpfile summary work/fast-wayback/result/summary.json \
              '{summary:($summary[0] + {release_published:false,release_complete:false}),sources:[],errors:[]}' \
              > work/fast-wayback/result/wayback-source-release-lock.json
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('work/fast-wayback/result')
          rows = []
          names = {}
          errors = []
          for path in sorted((root / 'sources').rglob('*')):
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              row = {
                  'path': str(path),
                  'filename': path.name,
                  'size': path.stat().st_size,
                  'sha256': digest,
              }
              previous = names.get(path.name)
              if previous and previous != digest:
                  errors.append({
                      'reason': 'release-asset-filename-collision',
                      'filename': path.name,
                      'first_sha256': previous,
                      'second_sha256': digest,
                  })
              names[path.name] = digest
              rows.append(row)
          document = {'schema': 1, 'files': rows, 'errors': errors}
          (root / 'source-file-manifest.json').write_text(
              json.dumps(document, ensure_ascii=False, indent=2) + '\n'
          )
          if errors or not rows:
              raise SystemExit(json.dumps(document, indent=2))
          PY

          cat > work/fast-wayback/result/release-notes.md <<'EOF'
          Exact signed source package files recovered from Internet Archive
          captures of the original Hancom/Gooroom APT pool URLs for the current
          Hancom Gooroom 3.3 ARM64 source blockers.

          Every accepted source passed the reference-ISO keyring signature,
          exact Source/Version, and signed payload size/SHA-256 gates.
          EOF
          if ! gh release view "$SOURCE_RELEASE_TAG" \
            --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release create "$SOURCE_RELEASE_TAG" \
              --repo '${{ github.repository }}' \
              --target arm64-port \
              --prerelease \
              --title 'Hancom Gooroom 3.3 fast exact source recovery' \
              --notes-file work/fast-wayback/result/release-notes.md
          fi
          mapfile -t assets < <(jq -r '.files[].path' \
            work/fast-wayback/result/source-file-manifest.json)
          gh release upload "$SOURCE_RELEASE_TAG" \
            --repo '${{ github.repository }}' \
            --clobber \
            "${assets[@]}" \
            work/fast-wayback/result/source-file-manifest.json \
            work/fast-wayback/result/wayback-source-lock.json
          gh api "repos/${{ github.repository }}/releases/tags/$SOURCE_RELEASE_TAG" \
            > work/fast-wayback/result/release-api.json

          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('work/fast-wayback/result')
          source_lock = json.loads((root / 'wayback-source-lock.json').read_text())
          release = json.loads((root / 'release-api.json').read_text())
          manifest = json.loads((root / 'source-file-manifest.json').read_text())
          assets = {row['name']: row for row in release.get('assets', [])}
          local_files = {row['filename']: row for row in manifest.get('files', [])}
          errors = []
          sources = []
          for row in source_lock.get('sources', []):
              selected = row.get('wayback_selected')
              if row.get('wayback_status') != 'resolved' or not selected:
                  continue
              locked = []
              for filename in selected.get('saved_files', []):
                  local = local_files.get(filename)
                  asset = assets.get(filename)
                  if not local or not asset:
                      errors.append({'source': row.get('source'), 'filename': filename, 'reason': 'asset-missing'})
                      continue
                  digest = asset.get('digest')
                  if int(asset.get('size', -1)) != int(local['size']):
                      errors.append({'source': row.get('source'), 'filename': filename, 'reason': 'asset-size-mismatch'})
                  if digest and digest != f"sha256:{local['sha256']}":
                      errors.append({'source': row.get('source'), 'filename': filename, 'reason': 'asset-digest-mismatch'})
                  locked.append({
                      **local,
                      'release_asset_id': asset.get('id'),
                      'release_digest': digest,
                      'browser_download_url': asset.get('browser_download_url'),
                  })
              sources.append({
                  'source': row.get('source'),
                  'source_version': row.get('source_version'),
                  'role': row.get('role'),
                  'dsc_sha256': selected.get('dsc_sha256'),
                  'capture_timestamp': selected.get('capture_timestamp'),
                  'files': locked,
              })
          summary = {
              **source_lock['summary'],
              'release_published': True,
              'release_complete': not errors,
              'release_tag': release.get('tag_name'),
              'release_id': release.get('id'),
              'release_url': release.get('html_url'),
              'release_source_count': len(sources),
              'release_error_count': len(errors),
          }
          output = {'summary': summary, 'sources': sources, 'errors': errors}
          (root / 'wayback-source-release-lock.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n'
          )
          if errors:
              raise SystemExit(json.dumps(errors, indent=2))
          PY

      - name: Merge fast recovery with any existing exact Wayback release lock
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/fast-wayback/merged
          python3 - \
            work/fast-wayback/result/wayback-source-release-lock.json \
            arm64/locks/wayback-sources/wayback-source-release-lock.json \
            work/fast-wayback/merged/wayback-source-release-lock.json <<'PY'
          import json, sys
          from pathlib import Path
          documents = []
          for raw in sys.argv[1:3]:
              path = Path(raw)
              if path.exists():
                  documents.append(json.loads(path.read_text()))
          rows = {}
          errors = []
          for document in documents:
              if document.get('summary', {}).get('release_complete') is not True:
                  continue
              for row in document.get('sources', []):
                  key = (row.get('source'), row.get('source_version'))
                  identity = (
                      row.get('dsc_sha256'),
                      tuple(sorted((f.get('filename'), int(f.get('size', -1)), f.get('sha256')) for f in row.get('files', []))),
                  )
                  previous = rows.get(key)
                  if previous and previous[0] != identity:
                      errors.append({'source': key[0], 'source_version': key[1], 'reason': 'conflicting-wayback-release-identities'})
                      continue
                  rows[key] = (identity, row)
          sources = [value[1] for _, value in sorted(rows.items())]
          summary = {
              'schema': 2,
              'policy': 'union-of-exact-complete-wayback-release-locks',
              'release_complete': not errors and bool(sources),
              'release_tag': 'multiple-exact-wayback-releases',
              'release_source_count': len(sources),
              'release_error_count': len(errors),
          }
          output = {'summary': summary, 'sources': sources, 'errors': errors}
          Path(sys.argv[3]).write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n')
          if errors:
              raise SystemExit(json.dumps(errors, indent=2))
          PY
          find work/fast-wayback/merged -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/fast-wayback/merged/LOCKSUMS.sha256

      - name: Commit merged persistent Wayback source authority
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/wayback-sources
          mkdir -p arm64/locks/wayback-sources
          cp work/fast-wayback/merged/wayback-source-release-lock.json \
            arm64/locks/wayback-sources/
          cp work/fast-wayback/result/summary.json \
            arm64/locks/wayback-sources/fast-summary.json
          cp work/fast-wayback/result/wayback-source-lock.json \
            arm64/locks/wayback-sources/fast-wayback-source-lock.json
          cp work/fast-wayback/result/rebuild-blockers.json \
            arm64/locks/wayback-sources/fast-rebuild-blockers.json
          cp work/fast-wayback/merged/LOCKSUMS.sha256 \
            arm64/locks/wayback-sources/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/wayback-sources
          if ! git diff --cached --quiet; then
            git commit -m 'Record fast exact Wayback source recovery'
            for attempt in 1 2 3 4; do
              git pull --rebase origin arm64-port
              if git push origin HEAD:arm64-port; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Recompute source authority immediately
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-source-authority-v5.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port

      - name: Preserve fail-closed unresolved conclusion
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          jq -e '.release_complete == true' \
            work/fast-wayback/merged/wayback-source-release-lock.json
          test '${{ steps.recover.outputs.exit_code }}' = '0'
