name: ARM64 port - build record and boot-test stage-0 live ISO v5

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-stage0-live-v5.yml'
      - 'arm64/scripts/build_stage0_live_iso.sh'
      - 'arm64/scripts/build_stage0_live_iso_v3.sh'
      - 'arm64/scripts/boot_test_arm64_uefi_iso.sh'
      - 'arm64/scripts/summarize_arm64_boot_attempt.py'
      - 'arm64/locks/reference/**'
      - 'arm64/locks/vendor-binaries/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-arm64-stage0-live-v5
  cancel-in-progress: true

env:
  SNAPSHOT: 20230730T235959Z
  ISO_NAME: Hancom-Gooroom-3.3-arm64-stage0-v5.iso
  MARKER: HANCOM_GOOROOM_ARM64_STAGE0_READY

jobs:
  build-record-and-boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out the ARM64 port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Verify native ARM64 host and install image tools
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'A native ARM64 runner is required.' >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring dosfstools file grub-common \
            grub-efi-arm64-bin jq mtools qemu-efi-aarch64 qemu-system-arm \
            rsync squashfs-tools xorriso

      - name: Download and verify all historical vendor packages
        id: vendor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          rm -rf work/vendor-v5 work/stage0-v5
          mkdir -p work/vendor-v5 work/stage0-v5
          set +e
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow arm64-vendor-binary-lock.yml \
            --branch arm64-port \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId')"
          rc=$?
          if [ "$rc" = 0 ] && [ -n "$run_id" ]; then
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name hancom-gooroom-3.3-exact-vendor-debs \
              --dir work/vendor-v5
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            test "$(jq -r '.summary.verified_count' \
              work/vendor-v5/vendor-binary-lock/vendor-binary-lock.json)" = 123
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            test "$(jq -r '.summary.unresolved_count' \
              work/vendor-v5/vendor-binary-lock/vendor-binary-lock.json)" = 0
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            sed 's#  work/vendor-debs/#  work/vendor-v5/vendor-debs/#' \
              work/vendor-v5/vendor-binary-lock/DEBSUMS.sha256 \
              > work/vendor-v5/DEBSUMS.relocated.sha256
            sha256sum --check work/vendor-v5/DEBSUMS.relocated.sha256
            rc=$?
          fi
          set -e
          echo "$rc" > work/stage0-v5/vendor-download.exit-code
          echo "${run_id:-}" > work/stage0-v5/vendor-source-run-id.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assemble the exact-branded ARM64 UEFI stage-0 image
        id: assemble
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: ${{ env.SNAPSHOT }}
          HANCOM_GOOROOM_STAGE0_ISO_NAME: ${{ env.ISO_NAME }}
        run: |
          set -uxo pipefail
          vendor_rc='${{ steps.vendor.outputs.exit_code }}'
          if [ -z "$vendor_rc" ] || [ "$vendor_rc" != 0 ]; then
            printf 'vendor package retrieval failed with code %s\n' "${vendor_rc:-missing}" \
              > work/stage0-v5/stage0-precondition-failure.txt
            echo 'exit_code=97' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x \
            arm64/scripts/build_stage0_live_iso.sh \
            arm64/scripts/build_stage0_live_iso_v3.sh
          set +e
          sudo -E arm64/scripts/build_stage0_live_iso_v3.sh \
            arm64/locks/reference/amd64-reference.json \
            work/vendor-v5/vendor-binary-lock/vendor-binary-lock.json \
            work/vendor-v5/vendor-debs \
            work/stage0-v5
          rc=$?
          set -e
          sudo chown -R "$USER:$USER" work/stage0-v5 || true
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ -f work/stage0-v5/stage0-v3-wrapper-result.json ]; then
            jq . work/stage0-v5/stage0-v3-wrapper-result.json
          fi
          if [ "$rc" = 0 ]; then
            jq . work/stage0-v5/stage0-build-result.json
            sha256sum --check "work/stage0-v5/$ISO_NAME.sha256"
          fi
          exit 0

      - name: Boot through ARM64 UEFI and require stage-0 readiness
        id: boot
        if: steps.assemble.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set -euxo pipefail
          chmod +x arm64/scripts/boot_test_arm64_uefi_iso.sh
          arm64/scripts/boot_test_arm64_uefi_iso.sh \
            "work/stage0-v5/$ISO_NAME" \
            work/stage0-v5/qemu-stage0-boot.log \
            "$MARKER" \
            420 \
            4096 \
            4
          jq --arg marker "$MARKER" \
            '.status = "boot-tested"
             | .boot_test = {
                 firmware: "ARM64 UEFI",
                 machine: "QEMU virt",
                 readiness_marker: $marker,
                 result: "passed"
               }' \
            work/stage0-v5/stage0-build-result.json \
            > work/stage0-v5/stage0-build-result.json.tmp
          mv work/stage0-v5/stage0-build-result.json.tmp \
            work/stage0-v5/stage0-build-result.json

      - name: Upload the ISO and raw diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-arm64-stage0-v5
          path: work/stage0-v5
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Summarize this exact assembly and boot attempt
        if: always()
        run: |
          set -uxo pipefail
          mkdir -p work/stage0-v5 work/stage0-v5-evidence
          assembly_rc='${{ steps.assemble.outputs.exit_code }}'
          [ -n "$assembly_rc" ] || assembly_rc=98
          boot_outcome='${{ steps.boot.outcome }}'
          [ -n "$boot_outcome" ] || boot_outcome=skipped
          set +e
          python3 arm64/scripts/summarize_arm64_boot_attempt.py \
            --attempt-root work/stage0-v5 \
            --evidence-dir work/stage0-v5-evidence \
            --schema hancom-gooroom-arm64-stage0-v5-attempt-evidence \
            --readiness-marker "$MARKER" \
            --assembly-exit-code "$assembly_rc" \
            --boot-outcome "$boot_outcome" \
            --build-result-name stage0-build-result.json \
            --wrapper-result-name stage0-v3-wrapper-result.json \
            --qemu-log-name qemu-stage0-boot.log \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --head-branch "$GITHUB_REF_NAME" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL"
          summary_rc=$?
          set -e
          echo "$summary_rc" > work/stage0-v5-evidence/summarizer.exit-code
          find work/stage0-v5-evidence -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/stage0-v5-evidence/LOCKSUMS.sha256
          jq . work/stage0-v5-evidence/summary.json

      - name: Commit success or failure evidence before enforcing the gate
        if: always()
        run: |
          set -euxo pipefail
          git pull --rebase origin arm64-port
          attempt=arm64/locks/stage0-v5-attempt
          rm -rf "$attempt"
          mkdir -p "$attempt"
          cp -a work/stage0-v5-evidence/. "$attempt/"
          success=arm64/locks/stage0-v5
          if [ "$(jq -r '.status' work/stage0-v5-evidence/summary.json)" = passed ]; then
            rm -rf "$success"
            mkdir -p "$success"
            for name in \
              stage0-build-result.json \
              stage0-manifest.json \
              stage0-exact-overlay-packages.tsv \
              "$ISO_NAME.sha256" \
              "$ISO_NAME.size" \
              stage0-kernel-version.txt; do
              test -f "work/stage0-v5/$name"
              cp "work/stage0-v5/$name" "$success/"
            done
            sha256sum "$success"/* | sort -k2 > "$success/LOCKSUMS.sha256"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$attempt"
          if [ -e "$success" ]; then
            git add -A "$success"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hancom Gooroom 3.3 ARM64 stage-0 v5 attempt'
            git pull --rebase origin arm64-port
            git push origin HEAD:arm64-port
          fi

      - name: Upload bounded consolidated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-arm64-stage0-v5-evidence
          path: work/stage0-v5-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce successful ARM64 UEFI assembly and boot
        if: always()
        run: |
          set -euxo pipefail
          test "$(jq -r '.status' work/stage0-v5-evidence/summary.json)" = passed
