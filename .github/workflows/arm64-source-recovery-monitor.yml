name: ARM64 port - monitor source key and Wayback recovery

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-source-recovery-monitor.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-source-recovery-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the branch for compact monitor evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Wait until keyring and Wayback workflows have no active run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/source-recovery-monitor
          workflows=(
            arm64-source-keyring-lock.yml
            arm64-wayback-source-recovery.yml
          )
          : > work/source-recovery-monitor/poll.jsonl
          for iteration in $(seq 1 220); do
            active=0
            combined='[]'
            for workflow in "${workflows[@]}"; do
              output="work/source-recovery-monitor/${workflow%.yml}.json"
              gh run list \
                --repo '${{ github.repository }}' \
                --workflow "$workflow" \
                --branch arm64-port \
                --limit 10 \
                --json databaseId,status,conclusion,createdAt,updatedAt,url,displayTitle \
                > "$output"
              count="$(jq '[.[] | select(
                .status == "queued"
                or .status == "in_progress"
                or .status == "pending"
                or .status == "requested"
                or .status == "waiting"
              )] | length' "$output")"
              active=$((active + count))
              combined="$(jq -cn \
                --argjson left "$combined" \
                --arg workflow "$workflow" \
                --slurpfile rows "$output" \
                '$left + [($rows[0][] | . + {workflow:$workflow})]')"
            done
            jq -cn \
              --argjson iteration "$iteration" \
              --argjson active "$active" \
              --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{iteration:$iteration,active_run_count:$active,checked_at:$checked_at}' \
              | tee -a work/source-recovery-monitor/poll.jsonl
            printf '%s\n' "$combined" > work/source-recovery-monitor/runs.json
            if [ "$active" -eq 0 ]; then
              break
            fi
            sleep 60
          done
          active="$(jq '[.[] | select(
            .status == "queued"
            or .status == "in_progress"
            or .status == "pending"
            or .status == "requested"
            or .status == "waiting"
          )] | length' work/source-recovery-monitor/runs.json)"
          test "$active" = 0
          jq '{
            schema: 1,
            completed_count: ([.[] | select(.status == "completed")] | length),
            success_count: ([.[] | select(.conclusion == "success")] | length),
            failure_count: ([.[] | select(.conclusion == "failure")] | length),
            cancelled_count: ([.[] | select(.conclusion == "cancelled")] | length),
            runs: .
          }' work/source-recovery-monitor/runs.json \
            > work/source-recovery-monitor/summary.json

      - name: Re-run source authority with all completed recovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-source-authority-v4.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port

      - name: Commit monitor evidence and remove the one-shot coordinator
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin arm64-port
          git reset --hard origin/arm64-port
          rm -rf arm64/status/source-recovery-monitor
          mkdir -p arm64/status/source-recovery-monitor
          cp work/source-recovery-monitor/summary.json \
            arm64/status/source-recovery-monitor/
          cp work/source-recovery-monitor/poll.jsonl \
            arm64/status/source-recovery-monitor/
          git rm -f .github/workflows/arm64-source-recovery-monitor.yml \
            2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/source-recovery-monitor .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record completion of exact source recovery probes'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
