name: ARM64 port - normalize exact source builder v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-builder-v2-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-builder-v2-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all rebuild definitions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Switch every workflow to the dependency-aware v2 builder
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  'arm64/scripts/build_locked_source_arm64.sh',
                  'arm64/scripts/build_locked_source_arm64_v2.sh',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY

          git rm -f arm64/scripts/build_locked_source_arm64.sh 2>/dev/null || true
          git rm -f .github/workflows/arm64-builder-v2-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows arm64/scripts
          git commit -m 'Normalize exact ARM64 source builder v2'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
