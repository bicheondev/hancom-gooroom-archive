name: ARM64 port - switch stage-0 retest to TCG runner

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-stage0-v5-retest-runner-switch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-stage0-retest-runner-switch
  cancel-in-progress: true

jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Move only the boot retest to x86 TCG
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-stage0-v5-retest.yml')
          text = path.read_text(encoding='utf-8')
          old_runner = '    runs-on: ubuntu-24.04-arm\n'
          new_runner = '    runs-on: ubuntu-24.04\n'
          if text.count(old_runner) != 1:
              raise SystemExit('unexpected retest runner declaration')
          text = text.replace(old_runner, new_runner, 1)

          old_gate = '''          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'A native ARM64 runner is required.' >&2; exit 1 ;;
          esac
'''
          new_gate = '''          test "$(uname -m)" = x86_64
          # The ISO remains AArch64. QEMU uses TCG because GitHub-hosted x86
          # runners do not expose ARM KVM; this avoids competing with native
          # ARM64 package-build jobs for runner capacity.
'''
          if text.count(old_gate) != 1:
              raise SystemExit('unexpected native-runner gate')
          text = text.replace(old_gate, new_gate, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/arm64-stage0-v5-retest-runner-switch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-stage0-v5-retest.yml
          git commit -m 'Run exact stage-0 boot retest through AArch64 TCG'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
