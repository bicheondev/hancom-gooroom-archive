name: ARM64 port - retry pending pipeline convergence

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-retry-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-retry-pipeline-convergence
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Allow both final live ISO assertions to be strengthened
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arm64-converge-pipeline-maintenance.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          replace_once(
              final_live,
              ".passed == true and .marker_found == true",
              ".passed == true and .boot_marker_found == true and .graphical_marker_found == true",
          )
'''
          new = '''          replace_all(
              final_live,
              ".passed == true and .marker_found == true",
              ".passed == true and .boot_marker_found == true and .graphical_marker_found == true",
          )
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one final-live convergence anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/arm64-retry-convergence.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'Strengthen both final live ISO gate assertions'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
