name: ARM64 repair cleanmode candidate expansion once v2

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-add-cleanmode-candidate-to-integration-v4-once-v2.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: arm64-add-cleanmode-candidate-to-integration-v4-once-v2
  cancel-in-progress: false

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Insert exact public Cleanmode commit without external Python modules
        shell: bash
        run: |
          set -Eeuo pipefail
          target=.github/workflows/arm64-analyze-integration-applet-vendor-reconstruction-v4.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-analyze-integration-applet-vendor-reconstruction-v4.yml')
          text = path.read_text(encoding='utf-8')
          commit = 'd170c900dab655bd5c6d8474064e445232d3f49c'
          if commit not in text:
              anchor = (
                  '          - label: post-release-ui-0.3.1-grm3u1\n'
                  '            commit: bcca083b854e4a6c99e0bb69db4d4868e1210cdd\n'
              )
              insertion = (
                  '          - label: cleanmode-public-commit\n'
                  f'            commit: {commit}\n'
              )
              if anchor not in text:
                  raise SystemExit('v4 matrix anchor was not found')
              text = text.replace(anchor, anchor + insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -F 'label: cleanmode-public-commit' "$target"
          grep -F 'commit: d170c900dab655bd5c6d8474064e445232d3f49c' "$target"
          git diff --check -- "$target"

      - name: Commit matrix repair and remove obsolete one-shot workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-analyze-integration-applet-vendor-reconstruction-v4.yml
          for obsolete in \
            .github/workflows/arm64-add-cleanmode-candidate-to-integration-v4-once.yml \
            .github/workflows/arm64-add-cleanmode-candidate-to-integration-v4-once-v2.yml; do
            if test -e "$obsolete"; then
              git rm "$obsolete"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Test public Cleanmode source in integration applet reconstruction'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
