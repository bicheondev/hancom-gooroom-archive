name: ARM64 port - activate exception-safe control-plane audit v4

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-control-plane-audit-v4-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-exact-source-control-plane-audit
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact-source control-plane audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Activate the exception-safe audit entry point
        shell: bash
        run: |
          set -euxo pipefail
          workflow=.github/workflows/arm64-exact-source-control-plane-audit-v3.yml
          test -f "$workflow"
          sed -i \
            's#arm64/scripts/audit_exact_source_control_plane_v3.py#arm64/scripts/audit_exact_source_control_plane_v4.py#g' \
            "$workflow"
          grep -F 'arm64/scripts/audit_exact_source_control_plane_v4.py' "$workflow"
          git rm -f .github/workflows/arm64-fix-control-plane-audit-v4-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Activate exception-safe exact-source control-plane audit v4'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Re-run exact-source control-plane audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-exact-source-control-plane-audit-v3.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port
