name: ARM64 port - recover exact Software Heritage source trees

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-recover-software-heritage-source-trees.yml'
      - 'arm64/scripts/recover_software_heritage_exact_source_trees.py'
      - 'arm64/locks/software-heritage-exact-source-archaeology/latest/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-software-heritage-source-tree-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact Software Heritage archaeology authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Verify the fail-closed source-tree recovery program
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            arm64/scripts/recover_software_heritage_exact_source_trees.py
          mkdir -p \
            arm64/locks/software-heritage-exact-source-archaeology/latest

      - name: Cook and verify exact archived source directories
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/software-heritage-source-tree-recovery
          python3 arm64/scripts/recover_software_heritage_exact_source_trees.py \
            --archaeology-root \
              arm64/locks/software-heritage-exact-source-archaeology/latest \
            --output-dir work/software-heritage-source-tree-recovery \
            --timeout 30 \
            --poll-seconds 1200 \
            --poll-interval 20
          jq -e '
            .schema == 1
            and .candidate_count >= 0
            and .recovered_count >= 0
            and .pending_count >= 0
            and .failed_count >= 0
            and (
              .recovered_count + .pending_count + .failed_count
              == .candidate_count
            )
          ' work/software-heritage-source-tree-recovery/evidence/summary.json >/dev/null

      - name: Seal compact evidence and recovered source archives
        shell: bash
        run: |
          set -euxo pipefail
          root=work/software-heritage-source-tree-recovery
          (
            cd "$root"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          {
            echo '## Software Heritage exact source-tree recovery'
            echo
            echo '```json'
            cat "$root/evidence/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovered source trees and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-software-heritage-source-trees
          path: work/software-heritage-source-tree-recovery
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Commit compact source-tree recovery authority
        shell: bash
        run: |
          set -euxo pipefail
          source=work/software-heritage-source-tree-recovery/evidence
          destination=arm64/locks/software-heritage-source-tree-recovery/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$source/." "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Recover exact source trees from Software Heritage'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
