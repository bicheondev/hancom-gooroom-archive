name: ARM64 port - finalize hardened Git and signed-DSC authority path

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-source-authority-v5-maintenance.yml'
      - 'arm64/scripts/wire_source_authority_v5.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-source-authority-integration-v3
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the complete port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Supersede the earlier integration run and reset after all writers settle
        shell: bash
        run: |
          set -euxo pipefail
          sleep 300
          git fetch origin arm64-port
          git reset --hard origin/arm64-port

      - name: Apply hardened DSC extraction and persistent publisher v4
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            arm64/scripts/wire_source_authority_v3.py \
            arm64/scripts/wire_source_authority_v4.py \
            arm64/scripts/wire_source_authority_v5.py \
            arm64/scripts/publish_rebuild_packages_v3.py \
            arm64/scripts/publish_rebuild_packages_v4.py
          bash -n \
            arm64/scripts/build_locked_source_arm64_v5.sh \
            arm64/scripts/build_locked_dsc_source_arm64_v2.sh \
            arm64/scripts/build_locked_dsc_source_arm64.sh
          python3 arm64/scripts/wire_source_authority_v5.py \
            --repository-root .

      - name: Remove obsolete authority wrappers and one-shot integration files
        shell: bash
        run: |
          set -euxo pipefail
          obsolete=(
            .github/workflows/arm64-effective-source-lock.yml
            .github/workflows/arm64-publish-rebuild-packages.yml
            .github/workflows/arm64-source-authority-v3-maintenance.yml
            .github/workflows/arm64-source-authority-v5-maintenance.yml
            arm64/scripts/build_locked_source_arm64_v3.sh
            arm64/scripts/build_locked_source_arm64_v4.sh
          )
          for path in "${obsolete[@]}"; do
            git rm -f "$path" 2>/dev/null || rm -f "$path"
          done

      - name: Commit the final exact-source execution graph
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows arm64/scripts
          if git diff --cached --quiet; then
            echo 'The hardened exact-source graph was already active.'
            exit 0
          fi
          git commit -m 'Finalize hardened Git and signed DSC ARM64 source path'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Dispatch authoritative recovery, tests, and build controllers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          dispatch() {
            local workflow="$1"
            shift
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" \
                --repo '${{ github.repository }}' \
                --ref arm64-port "$@"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          dispatch arm64-source-keyring-lock.yml
          dispatch arm64-wayback-source-recovery.yml || true
          dispatch arm64-source-authority-v3.yml || true
          dispatch arm64-workflow-secret-audit.yml
          dispatch arm64-active-pipeline-audit.yml
          dispatch arm64-pipeline-lint.yml
          dispatch arm64-pipeline-unit-tests.yml
          dispatch arm64-baseline-rebuild-evidence.yml || true
          dispatch arm64-native-rebuild-backlog.yml -f limit=6 || true
          dispatch arm64-rebuild-failure-audit.yml || true
          dispatch arm64-publish-rebuild-packages-v3.yml || true
          dispatch arm64-package-acquisition-plan-v2.yml || true
          dispatch arm64-port-coverage.yml || true
          dispatch arm64-ci-state-snapshot.yml || true
