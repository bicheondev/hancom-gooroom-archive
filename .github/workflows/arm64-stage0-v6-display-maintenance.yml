name: ARM64 port - provide stage0 v6 headless graphical display

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-stage0-v6-display-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-stage0-v6-display-maintenance
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Replace disconnected display with localhost-only VNC backend
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/arm64-stage0-v6.yml')
          text=path.read_text(encoding='utf-8')
          old='            -display none -monitor none \\\n'
          new='            -display vnc=127.0.0.1:9 -monitor none \\\n'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('QEMU display marker not found')
          path.write_text(text,encoding='utf-8')
          PY
          git rm -f .github/workflows/arm64-stage0-v6-display-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-stage0-v6.yml
          git commit -m 'Provide localhost VNC display for stage0 v6 graphical gate'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
