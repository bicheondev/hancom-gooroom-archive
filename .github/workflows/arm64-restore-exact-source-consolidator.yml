name: ARM64 port - restore exact source consolidator

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-restore-exact-source-consolidator.yml'
      - 'arm64/bootstrap/exact-source-consolidator/**'

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-restore-exact-source-consolidator
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact bootstrap revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Decode, validate, and stage final consolidator
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          root = Path('arm64/bootstrap/exact-source-consolidator')
          outputs = {
              root / 'summarizer.zlib.b64': (
                  Path('arm64/scripts/summarize_exact_source_recovery.py'),
                  'd6f1de4cc53df60d2b17067651b78d4c04e29a949167e751b188f60861d4a756',
              ),
              root / 'tests.zlib.b64': (
                  Path('arm64/scripts/test_summarize_exact_source_recovery.py'),
                  '53fa88f9f2d4cb09dca3baf0bba7be38504bd5b5ca90ad02cd55212c1f378318',
              ),
          }
          for source, (destination, expected_sha256) in outputs.items():
              encoded = ''.join(source.read_text(encoding='ascii').split())
              if '=' in encoded:
                  encoded = encoded[:encoded.index('=')]
              encoded += '=' * (-len(encoded) % 4)
              compressed = base64.b64decode(encoded, validate=True)
              payload = zlib.decompress(compressed)
              actual_sha256 = hashlib.sha256(payload).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f'{source}: decoded SHA-256 mismatch: '
                      f'expected={expected_sha256} actual={actual_sha256}'
                  )
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)

          workflow_source = root / 'workflow.yml'
          workflow_destination = Path('.github/workflows/arm64-summarize-exact-source-recovery.yml')
          workflow_payload = workflow_source.read_bytes()
          workflow_sha256 = hashlib.sha256(workflow_payload).hexdigest()
          expected_workflow_sha256 = 'da6fe6382046a65059fbc068067ac04cc9d5c8e246d5ffbfe3e862590e5d6808'
          if workflow_sha256 != expected_workflow_sha256:
              raise SystemExit(
                  f'{workflow_source}: SHA-256 mismatch: '
                  f'expected={expected_workflow_sha256} actual={workflow_sha256}'
              )
          workflow_destination.parent.mkdir(parents=True, exist_ok=True)
          workflow_destination.write_bytes(workflow_payload)
          PY
          chmod 0755 \
            arm64/scripts/summarize_exact_source_recovery.py \
            arm64/scripts/test_summarize_exact_source_recovery.py
          python3 -m py_compile \
            arm64/scripts/summarize_exact_source_recovery.py \
            arm64/scripts/test_summarize_exact_source_recovery.py
          python3 arm64/scripts/test_summarize_exact_source_recovery.py

      - name: Replace bootstrap with reviewed final files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r \
            arm64/bootstrap/exact-source-consolidator \
            .github/workflows/arm64-restore-exact-source-consolidator.yml
          git add \
            arm64/scripts/summarize_exact_source_recovery.py \
            arm64/scripts/test_summarize_exact_source_recovery.py \
            .github/workflows/arm64-summarize-exact-source-recovery.yml
          git commit -m 'Restore fail-closed exact source recovery consolidation'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
