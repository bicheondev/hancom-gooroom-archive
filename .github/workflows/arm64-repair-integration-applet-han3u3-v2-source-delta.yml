name: ARM64 repair integration applet han3u3 v2 source delta

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-repair-integration-applet-han3u3-v2-source-delta.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-integration-applet-han3u3-v2-source-delta
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the current ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Apply and validate the final DWARF-guided source delta
        shell: bash
        run: |
          set -Eeuo pipefail
          patcher='arm64/scripts/patch_integration_applet_han3u3_source.py'
          patch='arm64/maintenance/integration-applet-han3u3-final-source-delta.patch'
          target='.github/workflows/arm64-reconstruct-integration-applet-han3u3-v2.yml'
          source='arm64/scripts/reconstruct_integration_applet_han3u3_v1.sh.gz'

          test "$(sha256sum "$patcher" | awk '{print $1}')" = \
            '8b06900682d46ebf972bfb17dc8142cc484372e5090eac7055d56fd8a8c51866'
          test "$(sha256sum "$patch" | awk '{print $1}')" = \
            '5c3cdbf651421547cc038d7563d9bcaf710b7c04f537c37541f39633696e6ae0'
          git apply --check "$patch"
          git apply "$patch"
          test "$(sha256sum "$patcher" | awk '{print $1}')" = \
            '0098b778de17442df1bcf806621dd217aa4ad0afbc1471501724c12b7f036995'
          python3 -m py_compile "$patcher"

          python3 - "$patcher" "$source" "$target" <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import subprocess
          import sys

          patcher_path, source_path, workflow_path = map(Path, sys.argv[1:])
          patcher = patcher_path.read_bytes()
          source_gzip = source_path.read_bytes()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          if sha256(source_gzip) != '072ee8eea14141fd08695c5bff06fb2488f4c478a2c70542c07ee3ff28e3cd63':
              raise SystemExit('locked v1 runner gzip hash mismatch')
          source_payload = gzip.decompress(source_gzip)
          if sha256(source_payload) != 'f49d6da54042f93c65ef14b5fbfc904b0ea208d068f73cc7ccbb134b03c34415':
              raise SystemExit('locked v1 runner payload hash mismatch')

          anchor = b'chmod +x "$ROOT/candidate/debian/rules" "$ROOT/candidate/autogen.sh"\n\n'
          if source_payload.count(anchor) != 1:
              raise SystemExit(f'runner insertion anchor count: {source_payload.count(anchor)}')
          block = (
              b'# Reconstruct the Hancom-only C delta identified from the exact vendor DWARF.\n'
              b'python3 - "$ROOT/candidate" "$ROOT/output/han3u3-source-reconstruction.json" '
              b"<<'PY_HAN3_SOURCE'\n"
              + patcher
              + b'PY_HAN3_SOURCE\n\n'
          )
          generated_payload = source_payload.replace(anchor, anchor + block, 1)
          payload_sha = sha256(generated_payload)
          if payload_sha != '480131e885cc48e2245fdc3424f60ecbb3ac42d61e2d65fecbd260b416f18202':
              raise SystemExit(f'generated payload hash mismatch: {payload_sha}')

          generated_gzip = subprocess.run(
              ['gzip', '-n', '-9', '-c'],
              input=generated_payload,
              stdout=subprocess.PIPE,
              check=True,
          ).stdout
          gzip_sha = sha256(generated_gzip)
          if gzip_sha != '6d01070a694b48f8bc59d993195c02d035e11a2daea19c70141e93283b42e5ec':
              raise SystemExit(f'generated gzip hash mismatch: {gzip_sha}')
          blob = hashlib.sha1(
              f'blob {len(generated_gzip)}\0'.encode('ascii') + generated_gzip
          ).hexdigest()
          if blob != '09e0dc34728ff7cfba2ce5eb5457faad04362b88':
              raise SystemExit(f'generated git blob mismatch: {blob}')
          subprocess.run(['bash', '-n', '/dev/stdin'], input=generated_payload, check=True)

          workflow = workflow_path.read_text(encoding='utf-8')
          replacements = (
              (
                  'expected_blob=d7c3987d602bad65df6ad269615f3fe1ae8525ce',
                  'expected_blob=09e0dc34728ff7cfba2ce5eb5457faad04362b88',
              ),
              (
                  'expected_gzip_sha=56da121948044c5d47a87609352b7c37064bf78c8cefc1135a20284f267f5bb9',
                  'expected_gzip_sha=6d01070a694b48f8bc59d993195c02d035e11a2daea19c70141e93283b42e5ec',
              ),
              (
                  'expected_payload_sha=f694264b2df512cc63a9678b08b2b5293b501d487baee02833d9f807c996d881',
                  'expected_payload_sha=480131e885cc48e2245fdc3424f60ecbb3ac42d61e2d65fecbd260b416f18202',
              ),
          )
          for old, new in replacements:
              if workflow.count(old) != 1 or workflow.count(new) != 0:
                  raise SystemExit(f'workflow lock replacement rejected: {old}')
              workflow = workflow.replace(old, new, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

          git diff --check

      - name: Commit the repaired source delta atomically
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          helper='.github/workflows/arm64-repair-integration-applet-han3u3-v2-source-delta.yml'
          patch='arm64/maintenance/integration-applet-han3u3-final-source-delta.patch'
          patcher='arm64/scripts/patch_integration_applet_han3u3_source.py'
          target='.github/workflows/arm64-reconstruct-integration-applet-han3u3-v2.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- "$helper" "$patch"
          git add -- "$patcher" "$target"
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Complete integration applet han3u3 vendor source reconstruction'

          for attempt in 1 2 3 4 5; do
            git fetch origin arm64-port
            git rebase origin/arm64-port
            if git push origin HEAD:arm64-port; then
              repair_sha="$(git rev-parse HEAD)"
              printf 'repair_sha=%s\n' "$repair_sha" >> "$GITHUB_OUTPUT"
              printf 'Repair commit: `%s`\n' "$repair_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo 'failed to push the atomic repair commit' >&2
          exit 1

      - name: Dispatch the repaired v2 reconstruction workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_SHA: ${{ steps.commit.outputs.repair_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='arm64-reconstruct-integration-applet-han3u3-v2.yml'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          status="$(
            curl --silent --show-error --location \
              --output "$RUNNER_TEMP/dispatch-response.txt" \
              --write-out '%{http_code}' --request POST \
              "${headers[@]}" \
              "${api}/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"arm64-port"}'
          )"
          test "$status" = 204 || {
            cat "$RUNNER_TEMP/dispatch-response.txt" >&2 || true
            exit 1
          }

          run_id=
          for attempt in $(seq 1 30); do
            runs="$(curl --fail --silent --show-error --location \
              "${headers[@]}" \
              "${api}/actions/workflows/${workflow}/runs?branch=arm64-port&event=workflow_dispatch&per_page=30")"
            run_id="$(jq -r --arg sha "$REPAIR_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .id // empty' \
              <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id"
          printf 'Dispatched reconstruction run: `%s`\n' "$run_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'Reconstruction URL: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
