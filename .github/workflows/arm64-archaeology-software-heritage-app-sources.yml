name: ARM64 port - Software Heritage exact app-source archaeology

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-archaeology-software-heritage-app-sources.yml'
      - 'arm64/scripts/archaeology_software_heritage_exact_sources.py'
      - 'arm64/scripts/swh_rate_limited_transport.py'
      - 'arm64/scripts/run_rate_limited_swh_archaeology.py'
      - 'arm64/scripts/test_run_rate_limited_swh_archaeology.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-software-heritage-app-source-archaeology
  cancel-in-progress: true

jobs:
  archaeology:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the exact triggering archaeology revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify rate-aware Software Heritage archaeology
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            arm64/scripts/archaeology_software_heritage_exact_sources.py \
            arm64/scripts/swh_rate_limited_transport.py \
            arm64/scripts/run_rate_limited_swh_archaeology.py \
            arm64/scripts/test_run_rate_limited_swh_archaeology.py
          python3 arm64/scripts/test_run_rate_limited_swh_archaeology.py

      - name: Traverse archived visits, snapshots, and revision histories
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/software-heritage-app-source-archaeology
          mkdir -p work/software-heritage-app-source-archaeology
          python3 arm64/scripts/run_rate_limited_swh_archaeology.py \
            --swh-min-interval 1.1 \
            --swh-max-retries 10 \
            --swh-max-retry-delay 300 \
            --output-dir work/software-heritage-app-source-archaeology \
            --timeout 20 \
            --source gnome-flashback \
            --source gooroom-dockbarx-applet \
            --source gooroom-guide \
            --source gooroom-integration-applet \
            --source gooroom-session-manager
          jq -e '
            .schema == 1
            and .target_count == 5
            and .exact_revision_target_count >= 0
            and .exact_revision_target_count <= 5
            and .unresolved_target_count + .exact_revision_target_count == 5
            and .promotion_allowed == false
            and .evidence_complete == true
            and .terminal_transport_error_count == 0
            and .transport_incomplete_target_count == 0
            and .transport.policy
              == "paced-rate-limit-headers-bounded-transient-retry-fail-closed"
          ' work/software-heritage-app-source-archaeology/summary.json >/dev/null

      - name: Seal complete positive or negative Software Heritage evidence
        shell: bash
        run: |
          set -euxo pipefail
          evidence=work/software-heritage-app-source-archaeology
          (
            cd "$evidence"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          {
            echo '## Software Heritage exact app-source archaeology'
            echo
            echo '```json'
            cat "$evidence/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete archaeology evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-software-heritage-app-source-archaeology
          path: work/software-heritage-app-source-archaeology
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Merge complete app-source evidence into current authority
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          source=work/software-heritage-app-source-archaeology
          destination=arm64/locks/software-heritage-exact-source-archaeology/latest
          git switch -c swh-app-archaeology-publish "$GITHUB_SHA"
          mkdir -p "$destination"
          for name in \
            gnome-flashback \
            gooroom-dockbarx-applet \
            gooroom-guide \
            gooroom-integration-applet \
            gooroom-session-manager; do
            rm -rf "$destination/$name"
            cp -a "$source/$name" "$destination/$name"
          done
          cp "$source/summary.json" \
            "$destination/app-summary.json"
          cp "$source/LOCKSUMS.sha256" \
            "$destination/app-LOCKSUMS.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Audit exact Hancom app sources in Software Heritage'

          critical_paths=(
            '.github/workflows/arm64-archaeology-software-heritage-app-sources.yml'
            'arm64/scripts/archaeology_software_heritage_exact_sources.py'
            'arm64/scripts/swh_rate_limited_transport.py'
            'arm64/scripts/run_rate_limited_swh_archaeology.py'
            'arm64/scripts/test_run_rate_limited_swh_archaeology.py'
          )
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin arm64-port
            if ! git diff --quiet "$GITHUB_SHA" origin/arm64-port -- "${critical_paths[@]}"; then
              echo 'The app-source archaeology implementation changed; refusing stale evidence.' >&2
              exit 75
            fi
            git rebase origin/arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
