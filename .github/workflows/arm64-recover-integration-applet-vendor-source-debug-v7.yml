name: ARM64 recover integration applet vendor source and debug v7

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v7.yml'
      - 'arm64/scripts/recover_integration_applet_vendor_source_debug_v7.py'

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-integration-applet-vendor-source-debug-v7
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the triggering ARM64 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install exact-source and debug inspection tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates dpkg-dev file jq python3 tar xz-utils
          python3 -m py_compile \
            arm64/scripts/recover_integration_applet_vendor_source_debug_v7.py

      - name: Recover and seal exact vendor evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 arm64/scripts/recover_integration_applet_vendor_source_debug_v7.py \
            --workspace work/vendor-recovery-v7
          jq '.' work/vendor-recovery-v7/output/summary.json >> "$GITHUB_STEP_SUMMARY"
          (
            cd work/vendor-recovery-v7/output
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Upload complete v7 recovery evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-applet-vendor-source-debug-v7
          path: work/vendor-recovery-v7
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
