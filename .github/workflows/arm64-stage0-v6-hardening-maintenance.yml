name: ARM64 port - harden stage0 v6 builder

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-stage0-v6-hardening-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-stage0-v6-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Apply deterministic stage0 v6 hardening
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/build_stage0_v6.py')
          text = path.read_text(encoding='utf-8')
          original = text

          # mmdebstrap accepts one mirror positional argument. The chroot
          # finalizer installs updates/security after bootstrap, so retaining
          # only the base snapshot here is exact and avoids an invalid argv.
          text = text.replace(
              '            f"deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/{SNAPSHOT}/ bullseye-updates main contrib non-free",\n'
              '            f"deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/{SNAPSHOT}/ bullseye-security main contrib non-free",\n',
              '',
          )

          # Never let the AMD64 reference daemon.conf override the live ARM64
          # account/session configuration written below.
          marker = '    "etc/xdg/autostart/orca",\n'
          addition = marker + '    "etc/gdm3/daemon.conf",\n'
          if '    "etc/gdm3/daemon.conf",\n' not in text:
              if marker not in text:
                  raise SystemExit('GDM overlay exclusion marker missing')
              text = text.replace(marker, addition, 1)

          # A live-config user is created at boot. Force Xorg and autologin only
          # after all architecture-neutral reference files were copied.
          overlay_marker = '''    overlay_summary = apply_overlay(
        reference_rootfs,
        rootfs,
        args.evidence_dir / "reference-overlay.json",
    )

    # Regenerate caches after the architecture-neutral reference overlay.
'''
          overlay_replacement = '''    overlay_summary = apply_overlay(
        reference_rootfs,
        rootfs,
        args.evidence_dir / "reference-overlay.json",
    )

    gdm_config = rootfs / "etc/gdm3/daemon.conf"
    gdm_config.parent.mkdir(parents=True, exist_ok=True)
    gdm_config.write_text(
        "[daemon]\\n"
        "WaylandEnable=false\\n"
        "AutomaticLoginEnable=true\\n"
        "AutomaticLogin=gooroom\\n\\n"
        "[security]\\n\\n[xdmcp]\\n\\n[chooser]\\n\\n"
        "[debug]\\nEnable=false\\n",
        encoding="utf-8",
    )

    # Regenerate caches after the architecture-neutral reference overlay.
'''
          if 'gdm_config = rootfs / "etc/gdm3/daemon.conf"' not in text:
              if overlay_marker not in text:
                  raise SystemExit('post-overlay insertion marker missing')
              text = text.replace(overlay_marker, overlay_replacement, 1)

          text = text.replace(
              'After=display-manager.service graphical.target\\n',
              'After=display-manager.service\\n',
          )

          if text == original:
              print('stage0 v6 builder already hardened')
          else:
              path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile arm64/scripts/build_stage0_v6.py
          git rm -f .github/workflows/arm64-stage0-v6-hardening-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_stage0_v6.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Harden ARM64 stage0 v6 bootstrap and GDM ordering'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
