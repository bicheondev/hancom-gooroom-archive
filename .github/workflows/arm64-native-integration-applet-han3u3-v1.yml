name: ARM64 native integration applet han3u3 candidate v1

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-native-integration-applet-han3u3-v1.yml'
      - 'arm64/scripts/verify_integration_applet_han3u3_native_v1.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: hancom-gooroom-33-native-integration-applet-han3u3-v1
  cancel-in-progress: false

jobs:
  native-arm64:
    if: github.ref == 'refs/heads/arm64-port'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    env:
      AUTHORITY_RUN_ID: '32586601849'
      AUTHORITY_ARTIFACT_ID: '9479222783'
      AUTHORITY_ARTIFACT_NAME: integration-applet-han3u3-reconstruction-v2
      AUTHORITY_ARTIFACT_DIGEST: 'sha256:aca853c299e5aa05387fd0f8408ad42bfb02e3d51f8c5ada10804c2158e53767'
      AUTHORITY_TRIGGER_SHA: '91b45160bc0d4f2c81cf108850d3b4372395ece4'
      AUTHORITY_SUMMARY_SHA256: 'baf37c478345f7f63061f29520a6a7a36d14aaa29b8229d3542217f590668b43'
      AUTHORITY_RUNNER_GZIP_SHA256: '6d01070a694b48f8bc59d993195c02d035e11a2daea19c70141e93283b42e5ec'
      AUTHORITY_RUNNER_GIT_BLOB: '09e0dc34728ff7cfba2ce5eb5457faad04362b88'
      NIMF_SOURCE_COMMIT: '583ad8b183db06a84c6b85a80fe132583566909d'
      NIMF_SOURCE_TREE: 'a2e3017b4c00e92a1cab8fe803e2e88f07d5d74d'
      NIMF_VERSION: '2023.06.30+grm3u1'
      BULLSEYE_BASE_DIGEST: 'sha256:99cdf7792e25416bd801861ccd8e2fb27fb527b25e8d9a8704ebc3ead2015675'
      APPLET_VERSION: '0.3.1+grm3u1+han3u3'

    steps:
      - name: Check out triggering authority consumer commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host verification tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates dpkg-dev file git jq python3
          gh --version
          docker version
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64

      - name: Verify locked AMD64 reconstruction authority
        shell: bash
        run: |
          set -Eeuo pipefail
          lock=arm64/locks/gooroom-integration-applet-reconstruction-v2/latest
          test -d "$lock"
          (
            cd "$lock"
            sha256sum --check --strict LOCKSUMS.sha256
          )

          test "$(sha256sum "$lock/summary.json" | awk '{print $1}')" = "$AUTHORITY_SUMMARY_SHA256"
          test "$(sha256sum arm64/scripts/reconstruct_integration_applet_han3u3_v2.sh.gz | awk '{print $1}')" \
            = "$AUTHORITY_RUNNER_GZIP_SHA256"
          test "$(git hash-object arm64/scripts/reconstruct_integration_applet_han3u3_v2.sh.gz)" \
            = "$AUTHORITY_RUNNER_GIT_BLOB"

          jq -e \
            --arg run "$AUTHORITY_RUN_ID" \
            --arg trigger "$AUTHORITY_TRIGGER_SHA" \
            --arg digest "${AUTHORITY_ARTIFACT_DIGEST#sha256:}" '
              .actions_run_id == $run
              and .triggering_head_sha == $trigger
              and .artifact_digest == $digest
              and .package_promotion_allowed == false
              and .iso_assembly_allowed == false
              and .fail_closed == true
            ' "$lock/artifact-lock.json" >/dev/null

          jq -e \
            --arg version "$APPLET_VERSION" '
              .status == null or .status == "ok"
            ' "$lock/summary.json" >/dev/null
          jq -e \
            --arg version "$APPLET_VERSION" '
              .version == $version
              and .build_succeeded == true
              and .candidate_source_reconstructed == true
              and .amd64_normalized_equivalence_verified == true
              and .filesystem_and_payload_equal == true
              and .control_fields_equal == true
              and .elf_allocated_sections_equal == true
              and .entry_mismatch_count == 0
              and .built_entry_count == 67
              and .target_entry_count == 67
              and .compared_elf_count == 2
              and .target_elf_count == 2
              and .native_arm64_candidate_build_allowed == true
              and .package_promotion_allowed == false
              and .iso_assembly_allowed == false
              and .fail_closed == true
            ' "$lock/summary.json" >/dev/null

      - name: Resolve and download the exact successful authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/authority-artifact
          metadata="$RUNNER_TEMP/authority-artifact.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID" \
            > "$metadata"

          jq -e \
            --argjson id "$AUTHORITY_ARTIFACT_ID" \
            --arg name "$AUTHORITY_ARTIFACT_NAME" \
            --arg digest "$AUTHORITY_ARTIFACT_DIGEST" \
            --arg run "$AUTHORITY_RUN_ID" \
            --arg head "$AUTHORITY_TRIGGER_SHA" '
              .id == $id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and (.workflow_run.id | tostring) == $run
              and .workflow_run.head_sha == $head
            ' "$metadata" >/dev/null

          gh run download "$AUTHORITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$AUTHORITY_ARTIFACT_NAME" \
            --dir work/authority-artifact

          test -d work/authority-artifact/candidate
          test -d work/authority-artifact/output
          (
            cd work/authority-artifact/output
            sha256sum --check --strict LOCKSUMS.final.sha256
          )
          test "$(sha256sum work/authority-artifact/output/summary.json | awk '{print $1}')" \
            = "$AUTHORITY_SUMMARY_SHA256"

      - name: Prepare exact reconstructed source and exact Nimf source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/native
          mkdir -p work/native/evidence work/native/build
          cp -a work/authority-artifact/candidate work/native/candidate

          git clone --no-tags https://github.com/gooroom/nimf.git work/native/nimf
          git -C work/native/nimf checkout --detach "$NIMF_SOURCE_COMMIT"
          test "$(git -C work/native/nimf rev-parse HEAD)" = "$NIMF_SOURCE_COMMIT"
          test "$(git -C work/native/nimf rev-parse 'HEAD^{tree}')" = "$NIMF_SOURCE_TREE"
          test "$(dpkg-parsechangelog -lwork/native/nimf/debian/changelog -SVersion)" = "$NIMF_VERSION"
          test "$(dpkg-parsechangelog -lwork/native/candidate/debian/changelog -SVersion)" = "$APPLET_VERSION"

      - name: Build exact Nimf and reconstructed applet natively on ARM64 Bullseye
        id: native_build
        shell: bash
        run: |
          set -Eeuo pipefail
          image="debian:bullseye@$BULLSEYE_BASE_DIGEST"
          docker pull "$image"
          docker image inspect "$image" > work/native/evidence/bullseye-image-inspect.json

          docker run --rm "$image" bash -Eeuo pipefail -c '
            test "$(uname -m)" = aarch64
            test "$(dpkg --print-architecture)" = arm64
          '

          docker run --rm \
            -v "$PWD/work/native:/work" \
            -w /work \
            -e NIMF_VERSION="$NIMF_VERSION" \
            -e APPLET_VERSION="$APPLET_VERSION" \
            "$image" \
            bash -Eeuo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates debhelper devscripts dpkg-dev equivs \
                fakeroot file git gnupg jq pkg-config

              test "$(uname -m)" = aarch64
              test "$(dpkg --print-architecture)" = arm64

              cd /work/nimf
              test "$(dpkg-parsechangelog -SVersion)" = "$NIMF_VERSION"
              mk-build-deps \
                --install --remove \
                --tool "apt-get -y --no-install-recommends" \
                debian/control
              dpkg-buildpackage -b -uc -us

              cd /work
              nimf_lib="$(find . -maxdepth 1 -type f -name "libnimf1_${NIMF_VERSION}_arm64.deb" -print -quit)"
              nimf_dev="$(find . -maxdepth 1 -type f -name "nimf-dev_${NIMF_VERSION}_arm64.deb" -print -quit)"
              test -n "$nimf_lib"
              test -n "$nimf_dev"
              test "$(dpkg-deb -f "$nimf_lib" Version)" = "$NIMF_VERSION"
              test "$(dpkg-deb -f "$nimf_dev" Version)" = "$NIMF_VERSION"
              test "$(dpkg-deb -f "$nimf_lib" Architecture)" = arm64
              test "$(dpkg-deb -f "$nimf_dev" Architecture)" = arm64
              apt-get install -y --no-install-recommends "$nimf_lib" "$nimf_dev"

              cd /work/candidate
              test "$(dpkg-parsechangelog -SVersion)" = "$APPLET_VERSION"
              mk-build-deps \
                --install --remove \
                --tool "apt-get -y --no-install-recommends" \
                debian/control
              test "$(dpkg-query -W -f="\${Version}" nimf-dev)" = "$NIMF_VERSION"
              test "$(dpkg-query -W -f="\${Architecture}" nimf-dev)" = arm64
              dpkg-buildpackage -b -uc -us

              cd /work
              applet="$(find . -maxdepth 1 -type f -name "gooroom-integration-applet_${APPLET_VERSION}_arm64.deb" -print -quit)"
              test -n "$applet"
              test "$(dpkg-deb -f "$applet" Version)" = "$APPLET_VERSION"
              test "$(dpkg-deb -f "$applet" Architecture)" = arm64

              cp "$nimf_lib" "$nimf_dev" "$applet" /work/build/
              dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\n" \
                nimf-dev libnimf1 > /work/evidence/native-build-packages.tsv
              dpkg --print-architecture > /work/evidence/container-dpkg-architecture.txt
              uname -m > /work/evidence/container-uname-machine.txt
            '

          applet="$(find work/native/build -maxdepth 1 -type f \
            -name "gooroom-integration-applet_${APPLET_VERSION}_arm64.deb" -print -quit)"
          test -n "$applet"
          printf 'applet=%s\n' "$applet" >> "$GITHUB_OUTPUT"

      - name: Fail-closed cross-architecture verification
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/native/verification
          python3 arm64/scripts/verify_integration_applet_han3u3_native_v1.py \
            --authority-artifact work/authority-artifact \
            --arm64-deb "${{ steps.native_build.outputs.applet }}" \
            --out work/native/verification \
            --authority-run-id "$AUTHORITY_RUN_ID" \
            --authority-artifact-id "$AUTHORITY_ARTIFACT_ID" \
            --authority-artifact-digest "$AUTHORITY_ARTIFACT_DIGEST" \
            --authority-summary-sha256 "$AUTHORITY_SUMMARY_SHA256" \
            --trigger-sha "$GITHUB_SHA" \
            --bullseye-base-digest "$BULLSEYE_BASE_DIGEST" \
            --nimf-source-commit "$NIMF_SOURCE_COMMIT" \
            --nimf-source-tree "$NIMF_SOURCE_TREE"

          jq -e '
            .status == "ok"
            and .native_arm64_candidate_verified == true
            and .package == "gooroom-integration-applet"
            and .version == "0.3.1+grm3u1+han3u3"
            and .architecture == "arm64"
            and .entry_count == 67
            and .elf_count == 2
            and .x86_elf_count == 0
            and .non_elf_payload_equal == true
            and .path_inventory_equal == true
            and .elf_semantics_equal == true
            and .control_semantics_equal == true
            and .package_promotion_allowed == true
            and .package_promoted == false
            and .iso_assembly_allowed == false
            and .fail_closed == true
          ' work/native/verification/summary.json >/dev/null

          (
            cd work/native/verification
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          jq '.' work/native/verification/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native ARM64 candidate and complete evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-integration-applet-han3u3-native-arm64-v1
          path: |
            work/native/build
            work/native/evidence
            work/native/verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Commit compact native candidate authority
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source=work/native/verification
          destination=arm64/locks/gooroom-integration-applet-native-arm64-v1/latest
          rm -rf "$destination"
          mkdir -p "$destination"

          for name in \
            summary.json \
            control-comparison.json \
            payload-comparison.json \
            elf-comparison.json \
            package-sha256.txt
          do
            test -f "$source/$name"
            cp "$source/$name" "$destination/"
          done

          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg authority_run_id "$AUTHORITY_RUN_ID" \
            --arg authority_artifact_id "$AUTHORITY_ARTIFACT_ID" \
            --arg authority_artifact_digest "$AUTHORITY_ARTIFACT_DIGEST" \
            --arg authority_summary_sha256 "$AUTHORITY_SUMMARY_SHA256" \
            --arg bullseye_base_digest "$BULLSEYE_BASE_DIGEST" \
            --arg nimf_source_commit "$NIMF_SOURCE_COMMIT" \
            --arg nimf_source_tree "$NIMF_SOURCE_TREE" '
              {
                schema: 1,
                actions_run_id: $run_id,
                actions_run_attempt: $run_attempt,
                actions_run_url: $run_url,
                triggering_head_sha: $head_sha,
                artifact_id: $artifact_id,
                artifact_digest: $artifact_digest,
                amd64_authority: {
                  run_id: $authority_run_id,
                  artifact_id: $authority_artifact_id,
                  artifact_digest: $authority_artifact_digest,
                  summary_sha256: $authority_summary_sha256
                },
                native_build: {
                  runner: "ubuntu-24.04-arm",
                  bullseye_base_digest: $bullseye_base_digest,
                  nimf_source_commit: $nimf_source_commit,
                  nimf_source_tree: $nimf_source_tree
                },
                native_arm64_candidate_verified: true,
                package_promotion_allowed: true,
                package_promoted: false,
                iso_assembly_allowed: false,
                fail_closed: true
              }
            ' > "$destination/artifact-lock.json"

          find "$destination" -type f \
            ! -name FILE-INVENTORY.tsv \
            ! -name LOCKSUMS.sha256 \
            -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$destination/FILE-INVENTORY.tsv"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git diff --cached --check
          git commit -m 'Verify native ARM64 integration applet han3u3 candidate'

          for attempt in 1 2 3 4 5 6 7 8; do
            if git fetch --no-tags origin arm64-port \
              && git rebase origin/arm64-port \
              && git push origin HEAD:arm64-port
            then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
