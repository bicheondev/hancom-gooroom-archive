name: ARM64 port - extract Gooroom applauncher Hancom deep diff

on:
  workflow_dispatch:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-extract-gooroom-applauncher-han3u2.yml'
      - 'arm64/scripts/run_gooroom_applauncher_han3u2_deep_diff.sh'
      - 'arm64/locks/source-reconstruction/gooroom-applauncher-applet/0.4.0_grm3u1_han3u2/input-lock.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: hancom-gooroom-33-extract-applauncher-han3u2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:bullseye
    env:
      INPUT_LOCK: arm64/locks/source-reconstruction/gooroom-applauncher-applet/0.4.0_grm3u1_han3u2/input-lock.json

    steps:
      - name: Install deterministic audit and build tools
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash binutils build-essential ca-certificates curl debhelper devscripts \
            diffutils dpkg-dev equivs fakeroot file git gzip jq pkg-config \
            python3 tar unzip xz-utils

      - name: Check out locked branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Correct provisional symbol assumptions and run exact extraction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p work
          runner=work/run-gooroom-applauncher-han3u2-deep-diff.sh
          cp arm64/scripts/run_gooroom_applauncher_han3u2_deep_diff.sh "$runner"

          python3 - "$runner" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = {
              'for symbol in dragsource_initialize applauncher_icon_get_path; do':
                  'for symbol in applauncher_appitem_get_path applauncher_appitem_get_drag_surface; do',
              "awk '$8 == \"dragsource_initialize\" || $8 == \"applauncher_icon_get_path\" {print}'":
                  "awk '$8 == \"applauncher_appitem_get_path\" || $8 == \"applauncher_appitem_get_drag_surface\" {print}'",
              '- Confirmed Hancom-only exports: `dragsource_initialize`, `applauncher_icon_get_path`':
                  '- Confirmed Hancom-only exports: `applauncher_appitem_get_path`, `applauncher_appitem_get_drag_surface`',
              '        "applauncher_icon_get_path",\n        "dragsource_initialize",':
                  '        "applauncher_appitem_get_drag_surface",\n        "applauncher_appitem_get_path",',
              'BASE_TREE="$(jq -r \'.base_source.tree\' "$INPUT_LOCK")"\n\n[[':
                  'BASE_TREE="$(jq -r \'.base_source.tree\' "$INPUT_LOCK")"\n\n'
                  'export ARTIFACT_ID ARTIFACT_NAME ARTIFACT_SIZE ARTIFACT_DIGEST \\\n'
                  '  ARTIFACT_RUN_ID ARTIFACT_HEAD_BRANCH ARTIFACT_HEAD_SHA \\\n'
                  '  TARGET_URL TARGET_FILENAME TARGET_SHA256 TARGET_PACKAGE TARGET_VERSION \\\n'
                  '  BASE_REPOSITORY BASE_VERSION BASE_COMMIT BASE_TREE\n\n[[',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          bash -n "$runner"
          rm -rf work/deep-diff
          bash "$runner" "$INPUT_LOCK" work/deep-diff
          jq -e '
            .audit_complete == true and
            .analysis_status == "deep-diff-collected" and
            .claims.source_status == "comparison-only" and
            .claims.reconstruction_status == "not-attempted" and
            .claims.byte_identity_claimed == false and
            .hancom_only_exports_required == [
              "applauncher_appitem_get_drag_surface",
              "applauncher_appitem_get_path"
            ]
          ' work/deep-diff/manifest.json >/dev/null
          diff -u <(printf '%s\n' \
            applauncher_appitem_get_drag_surface \
            applauncher_appitem_get_path) \
            work/deep-diff/target-only-exports.txt

      - name: Upload deep-diff evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-applauncher-han3u2-deep-diff-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
          path: work/deep-diff
