name: ARM64 port - run final gooroom-guide source patcher

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-run-gooroom-guide-final-source-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-run-guide-final-source-patcher
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0
      - name: Apply and verify the reviewed source patch
        run: |
          set -euxo pipefail
          python3 arm64/scripts/patch_gooroom_guide_final_source.py
          python3 -m py_compile arm64/scripts/reconstruct_gooroom_guide_han3u1.py
          git diff --check
          grep -Fq 'get_norun_file_path (void)' arm64/scripts/reconstruct_gooroom_guide_han3u1.py
      - name: Commit the permanent reconstruction update
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/reconstruct_gooroom_guide_han3u1.py
          git rm arm64/scripts/patch_gooroom_guide_final_source.py
          git diff --cached --check
          git commit -m 'Finish exact gooroom-guide AMD64 source reconstruction'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
