name: ARM64 port - resolve and build exact QtBase v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-qtbase-resolve-and-build-v2.yml'
      - 'arm64/scripts/targeted_source_archaeology.py'
      - 'arm64/scripts/promote_targeted_source_lock.py'
      - 'arm64/scripts/build_locked_source_arm64.sh'
      - 'arm64/scripts/run_locked_source_arm64.sh'
      - 'arm64/scripts/run_locked_source_arm64_v4.sh'
      - 'arm64/scripts/validate_arm64_source_outputs_v3.py'
      - 'arm64/scripts/validate_arm64_source_outputs_v4.py'
      - 'arm64/scripts/summarize_arm64_build_wave.py'
      - 'arm64/locks/effective-sources/**'
      - 'arm64/locks/reference/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-qtbase-resolve-and-build-v2
  cancel-in-progress: true

env:
  SOURCE_NAME: qtbase-opensource-src
  SOURCE_VERSION: 5.15.2+dfsg-9+grm3u1

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
    steps:
      - name: Check out preserved source evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Search all relevant Git histories for the exact changelog
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uxo pipefail
          rm -rf work/qtbase-resolution-v2
          mkdir -p work/qtbase-resolution-v2
          set +e
          python3 arm64/scripts/targeted_source_archaeology.py \
            --source "$SOURCE_NAME" \
            --version "$SOURCE_VERSION" \
            --output-dir work/qtbase-resolution-v2 \
            --maximum-repositories 40
          rc=$?
          set -e
          if [ "$rc" = 0 ] && \
             [ -f work/qtbase-resolution-v2/targeted-source-lock.json ] && \
             [ "$(jq -r '.status' work/qtbase-resolution-v2/targeted-source-lock.json)" = resolved ]; then
            echo 'resolved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'resolved=false' >> "$GITHUB_OUTPUT"
          fi
          echo "$rc" > work/qtbase-resolution-v2/resolver.exit-code
          find work/qtbase-resolution-v2 -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/qtbase-resolution-v2/LOCKSUMS.sha256
          exit 0

      - name: Upload the exact lock or complete negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtbase-resolution-v2
          path: work/qtbase-resolution-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit resolution evidence before the ARM64 build
        if: always()
        run: |
          set -euxo pipefail
          git pull --rebase origin arm64-port
          destination=arm64/locks/targeted-sources-v2/qtbase-opensource-src/5.15.2+dfsg-9+grm3u1
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a work/qtbase-resolution-v2/. "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact QtBase source resolution v2'
            git pull --rebase origin arm64-port
            git push origin HEAD:arm64-port
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.resolved == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out exact locks and builders
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download the exact source resolution from this run
        uses: actions/download-artifact@v4
        with:
          name: qtbase-resolution-v2
          path: work/qtbase-resolution-v2

      - name: Promote the immutable Git tree into a temporary effective lock
        run: |
          set -euxo pipefail
          mkdir -p work/qtbase-promoted-v2
          python3 arm64/scripts/promote_targeted_source_lock.py \
            --effective-lock arm64/locks/effective-sources/effective-source-lock.json \
            --targeted-lock work/qtbase-resolution-v2/targeted-source-lock.json \
            --source "$SOURCE_NAME" \
            --version "$SOURCE_VERSION" \
            --output-lock work/qtbase-promoted-v2/effective-source-lock.json \
            --evidence work/qtbase-promoted-v2/promotion.json

      - name: Verify the native ARM64 build host
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'This job must run on native ARM64.' >&2; exit 1 ;;
          esac
          docker version
          test "$(docker info --format '{{.Architecture}}')" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev file git jq python3

      - name: Build the exact QtBase commit for ARM64
        id: native_build
        continue-on-error: true
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z
        run: |
          set -euxo pipefail
          chmod +x \
            arm64/scripts/build_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64_v4.sh \
            arm64/scripts/validate_arm64_source_outputs_v3.py \
            arm64/scripts/validate_arm64_source_outputs_v4.py
          rm -rf work/qtbase-arm64-v2
          arm64/scripts/run_locked_source_arm64_v4.sh \
            work/qtbase-promoted-v2/effective-source-lock.json \
            "$SOURCE_NAME" \
            work/qtbase-arm64-v2
          jq -e '.status == "passed"' \
            work/qtbase-arm64-v2/arm64-source-output-validation-v4.json
          find work/qtbase-arm64-v2 -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > work/qtbase-arm64-v2/SHA256SUMS

      - name: Upload exact QtBase packages and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtbase-opensource-src-exact-arm64-v2
          path: |
            work/qtbase-arm64-v2
            work/qtbase-promoted-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Summarize and checksum the native build attempt
        if: always()
        run: |
          set -uxo pipefail
          rm -rf work/qtbase-build-evidence-v2
          mkdir -p work/qtbase-build-evidence-v2 work/qtbase-arm64-v2
          set +e
          python3 arm64/scripts/summarize_arm64_build_wave.py \
            --artifacts-root work \
            --output-dir work/qtbase-build-evidence-v2 \
            --schema hancom-gooroom-arm64-qtbase-build-evidence-v2 \
            --expected-source "$SOURCE_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --head-branch "$GITHUB_REF_NAME" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --download-status success
          summary_rc=$?
          set -e
          echo "$summary_rc" > work/qtbase-build-evidence-v2/summarizer.exit-code
          cp work/qtbase-promoted-v2/promotion.json \
            work/qtbase-build-evidence-v2/
          cp work/qtbase-resolution-v2/targeted-source-lock.json \
            work/qtbase-build-evidence-v2/
          find work/qtbase-build-evidence-v2 -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/qtbase-build-evidence-v2/LOCKSUMS.sha256
          jq . work/qtbase-build-evidence-v2/summary.json

      - name: Commit native build evidence before enforcing it
        if: always()
        run: |
          set -euxo pipefail
          git pull --rebase origin arm64-port
          destination=arm64/locks/build-qtbase-v2
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a work/qtbase-build-evidence-v2/. "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact QtBase ARM64 build v2 evidence'
            git pull --rebase origin arm64-port
            git push origin HEAD:arm64-port
          fi

      - name: Upload consolidated QtBase build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtbase-opensource-src-arm64-build-evidence-v2
          path: work/qtbase-build-evidence-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce exact native QtBase output
        if: always()
        run: |
          set -euxo pipefail
          test '${{ steps.native_build.outcome }}' = success
          test "$(jq -r '.status' work/qtbase-build-evidence-v2/summary.json)" = passed

  gate:
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce exact resolution and ARM64 build
        run: |
          set -euxo pipefail
          test '${{ needs.resolve.outputs.resolved }}' = true
          test '${{ needs.build.result }}' = success
