name: ARM64 port - install exact gnome-flashback reconstruction tools

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-install-gnome-flashback-reconstruction-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-install-gnome-flashback-tools
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the latest evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Decode and verify the reviewed tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p arm64/scripts
          cat \
            arm64/bootstrap/gnome-flashback/reconstruct.part00.b64 \
            arm64/bootstrap/gnome-flashback/reconstruct.part01.b64 \
            | base64 --decode | gzip --decompress \
            > arm64/scripts/reconstruct_gnome_flashback_han3u4.py
          cat arm64/bootstrap/gnome-flashback/build.b64 \
            | base64 --decode | gzip --decompress \
            > arm64/scripts/build_gnome_flashback_han3u4_chroot.sh
          cat \
            arm64/bootstrap/gnome-flashback/verify.part00.b64 \
            arm64/bootstrap/gnome-flashback/verify.part01.b64 \
            | base64 --decode | gzip --decompress \
            > arm64/scripts/verify_gnome_flashback_han3u4_amd64.py
          chmod 0755 \
            arm64/scripts/reconstruct_gnome_flashback_han3u4.py \
            arm64/scripts/build_gnome_flashback_han3u4_chroot.sh \
            arm64/scripts/verify_gnome_flashback_han3u4_amd64.py
          cat > /tmp/gnome-flashback-tools.sha256 <<'EOF'
          70d659b63663f67b4ed23481c25d22cb693327fa3258dc5149e4a2ac43ce6395  arm64/scripts/reconstruct_gnome_flashback_han3u4.py
          b8d22eb896c0bf021d1d8180755eaa57f31007daa5d302b4e4cff2252ffa4984  arm64/scripts/build_gnome_flashback_han3u4_chroot.sh
          34ab74a7bb3bb0f11d79be2639406a936641763fc1e7c3d16faa3e98f9859176  arm64/scripts/verify_gnome_flashback_han3u4_amd64.py
          EOF
          sha256sum --check --strict /tmp/gnome-flashback-tools.sha256
          python3 -m py_compile \
            arm64/scripts/reconstruct_gnome_flashback_han3u4.py \
            arm64/scripts/verify_gnome_flashback_han3u4_amd64.py
          bash -n arm64/scripts/build_gnome_flashback_han3u4_chroot.sh

      - name: Commit only permanent tools and remove bootstrap material
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/bootstrap/gnome-flashback
          rm -f .github/workflows/arm64-install-gnome-flashback-reconstruction-tools.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            arm64/scripts/reconstruct_gnome_flashback_han3u4.py \
            arm64/scripts/build_gnome_flashback_han3u4_chroot.sh \
            arm64/scripts/verify_gnome_flashback_han3u4_amd64.py \
            arm64/bootstrap/gnome-flashback \
            .github/workflows/arm64-install-gnome-flashback-reconstruction-tools.yml
          git diff --cached --check
          git commit -m 'Add strict gnome-flashback han3u4 reconstruction tools'
          pushed=false
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              pushed=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = true
