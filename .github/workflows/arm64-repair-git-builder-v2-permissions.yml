name: ARM64 port - repair Git builder output ownership

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-git-builder-v2-permissions.yml'
      - 'arm64/scripts/repair_git_builder_v2_permissions.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-git-builder-v2-permissions
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the current self-contained builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Restore host ownership after containerized builds
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_git_builder_v2_permissions.py \
            --target arm64/scripts/build_locked_source_arm64_v2.sh
          python3 -m py_compile arm64/scripts/repair_git_builder_v2_permissions.py
          bash -n arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'chown -R "$HOST_UID:$HOST_GID" /out' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq -- '--env "HOST_UID=$(id -u)"' \
            arm64/scripts/build_locked_source_arm64_v2.sh

      - name: Commit the output-ownership repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_locked_source_arm64_v2.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore ARM64 build output ownership to the runner'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
