name: ARM64 port - bootstrap audited finalizer compatibility

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-bootstrap-finalizer-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-bootstrap-finalizer-compat
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Register and create the v2 compatibility entry point
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/audit_active_arm64_pipeline.py')
          text = path.read_text(encoding='utf-8')
          forbidden = 'SUPERSEDED_SCRIPTS = {\n    "arm64/scripts/finalize_arm64_live_rootfs.sh",\n'
          allowed = 'SUPERSEDED_SCRIPTS = {\n'
          if text.count(forbidden) != 1:
              raise SystemExit(
                  f'expected one superseded finalizer entry, found {text.count(forbidden)}'
              )
          text = text.replace(forbidden, allowed, 1)

          required = '    "arm64/scripts/finalize_arm64_live_rootfs_v2.sh",\n'
          replacement = (
              '    # Compatibility entry point used by the recovered-rootfs path; '\
              'it delegates only to v2.\n'
              '    "arm64/scripts/finalize_arm64_live_rootfs.sh",\n'
              '    "arm64/scripts/finalize_arm64_live_rootfs_v2.sh",\n'
          )
          if text.count(required) != 1:
              raise SystemExit(
                  f'expected one required v2 finalizer entry, found {text.count(required)}'
              )
          path.write_text(text.replace(required, replacement, 1), encoding='utf-8')
          PY

          cat > arm64/scripts/finalize_arm64_live_rootfs.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$SCRIPT_DIR/finalize_arm64_live_rootfs_v2.sh" "$@"
          SH
          chmod +x arm64/scripts/finalize_arm64_live_rootfs.sh

          bash -n arm64/scripts/finalize_arm64_live_rootfs.sh
          bash -n arm64/scripts/finalize_arm64_live_rootfs_v2.sh
          python3 -m py_compile arm64/scripts/audit_active_arm64_pipeline.py
          git diff --check

      - name: Commit compatibility code without modifying workflows
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            arm64/scripts/audit_active_arm64_pipeline.py \
            arm64/scripts/finalize_arm64_live_rootfs.sh
          git commit -m 'Register v2 finalizer compatibility entry point'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
