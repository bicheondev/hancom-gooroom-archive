name: ARM64 port - verified Gooroom greeter han3u2 ARM64 build v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-build-gooroom-greeter-han3u2-v2.yml'
      - 'arm64/scripts/reconstruct_gooroom_greeter_han3u2.py'
      - 'arm64/scripts/verify_gooroom_greeter_han3u2_structural.py'
      - 'arm64/scripts/build_gooroom_greeter_han3u2_chroot.sh'
      - 'arm64/scripts/verify_gooroom_greeter_arm64.py'
      - 'arm64/scripts/promote_gooroom_greeter_han3u2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-build-greeter-han3u2
  cancel-in-progress: true

env:
  SNAPSHOT: 20230730T235959Z
  VERSION: 0.3.1+grm3u1+han3u2
  BASE_REPOSITORY: hancom-io/gooroom-greeter
  BASE_COMMIT: 886f8b6c5cd35117fd5a2d31896e4f9818400960
  BASE_TREE: ef841874d45b7f44f08c4d337d49802b28d35b5e
  TARGET_URL: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-greeter/gooroom-greeter_0.3.1+grm3u1+han3u2_amd64.deb
  TARGET_SHA256: 61189d72a44e030a7e5658dc9d470a6c52579ab7994deef2f705c34cd0084836
  TARGET_SIZE: '282940'
  DEBUG_URL: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-greeter/gooroom-greeter-dbgsym_0.3.1+grm3u1+han3u2_amd64.deb
  DEBUG_SHA256: 2d883d730eeb0e38d27828fe873d928fca9ef7d44020e5a775e41ca514964237
  DEBUG_SIZE: '129604'

jobs:
  source-equivalence:
    name: Reconstruct and verify the exact source authority
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact audit implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install source, historical-rootfs, and ELF tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates curl debootstrap debian-archive-keyring \
            dpkg-dev file git gzip jq python3 xz-utils
          python3 -m py_compile \
            arm64/scripts/reconstruct_gooroom_greeter_han3u2.py \
            arm64/scripts/verify_gooroom_greeter_han3u2_structural.py
          bash -n arm64/scripts/build_gooroom_greeter_han3u2_chroot.sh

      - name: Reconstruct han3u2 from the exact public han3u1 tree
        run: |
          set -euxo pipefail
          output=work/greeter-source
          rm -rf "$output"
          mkdir -p "$output/authority" "$output/downloads"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/$BASE_REPOSITORY.git" "$output/source"
          git -C "$output/source" fetch --depth=1 origin "$BASE_COMMIT"
          git -C "$output/source" checkout --detach "$BASE_COMMIT"
          test "$(git -C "$output/source" rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git -C "$output/source" rev-parse HEAD^{tree})" = "$BASE_TREE"
          python3 arm64/scripts/reconstruct_gooroom_greeter_han3u2.py \
            --source-dir "$output/source" \
            --output-lock "$output/authority/reconstruction-lock.json"
          test "$(jq -r '.source_version' "$output/authority/reconstruction-lock.json")" = "$VERSION"

      - name: Lock the exact vendor AMD64 target and debug package
        run: |
          set -euxo pipefail
          output=work/greeter-source
          curl --fail --show-error --location --retry 6 --retry-delay 2 --retry-all-errors \
            "$TARGET_URL" -o "$output/downloads/target.deb"
          curl --fail --show-error --location --retry 6 --retry-delay 2 --retry-all-errors \
            "$DEBUG_URL" -o "$output/downloads/target-dbgsym.deb"
          test "$(stat -c '%s' "$output/downloads/target.deb")" = "$TARGET_SIZE"
          test "$(stat -c '%s' "$output/downloads/target-dbgsym.deb")" = "$DEBUG_SIZE"
          echo "$TARGET_SHA256  $output/downloads/target.deb" | sha256sum --check -
          echo "$DEBUG_SHA256  $output/downloads/target-dbgsym.deb" | sha256sum --check -
          test "$(dpkg-deb -f "$output/downloads/target.deb" Version)" = "$VERSION"
          mkdir -p "$output/target-root" "$output/target-debug-root"
          dpkg-deb -x "$output/downloads/target.deb" "$output/target-root"
          dpkg-deb -x "$output/downloads/target-dbgsym.deb" "$output/target-debug-root"
          gzip -dc "$output/target-root/usr/share/doc/gooroom-greeter/changelog.gz" \
            > "$output/target-changelog"
          echo '5a843cdc103427616c1b5f8e98f6259187941658d805b16e50b9cfafc170bb71  work/greeter-source/target-changelog' \
            | sha256sum --check -
          cmp "$output/target-changelog" "$output/source/debian/changelog"
          jq -n \
            --arg url "$TARGET_URL" --arg sha256 "$TARGET_SHA256" \
            --argjson size "$TARGET_SIZE" --arg debug_url "$DEBUG_URL" \
            --arg debug_sha256 "$DEBUG_SHA256" --argjson debug_size "$DEBUG_SIZE" '
              {schema: 2,
               target: {package:"gooroom-greeter", version:"0.3.1+grm3u1+han3u2", architecture:"amd64", url:$url, size:$size, sha256:$sha256},
               debug_symbols: {package:"gooroom-greeter-dbgsym", version:"0.3.1+grm3u1+han3u2", architecture:"amd64", url:$debug_url, size:$debug_size, sha256:$debug_sha256}}
            ' > "$output/authority/target-binary-lock.json"

      - name: Build the reconstructed source in a clean historical AMD64 rootfs
        run: |
          set -euxo pipefail
          output=work/greeter-source
          sudo bash arm64/scripts/build_gooroom_greeter_han3u2_chroot.sh \
            amd64 \
            "$output/authority/reconstructed-source.tar" \
            "$output/amd64-build" \
            "$SNAPSHOT"
          sudo chown -R "$(id -u):$(id -g)" "$output/amd64-build"
          main=''
          debug=''
          for deb in "$output"/amd64-build/debs/*.deb; do
            case "$(dpkg-deb -f "$deb" Package)" in
              gooroom-greeter) main="$deb" ;;
              gooroom-greeter-dbgsym) debug="$deb" ;;
            esac
          done
          test -n "$main"
          test -n "$debug"
          mkdir -p "$output/candidate-root" "$output/candidate-debug-root"
          dpkg-deb -x "$main" "$output/candidate-root"
          dpkg-deb -x "$debug" "$output/candidate-debug-root"
          sha256sum "$main" > "$output/authority/amd64-candidate.sha256"

      - name: Verify exact payload and structural ELF/source equivalence
        run: |
          set -euxo pipefail
          output=work/greeter-source
          python3 arm64/scripts/verify_gooroom_greeter_han3u2_structural.py \
            --target-root "$output/target-root" \
            --candidate-root "$output/candidate-root" \
            --target-debug-root "$output/target-debug-root" \
            --candidate-debug-root "$output/candidate-debug-root" \
            --output-dir "$output/equivalence"
          jq -e '
            .verified == true
            and .same_path_set == true
            and .changelog_text_identical == true
            and .structural_elf_equivalence == true
            and .fatal_difference_count == 0
          ' "$output/equivalence/summary.json" >/dev/null
          cp "$output/equivalence/summary.json" "$output/authority/amd64-equivalence-summary.json"
          cp "$output/equivalence/elf-comparison.json" "$output/authority/amd64-elf-comparison.json"
          cp "$output/equivalence/differences.json" "$output/authority/amd64-differences.json"
          cp "$output/equivalence/target-debug-identity.json" "$output/authority/target-debug-identity.json"
          cp "$output/equivalence/candidate-debug-identity.json" "$output/authority/candidate-debug-identity.json"
          jq '
            .status = "verified-reconstructed-source"
            | .amd64_equivalence = {
                passed: true,
                policy: "exact-non-elf-payload-and-elf-abi-resource-relocation-symbol-dwarf-equivalence",
                raw_elf_identical: false,
                summary: "amd64-equivalence-summary.json"
              }
          ' "$output/authority/reconstruction-lock.json" > "$output/authority/reconstruction-lock.tmp"
          mv "$output/authority/reconstruction-lock.tmp" "$output/authority/reconstruction-lock.json"
          (
            cd "$output/authority"
            find . -type f ! -name LOCKSUMS.sha256 -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check LOCKSUMS.sha256
          )

      - name: Upload verified reconstructed source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-greeter-han3u2-verified-source-v2
          path: work/greeter-source/authority
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload AMD64 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-greeter-han3u2-source-diagnostics-v2
          path: |
            work/greeter-source/equivalence
            work/greeter-source/amd64-build/build.log
            work/greeter-source/amd64-build/debootstrap.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  arm64-build:
    name: Build the verified tree natively for ARM64
    needs: source-equivalence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Check out exact build and verification implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified reconstructed source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gooroom-greeter-han3u2-verified-source-v2
          path: work/source-authority

      - name: Verify host and source authority
        run: |
          set -euxo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates debootstrap debian-archive-keyring \
            dpkg-dev file jq python3 xz-utils
          python3 -m py_compile arm64/scripts/verify_gooroom_greeter_arm64.py
          bash -n arm64/scripts/build_gooroom_greeter_han3u2_chroot.sh
          (cd work/source-authority && sha256sum --check LOCKSUMS.sha256)
          expected="$(jq -r '.reconstruction.archive_sha256' work/source-authority/reconstruction-lock.json)"
          echo "$expected  work/source-authority/reconstructed-source.tar" | sha256sum --check -

      - name: Build in a clean native ARM64 historical rootfs
        run: |
          set -euxo pipefail
          sudo bash arm64/scripts/build_gooroom_greeter_han3u2_chroot.sh \
            arm64 \
            work/source-authority/reconstructed-source.tar \
            work/arm64-build \
            "$SNAPSHOT"
          sudo chown -R "$(id -u):$(id -g)" work/arm64-build

      - name: Verify every ARM64 DEB and ELF payload
        run: |
          set -euxo pipefail
          artifact=work/arm64-artifact
          rm -rf "$artifact"
          mkdir -p "$artifact/debs"
          cp work/arm64-build/debs/*.deb "$artifact/debs/"
          python3 arm64/scripts/verify_gooroom_greeter_arm64.py \
            --deb-dir "$artifact/debs" \
            --output-dir "$artifact"
          jq -e '.verified == true and (.wrong_architecture_executables|length)==0 and .main_package_count==1' \
            "$artifact/verification-summary.json" >/dev/null
          cp work/source-authority/reconstruction-lock.json "$artifact/"
          cp work/source-authority/amd64-equivalence-summary.json "$artifact/"
          tree="$(jq -r '.reconstruction.tree_sha' "$artifact/reconstruction-lock.json")"
          archive_sha="$(jq -r '.reconstruction.archive_sha256' "$artifact/reconstruction-lock.json")"
          jq -n --arg tree "$tree" --arg archive_sha "$archive_sha" --arg snapshot "$SNAPSHOT" '
            {schema:2, source:"gooroom-greeter", source_version:"0.3.1+grm3u1+han3u2",
             repository:"hancom-io/gooroom-greeter", base_commit_sha:"886f8b6c5cd35117fd5a2d31896e4f9818400960",
             reconstructed_tree_sha:$tree, source_archive_sha256:$archive_sha,
             target_architecture:"arm64", debian_snapshot:$snapshot,
             build_mode:"native-arm64-clean-historical-rootfs",
             source_authority:"binary-changelog-public-change-id-and-structural-amd64-equivalence"}
          ' > "$artifact/build-lock.json"
          (
            cd "$artifact"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified native ARM64 build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-greeter-han3u2-exact-arm64-v2
          path: work/arm64-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Upload ARM64 build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-greeter-han3u2-arm64-diagnostics-v2
          path: |
            work/arm64-build/build.log
            work/arm64-build/debootstrap.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  promote:
    name: Promote source and ARM64 build evidence
    needs: [source-equivalence, arm64-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current ARM64 evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download verified source authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gooroom-greeter-han3u2-verified-source-v2
          path: work/promote/source

      - name: Download verified ARM64 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gooroom-greeter-han3u2-exact-arm64-v2
          path: work/promote/arm64

      - name: Generate immutable promotion records
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euxo pipefail
          (cd work/promote/source && sha256sum --check LOCKSUMS.sha256)
          (cd work/promote/arm64 && sha256sum --check SHA256SUMS)
          python3 arm64/scripts/promote_gooroom_greeter_han3u2.py \
            --source-artifact work/promote/source \
            --arm64-artifact work/promote/arm64 \
            --repository-root . \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL"
          jq -e '.passed == true' \
            arm64/locks/rebuild-results/gooroom-greeter/0.3.1_grm3u1_han3u2/result.json >/dev/null

      - name: Commit exact source and ARM64 result locks
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            arm64/locks/rebuild-results/gooroom-greeter/0.3.1_grm3u1_han3u2 \
            arm64/locks/gooroom-greeter-han3u2-reconstruction/latest \
            arm64/locks/reconstructed-sources/source-locks.json
          git commit -m 'Promote verified gooroom-greeter han3u2 ARM64 build'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
