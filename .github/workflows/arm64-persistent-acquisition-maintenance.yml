name: ARM64 port - normalize persistent acquisition v2 path

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-persistent-acquisition-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-persistent-acquisition-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Use release-aware acquisition and remove superseded definitions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arm64-exact-rootfs-v2.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'arm64/scripts/materialize_package_acquisition_plan.py',
              'arm64/scripts/materialize_package_acquisition_plan_v2.py',
          )
          if 'arm64/scripts/materialize_package_acquisition_plan_v2.py' not in text:
              raise SystemExit('rootfs workflow was not updated to v2 materializer')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/arm64-package-acquisition-plan.yml 2>/dev/null || true
          git rm -f arm64/scripts/build_package_acquisition_plan.py 2>/dev/null || true
          git rm -f arm64/scripts/prepare_rebuild_release_assets.py 2>/dev/null || true
          git rm -f .github/workflows/arm64-persistent-acquisition-maintenance.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-exact-rootfs-v2.yml
          git commit -m 'Normalize persistent ARM64 acquisition v2 path'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
