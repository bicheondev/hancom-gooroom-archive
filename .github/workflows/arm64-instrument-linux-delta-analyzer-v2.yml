name: ARM64 instrument - Linux delta analyzer failure locator v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-instrument-linux-delta-analyzer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-instrument-linux-delta-analyzer-v2
  cancel-in-progress: false

jobs:
  instrument:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Add failure locator using an encoded YAML fragment
        shell: bash
        run: |
          set -euxo pipefail
          target=.github/workflows/arm64-analyze-linux-5.10.179-grm3u1-delta-v1.yml
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('.github/workflows/arm64-analyze-linux-5.10.179-grm3u1-delta-v1.yml')
          text = path.read_text(encoding='utf-8')
          marker = 'Persist Linux delta analyzer failure locator'
          fragment = base64.b64decode('').decode('utf-8')
          if marker not in text:
              path.write_text(text.rstrip() + '\n' + fragment, encoding='utf-8')
          PY
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          for value in (
              '.github/workflows/arm64-analyze-linux-5.10.179-grm3u1-delta-v1.yml',
              '.github/workflows/arm64-instrument-linux-delta-analyzer-v2.yml',
          ):
              yaml.safe_load(Path(value).read_text(encoding='utf-8'))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm .github/workflows/arm64-instrument-linux-delta-analyzer-v2.yml
          git diff --cached --check
          git commit -m 'Instrument Linux delta analyzer failure locator'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
