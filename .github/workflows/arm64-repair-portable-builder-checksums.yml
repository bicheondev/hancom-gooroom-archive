name: ARM64 port - repair portable builder checksums

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-portable-builder-checksums.yml'
      - 'arm64/scripts/repair_portable_builder_checksums.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-portable-builder-checksums
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the current exact Git builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Replace absolute-path checksum records
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_portable_builder_checksums.py \
            --target arm64/scripts/build_locked_source_arm64_v2.sh
          python3 -m py_compile arm64/scripts/repair_portable_builder_checksums.py
          bash -n arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'cd "$OUTPUT_DIR_ABS"' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq '> SHA256SUMS' \
            arm64/scripts/build_locked_source_arm64_v2.sh

      - name: Commit portable checksum generation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_locked_source_arm64_v2.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Make exact ARM64 builder checksum manifests portable'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
