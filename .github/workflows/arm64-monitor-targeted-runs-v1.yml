name: ARM64 monitor targeted runs v1

'on':
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-monitor-targeted-runs-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-targeted-run-monitor-v1
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Record current targeted workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          destination=arm64/status/targeted-runs-v1
          rm -rf "$destination"
          mkdir -p "$destination"
          workflows=(
            arm64-reconstruct-build-promote-session-manager-han3u2-v2.yml
            arm64-diagnose-integration-applet-public-bases-v1.yml
          )
          for workflow in "${workflows[@]}"; do
            slug="${workflow%.yml}"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch arm64-port \
              --limit 10 \
              --json databaseId,displayTitle,workflowName,status,conclusion,event,headSha,createdAt,updatedAt,url \
              > "$destination/$slug.json"
          done
          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile session "$destination/arm64-reconstruct-build-promote-session-manager-han3u2-v2.json" \
            --slurpfile integration "$destination/arm64-diagnose-integration-applet-public-bases-v1.json" '
              {
                schema: 1,
                generated_at: $generated_at,
                session_manager: $session[0],
                integration_applet: $integration[0]
              }
            ' > "$destination/summary.json"
          find "$destination" -type f -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$destination/FILE-INVENTORY.tsv"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Record targeted ARM64 workflow runs'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
