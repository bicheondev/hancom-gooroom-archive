name: ARM64 port - build exact package wave 1 v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-build-wave1-v2.yml'
      - 'arm64/scripts/filter_arm64_binary_lock.py'
      - 'arm64/scripts/test_filter_arm64_binary_lock.py'
      - 'arm64/scripts/run_locked_source_arm64_v2.sh'
      - 'arm64/scripts/verify_locked_arm64_build_v2.sh'
      - 'arm64/scripts/run_locked_source_arm64.sh'
      - 'arm64/scripts/build_locked_source_arm64_v2.sh'
      - 'arm64/scripts/verify_locked_arm64_build.sh'
      - 'arm64/locks/effective-sources/**'
      - 'arm64/locks/reference/amd64-reference.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hancom-gooroom-33-arm64-build-wave1-v2
  cancel-in-progress: true

env:
  HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z

jobs:
  filter-regression:
    name: Validate source-lock filter semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering lock/filter revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run fail-closed filter regression tests
        run: |
          set -euxo pipefail
          python3 arm64/scripts/test_filter_arm64_binary_lock.py
          python3 -m py_compile \
            arm64/scripts/filter_arm64_binary_lock.py \
            arm64/scripts/test_filter_arm64_binary_lock.py
          bash -n arm64/scripts/verify_locked_arm64_build_v2.sh

  build:
    name: ${{ matrix.source }}
    needs: filter-regression
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source:
          - file-roller
          - celluloid
          - cups-pk-helper
          - mousetweaks
          - gnome-screenshot
          - p7zip
    steps:
      - name: Check out exact locks and builders
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify native ARM64 host and install verification tools
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'This job must run on native ARM64.' >&2; exit 1 ;;
          esac
          docker version
          docker info --format 'architecture={{.Architecture}} os={{.OSType}}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git jq dpkg-dev ca-certificates file python3

      - name: Build exact locked source for ARM64
        env:
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          set -euxo pipefail
          chmod +x \
            arm64/scripts/filter_arm64_binary_lock.py \
            arm64/scripts/run_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64_v2.sh \
            arm64/scripts/verify_locked_arm64_build.sh \
            arm64/scripts/verify_locked_arm64_build_v2.sh
          output="work/${SOURCE_NAME}-arm64"
          rm -rf "$output"
          arm64/scripts/run_locked_source_arm64_v2.sh \
            arm64/locks/effective-sources/effective-source-lock.json \
            "$SOURCE_NAME" \
            "$output"

      - name: Verify source, version, architecture, and payload machine types
        env:
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          set -euxo pipefail
          output="work/${SOURCE_NAME}-arm64"
          arm64/scripts/verify_locked_arm64_build_v2.sh \
            arm64/locks/effective-sources/effective-source-lock.json \
            "$SOURCE_NAME" \
            "$output"
          sha256sum --check "$output/SHA256SUMS"
          test "$(find "$output" -maxdepth 1 -name '*_arm64.deb' | wc -l)" -gt 0

      - name: Upload exact ARM64 DEBs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.source }}-exact-arm64-wave1-v2
          path: work/${{ matrix.source }}-arm64
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
