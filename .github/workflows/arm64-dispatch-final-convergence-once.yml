name: ARM64 one-shot dispatch final convergence

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dispatch-final-convergence-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch final convergence pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run arm64-final-convergence-v1.yml \
            --repo "${{ github.repository }}" \
            --ref arm64-port
