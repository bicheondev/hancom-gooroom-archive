name: ARM64 port - repair self-contained exact Git builder v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-git-builder-v2.yml'
      - 'arm64/scripts/repair_git_builder_v2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-git-builder-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Regenerate v2 from the previously verified builder blob
        shell: bash
        run: |
          set -euxo pipefail
          blob=604133a685b136be95a7d3859c204c8935f6bcdf
          git cat-file -e "$blob^{blob}"
          git cat-file blob "$blob" > work-base-builder.sh
          python3 arm64/scripts/repair_git_builder_v2.py \
            --base work-base-builder.sh \
            --output arm64/scripts/build_locked_source_arm64_v2.sh
          chmod +x arm64/scripts/build_locked_source_arm64_v2.sh
          python3 -m py_compile arm64/scripts/repair_git_builder_v2.py
          bash -n arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'DEPENDENCY_REPOSITORY_PACKAGES_SHA256' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'architecture == "amd64"' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq "*-build-deps*.deb" \
            arm64/scripts/build_locked_source_arm64_v2.sh
          ! grep -Fq 'BASE_SCRIPT=' arm64/scripts/build_locked_source_arm64_v2.sh

      - name: Commit the repaired self-contained v2 builder
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_locked_source_arm64_v2.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair self-contained exact Git ARM64 builder v2'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
