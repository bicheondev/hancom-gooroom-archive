name: ARM64 port - repair self-contained exact Git builder v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-git-builder-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-git-builder-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Rebuild v2 from the previously verified builder blob
        shell: bash
        run: |
          set -euxo pipefail
          blob=604133a685b136be95a7d3859c204c8935f6bcdf
          git cat-file -e "$blob^{blob}"
          git cat-file blob "$blob" > arm64/scripts/build_locked_source_arm64_v2.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/build_locked_source_arm64_v2.sh')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          bootstrap = '''BOOTSTRAP_IMAGE="${HANCOM_GOOROOM_BOOTSTRAP_IMAGE:-arm64v8/debian:bullseye-slim@sha256:4ec855d0417cdc9cab49cdebad00afed0466edc3a17bb616a02be18e9ae66f8e}"
'''
          replace_once(
              bootstrap,
              bootstrap + '''REFERENCE_JSON="${HANCOM_GOOROOM_REFERENCE_JSON:-arm64/locks/reference/amd64-reference.json}"
DEPENDENCY_REPOSITORY="${HANCOM_GOOROOM_DEPENDENCY_REPOSITORY:-}"
''',
              'environment',
          )

          expected = '''EXPECTED_PACKAGES="$(jq -r '.binary_packages | join(" ")' <<<"$entry")"
'''
          expected_new = '''if [ -n "${HANCOM_GOOROOM_REQUIRED_PACKAGES:-}" ]; then
  EXPECTED_PACKAGES="$HANCOM_GOOROOM_REQUIRED_PACKAGES"
elif [ -f "$REFERENCE_JSON" ]; then
  EXPECTED_PACKAGES="$(jq -r \\
    --arg source "$SOURCE_NAME" \\
    --arg version "$SOURCE_VERSION" '
      [.packages[]
       | select(.source == $source
                and .source_version == $version
                and .architecture == "amd64")
       | .package]
      | unique | join(" ")
    ' "$REFERENCE_JSON")"
else
  EXPECTED_PACKAGES="$(jq -r '.binary_packages | join(" ")' <<<"$entry")"
fi
EXPECTED_PACKAGES_JSON="$(
  if [ -n "$EXPECTED_PACKAGES" ]; then
    printf '%s\\n' $EXPECTED_PACKAGES | jq -Rsc 'split("\\n")[:-1] | unique | sort'
  else
    printf '[]\\n'
  fi
)"
'''
          replace_once(expected, expected_new, 'native package selection')

          work = '''WORK_DIR="$(mktemp -d)"
trap 'rm -rf "$WORK_DIR"' EXIT
'''
          work_new = work + '''DEPENDENCY_REPOSITORY_COPY="$WORK_DIR/dependency-repository"
mkdir -p "$DEPENDENCY_REPOSITORY_COPY"
DEPENDENCY_REPOSITORY_PACKAGES_SHA256=""
if [ -n "$DEPENDENCY_REPOSITORY" ]; then
  [ -d "$DEPENDENCY_REPOSITORY" ] || {
    echo "dependency repository does not exist: $DEPENDENCY_REPOSITORY" >&2
    exit 69
  }
  for required in Packages Packages.gz Release; do
    [ -f "$DEPENDENCY_REPOSITORY/$required" ] || {
      echo "dependency repository is missing $required" >&2
      exit 69
    }
  done
  if [ -f "$DEPENDENCY_REPOSITORY/SHA256SUMS" ]; then
    (cd "$DEPENDENCY_REPOSITORY" && sha256sum --check SHA256SUMS)
  fi
  cp -a "$DEPENDENCY_REPOSITORY/." "$DEPENDENCY_REPOSITORY_COPY/"
  DEPENDENCY_REPOSITORY_PACKAGES_SHA256="$(
    sha256sum "$DEPENDENCY_REPOSITORY_COPY/Packages" | awk '{print $1}'
  )"
fi
'''
          replace_once(work, work_new, 'dependency repository staging')

          resolv = '''cp -L /etc/resolv.conf "$ROOT/etc/resolv.conf"

mkdir -p "$ROOT/build/source" "$ROOT/build/output"
'''
          resolv_new = '''cp -L /etc/resolv.conf "$ROOT/etc/resolv.conf"

if [ -f /dependency-repository/Packages ]; then
  mkdir -p "$ROOT/opt/hancom-gooroom-dependency-repository"
  cp -a /dependency-repository/. \\
    "$ROOT/opt/hancom-gooroom-dependency-repository/"
  cat > "$ROOT/etc/apt/sources.list.d/98hancom-gooroom-dependencies.list" <<'EOF'
deb [trusted=yes] file:/opt/hancom-gooroom-dependency-repository ./
EOF
  cat > "$ROOT/etc/apt/preferences.d/98hancom-gooroom-dependencies" <<'EOF'
Package: *
Pin: release o=Hancom Gooroom ARM64
Pin-Priority: 1001
EOF
fi

mkdir -p "$ROOT/build/source" "$ROOT/build/output"
'''
          replace_once(resolv, resolv_new, 'dependency repository chroot injection')

          dummy = '''rm -f ./*-build-deps_*.deb
mk-build-deps --build-dep debian/control
DUMMY_PACKAGE="$(find . -maxdepth 1 -type f -name '*-build-deps_*.deb' -print -quit)"
[ -n "$DUMMY_PACKAGE" ]
'''
          dummy_new = '''rm -f ./*-build-deps*.deb
mk-build-deps --build-dep debian/control
DUMMY_PACKAGE="$(find . -maxdepth 1 -type f -name '*-build-deps*.deb' -print -quit)"
if [ -z "$DUMMY_PACKAGE" ]; then
  echo "mk-build-deps did not produce a dependency metapackage" >&2
  find . -maxdepth 1 -type f -printf '%f\\n' | sort >&2
  exit 21
fi
'''
          replace_once(dummy, dummy_new, 'mk-build-deps output discovery')

          mount = '''  --volume "$SOURCE_ROOT:/src:ro" \\
  --volume "$WORK_DIR/build-inside.sh:/build-inside.sh:ro" \\
'''
          mount_new = '''  --volume "$SOURCE_ROOT:/src:ro" \\
  --volume "$DEPENDENCY_REPOSITORY_COPY:/dependency-repository:ro" \\
  --volume "$WORK_DIR/build-inside.sh:/build-inside.sh:ro" \\
'''
          replace_once(mount, mount_new, 'dependency repository mount')

          schema = '''  "schema": 3,
'''
          replace_once(schema, '''  "schema": 5,
''', 'build lock schema')
          expected_json = '''  "expected_binary_packages": $(jq -c '.binary_packages' <<<"$entry"),
'''
          replace_once(
              expected_json,
              '''  "expected_binary_packages": $EXPECTED_PACKAGES_JSON,
  "dependency_repository_packages_sha256": $(jq -Rn --arg v "$DEPENDENCY_REPOSITORY_PACKAGES_SHA256" '$v'),
''',
              'build lock package identity',
          )
          produced = '''  "produced_binary_packages": $(printf '%s\\n' "${produced_packages[@]}" | jq -Rsc 'split("\\n")[:-1]')
'''
          replace_once(
              produced,
              '''  "produced_binary_packages": $(printf '%s\\n' "${produced_packages[@]}" | jq -Rsc 'split("\\n")[:-1] | unique | sort')
''',
              'produced package normalization',
          )

          path.write_text(text, encoding='utf-8')
          PY

          chmod +x arm64/scripts/build_locked_source_arm64_v2.sh
          bash -n arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'DEPENDENCY_REPOSITORY_PACKAGES_SHA256' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq 'architecture == "amd64"' \
            arm64/scripts/build_locked_source_arm64_v2.sh
          grep -Fq "*-build-deps*.deb" \
            arm64/scripts/build_locked_source_arm64_v2.sh

      - name: Commit the repaired self-contained v2 builder
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/build_locked_source_arm64_v2.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair self-contained exact Git ARM64 builder v2'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
