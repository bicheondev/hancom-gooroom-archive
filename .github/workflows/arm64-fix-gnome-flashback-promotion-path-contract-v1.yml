name: ARM64 fix gnome-flashback promotion path contract v1

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-gnome-flashback-promotion-path-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-fix-gnome-flashback-promotion-path-contract-v1
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out arm64-port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Replace the stale count assertion with the exact reconstruction path contract
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin arm64-port

          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/promote_gnome_flashback_han3u4.py')
          text = path.read_text(encoding='utf-8')

          packages = '''EXPECTED_PACKAGES = {
              "gnome-flashback": "arm64",
              "gnome-flashback-common": "all",
              "gnome-session-flashback": "all",
          }
          '''
          contract = packages + '''EXPECTED_UNIQUE_RECONSTRUCTION_PATHS = (
              "data/theme/common.css",
              "gnome-flashback/libdesktop/gf-icon-view.c",
              "gnome-flashback/libdesktop/gf-monitor-view.c",
              "gnome-flashback/libscreensaver/gf-panel-bottom.c",
              "gnome-flashback/libscreensaver/gf-unlock-dialog.c",
          )
          '''
          if text.count(packages) != 1:
              raise SystemExit(f'EXPECTED_PACKAGES anchor mismatch: {text.count(packages)}')
          text = text.replace(packages, contract)

          old_unique = '''    unique = require_dict(reconstruction.get("unique_reconstruction"), "unique reconstruction")
              if not isinstance(unique.get("changed_paths"), list) or len(unique["changed_paths"]) != 4:
                  raise SystemExit("bounded unique reconstruction path set mismatch")
          '''
          new_unique = '''    unique = require_dict(reconstruction.get("unique_reconstruction"), "unique reconstruction")
              unique_paths = unique.get("changed_paths")
              if (
                  not isinstance(unique_paths, list)
                  or tuple(unique_paths) != EXPECTED_UNIQUE_RECONSTRUCTION_PATHS
              ):
                  raise SystemExit(
                      "bounded unique reconstruction path set mismatch: "
                      f"expected={list(EXPECTED_UNIQUE_RECONSTRUCTION_PATHS)!r} "
                      f"actual={unique_paths!r}"
                  )
          '''
          if text.count(old_unique) != 1:
              raise SystemExit(f'unique reconstruction anchor mismatch: {text.count(old_unique)}')
          text = text.replace(old_unique, new_unique)

          old_detail = '''    reconstruction_detail = require_dict(reconstruction.get("reconstruction"), "reconstruction detail")
              tree_sha = str(reconstruction_detail.get("tree_sha", ""))
          '''
          new_detail = '''    reconstruction_detail = require_dict(reconstruction.get("reconstruction"), "reconstruction detail")
              reconstruction_paths = reconstruction_detail.get("changed_paths")
              if (
                  not isinstance(reconstruction_paths, list)
                  or tuple(reconstruction_paths) != EXPECTED_UNIQUE_RECONSTRUCTION_PATHS
              ):
                  raise SystemExit(
                      "reconstruction detail path set mismatch: "
                      f"expected={list(EXPECTED_UNIQUE_RECONSTRUCTION_PATHS)!r} "
                      f"actual={reconstruction_paths!r}"
                  )
              tree_sha = str(reconstruction_detail.get("tree_sha", ""))
          '''
          if text.count(old_detail) != 1:
              raise SystemExit(f'reconstruction detail anchor mismatch: {text.count(old_detail)}')
          text = text.replace(old_detail, new_detail)

          if 'len(unique["changed_paths"]) != 4' in text:
              raise SystemExit('stale four-path assertion survived')
          if text.count('EXPECTED_UNIQUE_RECONSTRUCTION_PATHS') != 7:
              raise SystemExit(
                  'unexpected path-contract reference count: '
                  f'{text.count("EXPECTED_UNIQUE_RECONSTRUCTION_PATHS")}'
              )

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile arm64/scripts/promote_gnome_flashback_han3u4.py
          git diff --check
          grep -Fq '"data/theme/common.css"' arm64/scripts/promote_gnome_flashback_han3u4.py
          grep -Fq 'reconstruction detail path set mismatch' arm64/scripts/promote_gnome_flashback_han3u4.py

          git rm .github/workflows/arm64-fix-gnome-flashback-promotion-path-contract-v1.yml
          git add arm64/scripts/promote_gnome_flashback_han3u4.py
          git diff --cached --check
          git commit -m 'Fix gnome-flashback promotion path contract'

      - name: Publish the corrected promotion contract
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            git fetch origin arm64-port
            if git rebase origin/arm64-port && git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
