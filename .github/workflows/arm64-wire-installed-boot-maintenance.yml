name: ARM64 port - wire installed-system validation after final ISO

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-wire-installed-boot-maintenance.yml'
      - 'arm64/scripts/wire_installed_boot_dispatch.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-wire-installed-boot
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the final ISO workflow and external patcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Append installed-system dispatch without interpolating secrets
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile arm64/scripts/wire_installed_boot_dispatch.py
          python3 arm64/scripts/wire_installed_boot_dispatch.py \
            --workflow .github/workflows/arm64-final-live-iso.yml
          git rm -f .github/workflows/arm64-wire-installed-boot-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-final-live-iso.yml \
            arm64/scripts/wire_installed_boot_dispatch.py
          git commit -m 'Dispatch installed ARM64 boot validation after final ISO'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Reaudit workflow safety
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-workflow-secret-audit.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
          gh workflow run arm64-active-pipeline-audit.yml \
            --repo '${{ github.repository }}' --ref arm64-port || true
