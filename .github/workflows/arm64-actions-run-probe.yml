name: ARM64 Actions run probe

'on':
  push:
    branches:
      - main
    paths:
      - 'arm64-control/actions-run-probe.trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-arm64-actions-run-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Query recent ARM64 workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          output=arm64-control/actions-run-probe/latest.json
          mkdir -p "$(dirname "$output")"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=arm64-port&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" "$output" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          data = json.loads(source.read_text(encoding='utf-8'))
          runs = data.get('workflow_runs') or []

          def compact(run):
              return {
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'display_title': run.get('display_title'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
                  'workflow_id': run.get('workflow_id'),
                  'path': run.get('path'),
              }

          target_name = 'ARM64 recover integration applet vendor source and debug v6'
          controller_name = 'ARM64 integration applet v6 recovery control'
          selected = [compact(run) for run in runs if run.get('name') == target_name]
          controllers = [compact(run) for run in runs if run.get('name') == controller_name]
          recent = [compact(run) for run in runs[:30]]
          document = {
              'schema': 'hancom-gooroom-arm64-actions-run-probe-v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'branch': 'arm64-port',
              'target_workflow_name': target_name,
              'target_runs': selected,
              'controller_runs': controllers,
              'recent_runs': recent,
              'total_count_from_api': data.get('total_count'),
          }
          destination.write_text(
              json.dumps(document, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          cat "$output"

      - name: Commit the run probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64-control/actions-run-probe/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record ARM64 Actions run probe'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
