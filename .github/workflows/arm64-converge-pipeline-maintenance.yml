name: ARM64 port - converge pending pipeline maintenance

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-converge-pipeline-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-converge-pipeline-maintenance
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install workflow parser
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-yaml

      - name: Apply only the verified pending maintenance changes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          def replace_all(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'{path}: replacement anchor absent: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          final_recovered = Path('.github/workflows/arm64-final-from-recovered-rootfs.yml')
          final_live = Path('.github/workflows/arm64-final-live-iso.yml')
          stage0 = Path('.github/workflows/arm64-stage0-v6.yml')
          recover_exact = Path('.github/workflows/arm64-recover-exact-package-pool.yml')
          recover_existing = Path('.github/workflows/arm64-recover-existing-iso.yml')
          stage0_repair = Path('.github/workflows/arm64-stage0-auto-repair.yml')

          replace_all(
              final_recovered,
              'arm64/scripts/finalize_arm64_live_rootfs.sh',
              'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
          )
          replace_all(
              final_recovered,
              'arm64/scripts/test_arm64_iso_qemu.sh',
              'arm64/scripts/test_arm64_iso_qemu_v2.sh',
          )
          replace_once(
              final_recovered,
              ".passed == true and .marker_found == true",
              ".passed == true and .boot_marker_found == true and .graphical_marker_found == true",
          )

          replace_all(
              final_live,
              'arm64/scripts/test_arm64_iso_qemu.sh',
              'arm64/scripts/test_arm64_iso_qemu_v2.sh',
          )
          replace_once(
              final_live,
              ".passed == true and .marker_found == true",
              ".passed == true and .boot_marker_found == true and .graphical_marker_found == true",
          )

          replace_once(
              stage0,
              'sha256sum --check "work/output/$OUTPUT_ISO_NAME.sha256"',
              '(cd work/output && sha256sum --check "$OUTPUT_ISO_NAME.sha256")',
          )
          replace_once(
              stage0,
              '-display none -monitor none',
              '-display vnc=127.0.0.1:9 -monitor none',
          )

          exact_text = recover_exact.read_text(encoding='utf-8')
          if 'gh api --paginate --slurp' in exact_text:
              raise SystemExit(
                  'exact package recovery must not combine gh --slurp with its existing jq -s page slurp'
              )
          if 'gh api --paginate \\\n' not in exact_text or "| jq -s '.'" not in exact_text:
              raise SystemExit('exact package recovery page-slurp contract is missing')

          replace_once(
              recover_existing,
              'gh api --paginate \\\n',
              'gh api --paginate --slurp \\\n',
          )
          replace_once(
              stage0_repair,
              'gh api --paginate \\\n',
              'gh api --paginate --slurp \\\n',
          )

          obsolete = [
              Path('.github/workflows/arm64-final-graphical-gate-maintenance.yml'),
              Path('.github/workflows/arm64-pagination-maintenance.yml'),
              Path('.github/workflows/arm64-stage0-v6-checksum-maintenance.yml'),
              Path('.github/workflows/arm64-stage0-v6-display-maintenance.yml'),
              Path('.github/workflows/arm64-converge-pipeline-maintenance.yml'),
          ]
          for path in obsolete:
              if path.exists():
                  path.unlink()

          remaining = sorted(
              str(path)
              for path in Path('.github/workflows').glob('*maintenance*.yml')
          )
          if remaining:
              raise SystemExit(f'one-shot maintenance workflows remain: {remaining}')

          for path in Path('.github/workflows').glob('*.yml'):
              document = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(document, dict) or not isinstance(document.get('jobs'), dict):
                  raise SystemExit(f'invalid workflow mapping/jobs: {path}')

          assertions = {
              final_recovered: [
                  'arm64/scripts/finalize_arm64_live_rootfs_v2.sh',
                  'arm64/scripts/test_arm64_iso_qemu_v2.sh',
                  '.boot_marker_found == true',
                  '.graphical_marker_found == true',
              ],
              final_live: [
                  'arm64/scripts/test_arm64_iso_qemu_v2.sh',
                  '.boot_marker_found == true',
                  '.graphical_marker_found == true',
              ],
              stage0: [
                  '(cd work/output && sha256sum --check "$OUTPUT_ISO_NAME.sha256")',
                  '-display vnc=127.0.0.1:9 -monitor none',
              ],
              recover_existing: ['gh api --paginate --slurp'],
              stage0_repair: ['gh api --paginate --slurp'],
          }
          for path, needles in assertions.items():
              text = path.read_text(encoding='utf-8')
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f'{path}: postcondition missing: {missing}')

          for path in (final_recovered, final_live):
              text = path.read_text(encoding='utf-8')
              if 'arm64/scripts/finalize_arm64_live_rootfs.sh' in text:
                  raise SystemExit(f'{path}: superseded finalizer reference remains')
              if 'arm64/scripts/test_arm64_iso_qemu.sh' in text:
                  raise SystemExit(f'{path}: superseded QEMU gate reference remains')
          PY

          bash -n arm64/scripts/finalize_arm64_live_rootfs_v2.sh
          bash -n arm64/scripts/test_arm64_iso_qemu_v2.sh
          git diff --check

      - name: Commit the converged active pipeline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'Converge pending ARM64 pipeline maintenance'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
