name: ARM64 port - build exact package acquisition plan

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-package-acquisition-plan.yml'
      - 'arm64/scripts/build_package_acquisition_plan.py'
      - 'arm64/locks/package-plan/**'
      - 'arm64/locks/vendor-binaries/**'
      - 'arm64/locks/rebuild-results/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-package-acquisition-plan
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out normalized mapping and binary evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Build one exact acquisition route per reference package
        id: plan
        shell: bash
        run: |
          set -uxo pipefail
          rm -rf work/acquisition-plan
          mkdir -p work/acquisition-plan

          normalized=arm64/locks/package-plan/debian-arm64-map-normalized.json
          vendor=arm64/locks/vendor-binaries/vendor-binary-lock.json
          if [ ! -f "$normalized" ] || [ ! -f "$vendor" ]; then
            jq -n \
              --arg normalized "$normalized" \
              --arg vendor "$vendor" \
              --argjson normalized_exists "$(test -f "$normalized" && echo true || echo false)" \
              --argjson vendor_exists "$(test -f "$vendor" && echo true || echo false)" \
              '{
                schema: 1,
                policy: "one-exact-acquisition-route-per-reference-package",
                ready_for_fetch: false,
                blocker_count: 1,
                prerequisite_files: {
                  normalized_map: {path: $normalized, exists: $normalized_exists},
                  vendor_binary_lock: {path: $vendor, exists: $vendor_exists}
                }
              }' > work/acquisition-plan/summary.json
            jq -n \
              --arg normalized "$normalized" \
              --arg vendor "$vendor" \
              '[{reason:"prerequisite-lock-missing", normalized_map:$normalized, vendor_binary_lock:$vendor}]' \
              > work/acquisition-plan/blockers.json
            jq -n \
              --slurpfile summary work/acquisition-plan/summary.json \
              --slurpfile blockers work/acquisition-plan/blockers.json \
              '{summary:$summary[0],packages:[],blockers:$blockers[0]}' \
              > work/acquisition-plan/package-acquisition-plan.json
            rc=2
          else
            set +e
            python3 arm64/scripts/build_package_acquisition_plan.py \
              --normalized-map "$normalized" \
              --vendor-binary-lock "$vendor" \
              --rebuild-results arm64/locks/rebuild-results \
              --output-dir work/acquisition-plan
            rc=$?
            set -e
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/acquisition-plan -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/acquisition-plan/LOCKSUMS.sha256
          cat work/acquisition-plan/summary.json

      - name: Upload acquisition plan and blockers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-arm64-package-acquisition-plan
          path: work/acquisition-plan
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit exact acquisition readiness
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/acquisition-plan
          mkdir -p arm64/locks/acquisition-plan
          cp -a work/acquisition-plan/. arm64/locks/acquisition-plan/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/acquisition-plan
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update exact ARM64 package acquisition plan'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce complete exact acquisition coverage
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.plan.outputs.exit_code }}' = '0'
          jq -e '.ready_for_fetch == true' work/acquisition-plan/summary.json
