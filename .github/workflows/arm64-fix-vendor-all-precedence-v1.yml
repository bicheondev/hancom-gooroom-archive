name: ARM64 fix - prefer exact ISO Architecture all packages

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-vendor-all-precedence-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-fix-vendor-all-precedence-v1
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the active ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Apply and validate vendor Architecture all precedence
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin arm64-port
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arm64/scripts/apply_vendor_all_precedence_fix_v1.py')
          text = path.read_text(encoding='utf-8')
          old = '    ambiguous = {\n        key: sorted(identities)\n        for key, identities in vendor_identities.items()\n        if len(identities) != 1\n    }\n'
          new = '    ambiguous = [\n        {\n            "package": key[0],\n            "version": key[1],\n            "architecture": key[2],\n            "identities": sorted(identities),\n        }\n        for key, identities in vendor_identities.items()\n        if len(identities) != 1\n    ]\n'
          if text.count(old) != 1:
              raise SystemExit('ambiguity evidence repair anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile arm64/scripts/apply_vendor_all_precedence_fix_v1.py
          python3 arm64/scripts/apply_vendor_all_precedence_fix_v1.py
          python3 -m py_compile \
            arm64/scripts/materialize_build_dependency_repo_v2.py \
            arm64/scripts/test_materialize_build_dependency_repo_v2.py
          python3 arm64/scripts/test_materialize_build_dependency_repo_v2.py
          git diff --check

          git rm -f \
            .github/workflows/arm64-fix-vendor-all-precedence-v1.yml \
            arm64/scripts/apply_vendor_all_precedence_fix_v1.py
          git add \
            arm64/scripts/materialize_build_dependency_repo_v2.py \
            arm64/scripts/test_materialize_build_dependency_repo_v2.py \
            .github/workflows/arm64-build-dependency-repository-v2.yml
          git diff --cached --check
          git commit -m 'Prefer exact ISO Architecture all packages'

      - name: Publish the validated fix
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            git fetch origin arm64-port
            if git rebase origin/arm64-port && git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
