name: ARM64 port - propagate ARM64 target package identity

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-target-package-identity.yml'
      - 'arm64/scripts/repair_target_package_identity_pipeline.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-target-package-identity
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out normalization, planner, and materializer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Propagate reference and ARM64 target identities separately
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_target_package_identity_pipeline.py \
            --normalizer arm64/scripts/normalize_debian_arm64_map.py \
            --planner arm64/scripts/build_package_acquisition_plan_v2.py \
            --materializer arm64/scripts/materialize_package_acquisition_plan.py
          python3 -m py_compile \
            arm64/scripts/repair_target_package_identity_pipeline.py \
            arm64/scripts/normalize_debian_arm64_map.py \
            arm64/scripts/build_package_acquisition_plan_v2.py \
            arm64/scripts/materialize_package_acquisition_plan.py
          grep -Fq '"target_version": target_version' \
            arm64/scripts/normalize_debian_arm64_map.py
          grep -Fq 'target_version = row.get("target_version")' \
            arm64/scripts/build_package_acquisition_plan_v2.py
          grep -Fq 'expected_version = task.get("target_version")' \
            arm64/scripts/materialize_package_acquisition_plan.py

      - name: Commit the exact target identity pipeline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            arm64/scripts/normalize_debian_arm64_map.py \
            arm64/scripts/build_package_acquisition_plan_v2.py \
            arm64/scripts/materialize_package_acquisition_plan.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Propagate exact ARM64 target package identities'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
