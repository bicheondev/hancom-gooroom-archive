name: ARM64 port - record package wave 2 v1 evidence

on:
  workflow_run:
    workflows: ['ARM64 port - build exact package wave 2 v1']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing wave 2 v1 workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-arm64-wave2-v1-record
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'arm64-port'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download selection and all package artifacts
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euxo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$INPUT_RUN_ID"
          fi
          test -n "$run_id"
          rm -rf work/wave2-v1-artifacts
          mkdir -p work/wave2-v1-artifacts
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,conclusion,status,headBranch,headSha,createdAt,updatedAt,url \
            > work/wave2-v1-run.json
          set +e
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --dir work/wave2-v1-artifacts
          download_rc=$?
          set -e
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "download_rc=$download_rc" >> "$GITHUB_OUTPUT"

      - name: Produce complete wave evidence
        env:
          DOWNLOAD_RC: ${{ steps.metadata.outputs.download_rc }}
        run: |
          set -euxo pipefail
          rm -rf arm64/locks/build-wave2-v1
          mkdir -p arm64/locks/build-wave2-v1
          cp work/wave2-v1-run.json arm64/locks/build-wave2-v1/workflow-run.json
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          root = Path('work/wave2-v1-artifacts')
          destination = Path('arm64/locks/build-wave2-v1')
          run = json.loads(Path('work/wave2-v1-run.json').read_text(encoding='utf-8'))
          selection_paths = sorted(root.rglob('selection.json'))
          selection = (
              json.loads(selection_paths[0].read_text(encoding='utf-8'))
              if selection_paths
              else None
          )
          expected_sources = (
              [item['source'] for item in selection.get('selected', [])]
              if selection
              else []
          )
          packages = []
          seen = set()
          for path in sorted(root.rglob('arm64-source-output-validation-v3.json')):
              value = json.loads(path.read_text(encoding='utf-8'))
              source = value.get('source') or path.parent.name
              seen.add(source)
              packages.append({
                  'source': source,
                  'source_version': value.get('source_version'),
                  'status': value.get('status'),
                  'artifact_directory': str(path.parent.relative_to(root)),
                  'required_native_packages': value.get('required_native_packages', []),
                  'exact_reuse_architecture_all_packages': value.get(
                      'exact_reuse_architecture_all_packages', []
                  ),
                  'legacy_builder_missing_packages': value.get(
                      'legacy_builder_missing_packages', []
                  ),
                  'built_packages': value.get('built_packages', []),
                  'issues': value.get('issues', []),
              })
          unvalidated = []
          for log in sorted(root.rglob('legacy-run.log')):
              source = re.sub(
                  r'-arm64-wave2-v1$', '', log.parent.name
              )
              if source in seen:
                  continue
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              exit_path = log.parent / 'legacy-run.exit-code'
              unvalidated.append({
                  'source': source,
                  'artifact_directory': str(log.parent.relative_to(root)),
                  'legacy_exit_code': (
                      exit_path.read_text(encoding='utf-8').strip()
                      if exit_path.is_file()
                      else None
                  ),
                  'log_tail': lines[-120:],
              })
          recorded = sorted(
              {item['source'] for item in packages}
              | {item['source'] for item in unvalidated}
          )
          missing = sorted(set(expected_sources) - set(recorded))
          failed = sorted(
              {item['source'] for item in packages if item['status'] != 'passed'}
              | {item['source'] for item in unvalidated}
          )
          status = 'passed'
          if (
              run.get('conclusion') != 'success'
              or not selection
              or int(os.environ['DOWNLOAD_RC']) != 0
              or missing
              or failed
          ):
              status = 'failed'
          result = {
              'schema': 'hancom-gooroom-arm64-build-wave2-v1-evidence',
              'generated_at': datetime.now(timezone.utc).isoformat().replace(
                  '+00:00', 'Z'
              ),
              'status': status,
              'workflow_run': run,
              'artifact_download_exit_code': int(os.environ['DOWNLOAD_RC']),
              'selection': selection,
              'expected_sources': expected_sources,
              'recorded_sources': recorded,
              'missing_sources': missing,
              'failed_sources': failed,
              'packages': sorted(packages, key=lambda item: item['source']),
              'unvalidated_failures': unvalidated,
          }
          (destination / 'wave2-v1-summary.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          if selection_paths:
              (destination / 'selection.json').write_bytes(
                  selection_paths[0].read_bytes()
              )
          with (destination / 'wave2-v1-packages.tsv').open(
              'w', encoding='utf-8'
          ) as stream:
              stream.write(
                  'source\tsource_version\tvalidation_status\tpackage\tversion\tarchitecture\tfilename\n'
              )
              for item in sorted(packages, key=lambda row: row['source']):
                  for package in item['built_packages']:
                      stream.write(
                          '\t'.join([
                              str(item['source']),
                              str(item.get('source_version') or ''),
                              str(item.get('status') or ''),
                              str(package.get('package') or ''),
                              str(package.get('version') or ''),
                              str(package.get('architecture') or ''),
                              str(package.get('filename') or ''),
                          ]) + '\n'
                      )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
          find arm64/locks/build-wave2-v1 -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > arm64/locks/build-wave2-v1/LOCKSUMS.sha256

      - name: Commit evidence before enforcing the wave
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/build-wave2-v1
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact ARM64 package wave 2 v1 evidence'
            git pull --rebase origin arm64-port
            git push origin HEAD:arm64-port
          fi

      - name: Enforce a complete passing wave
        run: |
          set -euxo pipefail
          test "$(jq -r '.status' arm64/locks/build-wave2-v1/wave2-v1-summary.json)" = passed
