name: ARM64 port - lock non-vendor Architecture all assets

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-debian-all-asset-mapping.yml'
      - 'arm64/scripts/repair_debian_all_asset_mapping.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-debian-all-assets
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact Debian asset mapper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Lock non-vendor Architecture all package assets
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_debian_all_asset_mapping.py \
            --target arm64/scripts/map_debian_arm64.py
          python3 -m py_compile \
            arm64/scripts/repair_debian_all_asset_mapping.py \
            arm64/scripts/map_debian_arm64.py
          grep -Fq 'missing-exact-all' arm64/scripts/map_debian_arm64.py
          grep -Fq 'exact Architecture: all binary, source version, URL' \
            arm64/scripts/map_debian_arm64.py

      - name: Commit exact Architecture all asset mapping
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/map_debian_arm64.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Lock exact Debian Architecture all package assets'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
