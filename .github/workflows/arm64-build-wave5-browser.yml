name: ARM64 port - build exact Gooroom browser

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-build-wave5-browser.yml'
      - 'arm64/scripts/build_locked_source_arm64.sh'
      - 'arm64/scripts/run_locked_source_arm64.sh'
      - 'arm64/scripts/prepare_composite_source_chroot.sh'
      - 'arm64/scripts/verify_locked_arm64_build.sh'
      - 'arm64/locks/source-components/**'
      - 'arm64/locks/effective-sources/**'
      - 'arm64/locks/reference/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hancom-gooroom-33-arm64-build-browser
  cancel-in-progress: true

jobs:
  browser:
    name: gooroom-browser
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out exact locks and builders
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Verify native ARM64 host, Docker, and available storage
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'This job must run on native ARM64.' >&2; exit 1 ;;
          esac
          docker version
          docker info --format 'architecture={{.Architecture}} os={{.OSType}}'
          df -h
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git jq dpkg-dev ca-certificates file python3

      - name: Build exact locked Gooroom browser source for ARM64
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z
          HANCOM_GOOROOM_REFERENCE_JSON: ${{ github.workspace }}/arm64/locks/reference/amd64-reference.json
          HANCOM_GOOROOM_SOURCE_COMPONENT_LOCK_DIR: ${{ github.workspace }}/arm64/locks/source-components
          SOURCE_NAME: gooroom-browser
        run: |
          set -euxo pipefail
          chmod +x \
            arm64/scripts/build_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64.sh \
            arm64/scripts/prepare_composite_source_chroot.sh \
            arm64/scripts/verify_locked_arm64_build.sh
          rm -rf work/gooroom-browser-arm64
          arm64/scripts/run_locked_source_arm64.sh \
            arm64/locks/effective-sources/effective-source-lock.json \
            gooroom-browser \
            work/gooroom-browser-arm64

      - name: Verify browser source, version, architecture, and payload machine types
        env:
          HANCOM_GOOROOM_REFERENCE_JSON: ${{ github.workspace }}/arm64/locks/reference/amd64-reference.json
          HANCOM_GOOROOM_SOURCE_COMPONENT_LOCK_DIR: ${{ github.workspace }}/arm64/locks/source-components
        run: |
          set -euxo pipefail
          arm64/scripts/verify_locked_arm64_build.sh \
            arm64/locks/effective-sources/effective-source-lock.json \
            gooroom-browser \
            work/gooroom-browser-arm64

      - name: Upload exact browser DEBs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-browser-exact-arm64-wave5
          path: work/gooroom-browser-arm64
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
