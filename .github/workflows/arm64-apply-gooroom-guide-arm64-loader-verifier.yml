name: ARM64 port - apply strict gooroom-guide ARM64 loader verification

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-apply-gooroom-guide-arm64-loader-verifier.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hancom-gooroom-33-apply-guide-arm64-loader-verifier
  cancel-in-progress: false

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the latest ARM64 evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Apply and audit the fail-closed verifier change
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/patch_gooroom_guide_arm64_loader_verifier.py
          python3 -m py_compile arm64/scripts/verify_gooroom_guide_arm64.py
          git diff --check
          grep -Fq 'loader_needed_verified' arm64/scripts/verify_gooroom_guide_arm64.py
          grep -Fq 'needed_identical' arm64/scripts/verify_gooroom_guide_arm64.py
          grep -Fq 'loader_needed == [AARCH64_LOADER]' arm64/scripts/verify_gooroom_guide_arm64.py

      - name: Commit only the permanent verifier and self-remove
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/verify_gooroom_guide_arm64.py
          git rm arm64/scripts/patch_gooroom_guide_arm64_loader_verifier.py
          git rm .github/workflows/arm64-apply-gooroom-guide-arm64-loader-verifier.yml
          git diff --cached --check
          git commit -m 'Verify the AArch64 loader separately from runtime libraries'
          pushed=false
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              pushed=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" = true

      - name: Dispatch the permanent strict reconstruction pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run arm64-reconstruct-build-promote-gooroom-guide-han3u1.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref arm64-port; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
