name: ARM64 snapshot integration reconstruction v2 once

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-snapshot-integration-reconstruction-v2-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: arm64-snapshot-integration-reconstruction-v2-once
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out active branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Collect workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow arm64-analyze-integration-applet-han3u3-reconstruction-v2.yml \
            --branch arm64-port \
            --limit 20 \
            --json databaseId,number,status,conclusion,createdAt,updatedAt,url,headSha,event,displayTitle \
            > work/runs.json
          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow 'arm64-analyze-integration-applet-han3u3-reconstruction-v2.yml' \
            --slurpfile runs work/runs.json \
            '{schema:1,generated_at:$generated_at,workflow:$workflow,runs:$runs[0]}' \
            > work/snapshot.json

      - name: Commit snapshot race-safely
        shell: bash
        run: |
          set -euo pipefail
          destination=arm64/status/integration-reconstruction-v2-runs/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin arm64-port
            git reset --hard origin/arm64-port
            mkdir -p "$(dirname "$destination")"
            cp work/snapshot.json "$destination"
            git add "$destination"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record integration reconstruction v2 run queue"
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
