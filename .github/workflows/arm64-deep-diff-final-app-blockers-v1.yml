name: ARM64 port - deep diff final application blockers v1

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-deep-diff-final-app-blockers-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-final-app-deep-diff-v1
  cancel-in-progress: true

env:
  SNAPSHOT: 20230730T235959Z

jobs:
  compare:
    name: Compare ${{ matrix.package }} with its exact AMD64 authority
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gooroom-integration-applet
            version: 0.3.1+grm3u1+han3u3
            repository: gooroom/gooroom-integration-applet
            base_commit: 0f7897ad068da63c6529c5725afdf569152ca4c7
            base_tree: 5f24f24a3421835e18ab7ab894ce0dc78bbda2c9
            target_url: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-integration-applet/gooroom-integration-applet_0.3.1+grm3u1+han3u3_amd64.deb
            debug_url: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-integration-applet/gooroom-integration-applet-dbgsym_0.3.1+grm3u1+han3u3_amd64.deb
          - package: gooroom-session-manager
            version: 0.3.9+grm3u1+han3u2
            repository: gooroom/gooroom-session-manager
            base_commit: d70dfbd27ea62e7a71f51c0018eb48cfe6fa0794
            base_tree: e8fb3bd1279ae7cd0a3526ae4f4c7b375835e1d5
            target_url: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-session-manager/gooroom-session-manager_0.3.9+grm3u1+han3u2_amd64.deb
            debug_url: https://update.hancomgooroom.com/hancom/pool/main/g/gooroom-session-manager/gooroom-session-manager-dbgsym_0.3.9+grm3u1+han3u2_amd64.deb
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      REPOSITORY: ${{ matrix.repository }}
      BASE_COMMIT: ${{ matrix.base_commit }}
      BASE_TREE: ${{ matrix.base_tree }}
      TARGET_URL: ${{ matrix.target_url }}
      DEBUG_URL: ${{ matrix.debug_url }}
    steps:
      - name: Check out exact comparison implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install historical-build and binary-analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates curl debootstrap debian-archive-keyring \
            diffutils dpkg-dev elfutils file git gzip jq libglib2.0-bin python3 \
            tar xz-utils zstd

      - name: Reconstruct the exact target-version source candidate
        shell: bash
        run: |
          set -euxo pipefail
          base="work/$PACKAGE"
          rm -rf "$base"
          mkdir -p "$base"/{source-authority,downloads,comparison,artifact}
          git clone --filter=blob:none --no-checkout \
            "https://github.com/$REPOSITORY.git" "$base/source"
          git -C "$base/source" fetch --depth=1 origin "$BASE_COMMIT"
          git -C "$base/source" checkout --detach "$BASE_COMMIT"
          test "$(git -C "$base/source" rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git -C "$base/source" rev-parse HEAD^{tree})" = "$BASE_TREE"
          test -z "$(git -C "$base/source" status --porcelain=v1)"

          prefix="arm64/locks/final-three-blockers-inspection-v1/$PACKAGE/vendor-changelog-prefix"
          test -s "$prefix"
          cat "$prefix" "$base/source/debian/changelog" \
            > "$base/source/debian/changelog.reconstructed"
          mv "$base/source/debian/changelog.reconstructed" \
            "$base/source/debian/changelog"
          test "$(dpkg-parsechangelog -l"$base/source/debian/changelog" -SVersion)" = "$VERSION"
          git -C "$base/source" diff --binary --full-index --no-ext-diff \
            > "$base/source-authority/version-only.patch"
          git -C "$base/source" add debian/changelog
          tree="$(git -C "$base/source" write-tree)"
          git -C "$base/source" archive --format=tar "$tree" \
            > "$base/source-authority/reconstructed-source.tar"
          tar -tf "$base/source-authority/reconstructed-source.tar" \
            | LC_ALL=C sort > "$base/source-authority/source-paths.txt"
          jq -n \
            --arg source "$PACKAGE" --arg version "$VERSION" \
            --arg repository "$REPOSITORY" --arg base_commit "$BASE_COMMIT" \
            --arg base_tree "$BASE_TREE" --arg reconstructed_tree "$tree" \
            --arg archive_sha256 "$(sha256sum "$base/source-authority/reconstructed-source.tar" | awk '{print $1}')" \
            --arg prefix_sha256 "$(sha256sum "$prefix" | awk '{print $1}')" '
              {schema:1,source:$source,version:$version,repository:$repository,
               base_commit_sha:$base_commit,base_tree_sha:$base_tree,
               reconstruction_policy:"exact-vendor-changelog-prefix-plus-public-base-no-code-delta",
               reconstructed_tree_sha:$reconstructed_tree,
               source_archive_sha256:$archive_sha256,
               vendor_changelog_prefix_sha256:$prefix_sha256}
            ' > "$base/source-authority/source-lock.json"
          cp -a "$base/source/." "$base/artifact/public-base-source-with-vendor-changelog"
          rm -rf "$base/artifact/public-base-source-with-vendor-changelog/.git"

      - name: Download exact target and optional debug symbols
        shell: bash
        run: |
          set -euxo pipefail
          base="work/$PACKAGE"
          target="$base/downloads/target.deb"
          curl --fail --show-error --location --retry 8 --retry-delay 3 \
            --retry-all-errors "$TARGET_URL" -o "$target"
          test "$(dpkg-deb -f "$target" Package)" = "$PACKAGE"
          test "$(dpkg-deb -f "$target" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$target" Architecture)" = amd64
          sha256sum "$target" > "$base/downloads/target.sha256"
          stat -c '%n\t%s' "$target" > "$base/downloads/target.stat.tsv"

          set +e
          curl --fail --show-error --location --retry 5 --retry-delay 3 \
            --retry-all-errors "$DEBUG_URL" -o "$base/downloads/target-dbgsym.deb"
          debug_rc=$?
          set -e
          if [ "$debug_rc" -eq 0 ]; then
            test "$(dpkg-deb -f "$base/downloads/target-dbgsym.deb" Version)" = "$VERSION"
            test "$(dpkg-deb -f "$base/downloads/target-dbgsym.deb" Architecture)" = amd64
            sha256sum "$base/downloads/target-dbgsym.deb" \
              > "$base/downloads/target-dbgsym.sha256"
            printf 'true\n' > "$base/downloads/target-dbgsym-available.txt"
          else
            rm -f "$base/downloads/target-dbgsym.deb"
            printf 'false\n' > "$base/downloads/target-dbgsym-available.txt"
          fi

      - name: Build the version-only candidate in a clean Bullseye AMD64 rootfs
        shell: bash
        run: |
          set -euxo pipefail
          base="$(pwd)/work/$PACKAGE"
          rootfs="$base/build/rootfs"
          output="$base/build/debs"
          rm -rf "$base/build"
          mkdir -p "$output"
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=ca-certificates \
            --no-check-gpg \
            bullseye \
            "$rootfs" \
            "https://snapshot.debian.org/archive/debian/$SNAPSHOT/" \
            2>&1 | tee "$base/build/debootstrap.log"
          sudo tee "$rootfs/etc/apt/sources.list" >/dev/null <<EOF
deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/$SNAPSHOT bullseye main
EOF
          sudo tee "$rootfs/etc/apt/apt.conf.d/99snapshot" >/dev/null <<'EOF'
Acquire::Check-Valid-Until "false";
Acquire::Retries "5";
Dpkg::Use-Pty "0";
EOF
          sudo mkdir -p "$rootfs/build/source"
          sudo tar -xf "$base/source-authority/reconstructed-source.tar" \
            -C "$rootfs/build/source"
          sudo chown -R root:root "$rootfs/build/source"
          set +e
          sudo chroot "$rootfs" /bin/bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            export DEB_BUILD_OPTIONS=nocheck
            export LC_ALL=C.UTF-8
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential devscripts dpkg-dev equivs git
            cd /build/source
            mk-build-deps --install --remove \
              --tool "apt-get -y --no-install-recommends" debian/control
            dpkg-buildpackage -us -uc -b -j2
          ' 2>&1 | tee "$base/build/build.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          test "$build_rc" -eq 0
          while IFS= read -r deb; do
            sudo cp "$deb" "$output/"
          done < <(sudo find "$rootfs/build" -maxdepth 1 -type f -name '*.deb' | LC_ALL=C sort)
          sudo chown -R "$(id -u):$(id -g)" "$base/build"
          main=''
          debug=''
          for deb in "$output"/*.deb; do
            case "$(dpkg-deb -f "$deb" Package)" in
              "$PACKAGE") main="$deb" ;;
              "$PACKAGE-dbgsym") debug="$deb" ;;
            esac
          done
          test -n "$main"
          test "$(dpkg-deb -f "$main" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$main" Architecture)" = amd64
          cp "$main" "$base/downloads/candidate.deb"
          if [ -n "$debug" ]; then
            cp "$debug" "$base/downloads/candidate-dbgsym.deb"
          fi
          rm -rf "$rootfs"

      - name: Extract payloads, GResources, and debug information
        shell: bash
        run: |
          set -euxo pipefail
          base="work/$PACKAGE"
          for side in target candidate; do
            mkdir -p "$base/comparison/$side"/{root,control,resources,elf}
            dpkg-deb -x "$base/downloads/$side.deb" "$base/comparison/$side/root"
            dpkg-deb -e "$base/downloads/$side.deb" "$base/comparison/$side/control"
            dpkg-deb -f "$base/downloads/$side.deb" \
              > "$base/comparison/$side/control-fields.txt"
            dpkg-deb -c "$base/downloads/$side.deb" \
              > "$base/comparison/$side/data-list.txt"
            if [ -f "$base/downloads/$side-dbgsym.deb" ]; then
              mkdir -p "$base/comparison/$side/debug-root"
              dpkg-deb -x "$base/downloads/$side-dbgsym.deb" \
                "$base/comparison/$side/debug-root"
            fi
            find "$base/comparison/$side/root" -type f -print0 \
              | while IFS= read -r -d '' file_path; do
                  relative="${file_path#"$base/comparison/$side/root/"}"
                  if ! file -b "$file_path" | grep -q '^ELF '; then
                    continue
                  fi
                  safe="${relative//\//__}"
                  mkdir -p "$base/comparison/$side/elf/$safe"
                  file -b "$file_path" > "$base/comparison/$side/elf/$safe/file.txt"
                  readelf -h -l -d -s -r -n --wide "$file_path" \
                    > "$base/comparison/$side/elf/$safe/readelf.txt" 2>&1 || true
                  objdump -drwC "$file_path" \
                    > "$base/comparison/$side/elf/$safe/objdump.txt" 2>&1 || true
                  strings -a -n 4 "$file_path" \
                    > "$base/comparison/$side/elf/$safe/strings.txt"
                  if gresource list "$file_path" \
                    > "$base/comparison/$side/elf/$safe/gresource-list.txt" 2>/dev/null; then
                    while IFS= read -r resource; do
                      [ -n "$resource" ] || continue
                      destination="$base/comparison/$side/resources/${resource#/}"
                      mkdir -p "$(dirname "$destination")"
                      gresource extract "$file_path" "$resource" > "$destination"
                    done < "$base/comparison/$side/elf/$safe/gresource-list.txt"
                  else
                    rm -f "$base/comparison/$side/elf/$safe/gresource-list.txt"
                  fi

                  build_id="$(readelf -n "$file_path" 2>/dev/null | awk '/Build ID:/{print $3; exit}')"
                  if [ -n "$build_id" ] && [ -d "$base/comparison/$side/debug-root" ]; then
                    debug_file="$base/comparison/$side/debug-root/usr/lib/debug/.build-id/${build_id:0:2}/${build_id:2}.debug"
                    if [ -f "$debug_file" ]; then
                      eu-unstrip -o "$base/comparison/$side/elf/$safe/unstripped" \
                        "$file_path" "$debug_file"
                      nm -anC "$base/comparison/$side/elf/$safe/unstripped" \
                        > "$base/comparison/$side/elf/$safe/nm.txt" 2>&1 || true
                      readelf --debug-dump=decodedline --wide \
                        "$base/comparison/$side/elf/$safe/unstripped" \
                        > "$base/comparison/$side/elf/$safe/decodedline.txt" 2>&1 || true
                      readelf --debug-dump=info --wide \
                        "$base/comparison/$side/elf/$safe/unstripped" \
                        > "$base/comparison/$side/elf/$safe/debuginfo.txt" 2>&1 || true
                    fi
                  fi
                done
          done

      - name: Produce exact payload and binary-difference summary
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          package = os.environ['PACKAGE']
          version = os.environ['VERSION']
          base = Path('work') / package
          comparison = base / 'comparison'

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          def is_elf(path: Path) -> bool:
              try:
                  return path.read_bytes()[:4] == b'\x7fELF'
              except OSError:
                  return False

          def inventory(root: Path) -> dict[str, Path]:
              result = {}
              for path in root.rglob('*'):
                  if path.is_file() or path.is_symlink():
                      result[path.relative_to(root).as_posix()] = path
              return result

          target = inventory(comparison / 'target' / 'root')
          candidate = inventory(comparison / 'candidate' / 'root')
          all_paths = sorted(set(target) | set(candidate))
          rows = []
          for relative in all_paths:
              left = target.get(relative)
              right = candidate.get(relative)
              if left is None:
                  rows.append({'path': relative, 'status': 'candidate-only'})
                  continue
              if right is None:
                  rows.append({'path': relative, 'status': 'target-only'})
                  continue
              if left.is_symlink() or right.is_symlink():
                  left_link = os.readlink(left) if left.is_symlink() else None
                  right_link = os.readlink(right) if right.is_symlink() else None
                  rows.append({
                      'path': relative,
                      'status': 'identical' if left_link == right_link else 'different',
                      'kind': 'symlink',
                      'target_link': left_link,
                      'candidate_link': right_link,
                  })
                  continue
              left_sha = sha256(left)
              right_sha = sha256(right)
              rows.append({
                  'path': relative,
                  'status': 'identical' if left_sha == right_sha else 'different',
                  'kind': 'elf' if is_elf(left) or is_elf(right) else 'non-elf',
                  'target_size': left.stat().st_size,
                  'candidate_size': right.stat().st_size,
                  'target_sha256': left_sha,
                  'candidate_sha256': right_sha,
              })

          resource_target = inventory(comparison / 'target' / 'resources')
          resource_candidate = inventory(comparison / 'candidate' / 'resources')
          resource_rows = []
          for relative in sorted(set(resource_target) | set(resource_candidate)):
              left = resource_target.get(relative)
              right = resource_candidate.get(relative)
              if left is None:
                  resource_rows.append({'path': relative, 'status': 'candidate-only'})
              elif right is None:
                  resource_rows.append({'path': relative, 'status': 'target-only'})
              else:
                  left_sha = sha256(left)
                  right_sha = sha256(right)
                  resource_rows.append({
                      'path': relative,
                      'status': 'identical' if left_sha == right_sha else 'different',
                      'target_size': left.stat().st_size,
                      'candidate_size': right.stat().st_size,
                      'target_sha256': left_sha,
                      'candidate_sha256': right_sha,
                  })

          result = {
              'schema': 1,
              'package': package,
              'version': version,
              'target_deb_sha256': sha256(base / 'downloads' / 'target.deb'),
              'candidate_deb_sha256': sha256(base / 'downloads' / 'candidate.deb'),
              'target_debug_symbols_available': (base / 'downloads' / 'target-dbgsym.deb').is_file(),
              'candidate_debug_symbols_available': (base / 'downloads' / 'candidate-dbgsym.deb').is_file(),
              'path_set_identical': set(target) == set(candidate),
              'payload': rows,
              'resource_path_set_identical': set(resource_target) == set(resource_candidate),
              'resources': resource_rows,
              'different_non_elf_paths': [r['path'] for r in rows if r.get('status') == 'different' and r.get('kind') == 'non-elf'],
              'different_elf_paths': [r['path'] for r in rows if r.get('status') == 'different' and r.get('kind') == 'elf'],
              'different_resource_paths': [r['path'] for r in resource_rows if r.get('status') == 'different'],
              'target_only_paths': [r['path'] for r in rows if r.get('status') == 'target-only'],
              'candidate_only_paths': [r['path'] for r in rows if r.get('status') == 'candidate-only'],
              'identical_payload_count': sum(r.get('status') == 'identical' for r in rows),
              'different_payload_count': sum(r.get('status') == 'different' for r in rows),
          }
          output = base / 'comparison' / 'summary.json'
          output.write_text(json.dumps(result, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8')
          (base / 'comparison' / 'payload-comparison.json').write_text(
              json.dumps(rows, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          (base / 'comparison' / 'resource-comparison.json').write_text(
              json.dumps(resource_rows, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY
          jq '.' "work/$PACKAGE/comparison/summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Seal and upload deep-diff evidence
        shell: bash
        run: |
          set -euxo pipefail
          base="work/$PACKAGE"
          artifact="$base/artifact"
          cp -a "$base/source-authority" "$artifact/"
          cp -a "$base/downloads" "$artifact/"
          cp -a "$base/comparison" "$artifact/"
          cp "$base/build/build.log" "$artifact/"
          cp "$base/build/debootstrap.log" "$artifact/"
          find "$artifact" -type f -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$artifact/FILE-INVENTORY.tsv"
          (
            cd "$artifact"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Upload ${{ matrix.package }} deep diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-app-deep-diff-${{ matrix.package }}-v1
          path: work/${{ matrix.package }}/artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

  consolidate:
    name: Lock compact final-application difference authority
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current ARM64 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download both deep-diff artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: final-app-deep-diff-*-v1
          path: work/final-app-deep-diff
          merge-multiple: false

      - name: Build and commit compact authority
        shell: bash
        run: |
          set -euxo pipefail
          destination=arm64/locks/final-app-deep-diff-v1
          rm -rf "$destination"
          mkdir -p "$destination"
          for package in gooroom-integration-applet gooroom-session-manager; do
            source="work/final-app-deep-diff/final-app-deep-diff-$package-v1"
            test -f "$source/comparison/summary.json"
            mkdir -p "$destination/$package"
            cp "$source/comparison/summary.json" "$destination/$package/"
            cp "$source/comparison/payload-comparison.json" "$destination/$package/"
            cp "$source/comparison/resource-comparison.json" "$destination/$package/"
            cp "$source/source-authority/source-lock.json" "$destination/$package/"
          done
          jq -s '{schema:1,packages:.}' \
            "$destination/gooroom-integration-applet/summary.json" \
            "$destination/gooroom-session-manager/summary.json" \
            > "$destination/summary.json"
          jq -n \
            --arg actions_run_id '${{ github.run_id }}' \
            --arg actions_run_url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{schema:1,actions_run_id:$actions_run_id,actions_run_url:$actions_run_url,
              artifact_names:["final-app-deep-diff-gooroom-integration-applet-v1",
                              "final-app-deep-diff-gooroom-session-manager-v1"]}' \
            > "$destination/artifact-lock.json"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Lock final application binary differences v1'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
