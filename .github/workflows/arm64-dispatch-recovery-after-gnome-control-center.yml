name: ARM64 port - dispatch recovery after control center build

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-dispatch-recovery-after-gnome-control-center.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: hancom-gooroom-33-dispatch-recovery-after-control-center
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch exact package recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-recover-exact-package-pool.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port
