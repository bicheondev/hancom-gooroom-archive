name: ARM64 port - apply gnome-flashback Placement fix

on:
  push:
    branches:
      - arm64-port
    paths:
      - .github/workflows/arm64-apply-gnome-flashback-placement-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Apply and validate the exact source correction
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_gnome_flashback_placement.py
          python3 -m py_compile arm64/scripts/reconstruct_gnome_flashback_han3u4.py
          grep -Fq desktop-placement-submenu-removed arm64/scripts/reconstruct_gnome_flashback_han3u4.py
          if grep -Fq hidden_placement_block arm64/scripts/reconstruct_gnome_flashback_han3u4.py; then
            exit 1
          fi
          git diff --check

      - name: Commit the correction and remove temporary helpers
        run: |
          set -euxo pipefail
          rm -f arm64/scripts/repair_gnome_flashback_placement.py
          rm -f .github/workflows/arm64-fix-gnome-flashback-placement.yml
          rm -f .github/workflows/arm64-apply-gnome-flashback-placement-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            arm64/scripts/reconstruct_gnome_flashback_han3u4.py \
            arm64/scripts/repair_gnome_flashback_placement.py \
            .github/workflows/arm64-fix-gnome-flashback-placement.yml \
            .github/workflows/arm64-apply-gnome-flashback-placement-fix.yml
          git diff --cached --check
          git commit -m 'Remove gnome-flashback Placement submenu exactly'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Dispatch the complete reconstruction and promotion workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh workflow run arm64-reconstruct-build-promote-gnome-flashback-han3u4.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port
