name: ARM64 port - classify exact-source rebuild failures v3

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-rebuild-failure-audit-v3.yml'
      - 'arm64/scripts/classify_native_rebuild_failures.py'
      - 'arm64/scripts/classify_native_rebuild_failures_v3.py'
      - 'arm64/locks/rebuild-results/**'
      - 'arm64/locks/rebuild-release/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-rebuild-failure-audit
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Git-or-DSC rebuild evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Classify only the latest attempt for each exact source authority
        id: classify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf work/rebuild-failure-audit-v3
          mkdir -p work/rebuild-failure-audit-v3
          set +e
          python3 arm64/scripts/classify_native_rebuild_failures_v3.py \
            --results arm64/locks/rebuild-results \
            --output-dir work/rebuild-failure-audit-v3 \
            2>&1 | tee work/rebuild-failure-audit-v3/workflow-classifier.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/rebuild-failure-audit-v3 -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/rebuild-failure-audit-v3/LOCKSUMS.sha256
          cat work/rebuild-failure-audit-v3/summary.json

      - name: Upload full failure classifications and diagnostic tails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-rebuild-failure-audit-v3-${{ github.run_id }}
          path: work/rebuild-failure-audit-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit the latest exact-authority failure state
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/status/rebuild-failures-v3
          mkdir -p arm64/status/rebuild-failures-v3
          cp -a work/rebuild-failure-audit-v3/. arm64/status/rebuild-failures-v3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/status/rebuild-failures-v3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Classify latest exact-source ARM64 rebuild failures v3'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Retry dependency failures only against a changed verified repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          dependency_failures="$(jq -r '.dependency_resolution_failure_count // 0' \
            work/rebuild-failure-audit-v3/summary.json)"
          release=arm64/locks/rebuild-release/rebuild-release-lock.json
          if [ "$dependency_failures" -gt 0 ] \
             && [ -f "$release" ] \
             && jq -e '.summary.complete == true' "$release" >/dev/null; then
            gh workflow run arm64-dependency-retry-controller-v3.yml \
              --repo '${{ github.repository }}' \
              --ref arm64-port \
              -f limit=4
          fi
          gh workflow run arm64-port-coverage-v2.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port || true

      - name: Preserve classifier failure only after committing evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.classify.outputs.exit_code }}' = '0'
