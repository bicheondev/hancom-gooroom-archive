name: ARM64 port - upgrade package pool recovery policy

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-package-pool-v2-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-package-pool-v2-maintenance
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out ARM64 port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Use broad artifact discovery and explicit replacement policy
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/arm64-recover-exact-package-pool.yml')
          text=path.read_text(encoding='utf-8')
          original=text

          trigger="      - 'arm64/scripts/recover_exact_arm64_package_pool.py'\n"
          additions=(
              trigger
              + "      - 'arm64/scripts/recover_exact_arm64_package_pool_v2.py'\n"
              + "      - 'arm64/locks/arch-replacements/**'\n"
          )
          if "arm64/scripts/recover_exact_arm64_package_pool_v2.py" not in text:
              if trigger not in text: raise SystemExit('script trigger marker missing')
              text=text.replace(trigger,additions,1)

          text=text.replace(
              'python3 -m py_compile arm64/scripts/recover_exact_arm64_package_pool.py',
              'python3 -m py_compile arm64/scripts/recover_exact_arm64_package_pool.py \\\n            arm64/scripts/recover_exact_arm64_package_pool_v2.py',
          )

          old="""          positive=('arm64','aarch64','package','rebuild','reference','historical','vendor','debian','p7zip','accountsservice','wave','repo')
          negative=('iso','screenshot','qemu','schema','lint','source-lock','diagnostic')
"""
          new="""          positive=('arm64','aarch64','package','rebuild','reference','historical','vendor','debian','p7zip','accountsservice','wave','repo','arch-replacements')
          large_non_package=('iso','rootfs')
"""
          if old in text:text=text.replace(old,new,1)

          old_filter="""              if not any(token in name for token in positive):continue
              if all(token not in name for token in ('package','rebuild','repo','reference','historical','vendor','p7zip','accountsservice','wave')):continue
              if 'iso' in name and 'package' not in name:continue
"""
          new_filter="""              if not any(token in name for token in positive):continue
              if any(token in name for token in large_non_package) and not any(token in name for token in ('package','rebuild','repo','arch-replacements')):continue
"""
          if old_filter in text:text=text.replace(old_filter,new_filter,1)
          elif new_filter not in text:raise SystemExit('artifact selection filter marker missing')

          text=text.replace(
              'python3 arm64/scripts/recover_exact_arm64_package_pool.py \\\n',
              'python3 arm64/scripts/recover_exact_arm64_package_pool_v2.py \\\n',
          )
          if text==original:print('package pool workflow already uses v2 policy')
          else:path.write_text(text,encoding='utf-8')
          PY

          python3 -m py_compile \
            arm64/scripts/recover_exact_arm64_package_pool.py \
            arm64/scripts/recover_exact_arm64_package_pool_v2.py
          git rm -f .github/workflows/arm64-package-pool-v2-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-recover-exact-package-pool.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Upgrade exact ARM64 package-pool recovery to v2'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
