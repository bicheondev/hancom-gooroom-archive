name: ARM64 port - recover QtBase archival source candidate

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-qtbase-apt-source-archive.yml'
      - 'arm64/scripts/resolve_source_apt.py'
      - 'arm64/scripts/resolve_source_apt_archival.py'
      - 'arm64/locks/reference/**'
      - 'arm64/locks/vendor-binaries/**'
      - 'arm64/locks/sources-api-baseline/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hancom-gooroom-33-qtbase-archival-source-candidate
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out immutable port evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 1

      - name: Install source extraction tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev jq python3 xz-utils bzip2
          python3 -m py_compile \
            arm64/scripts/resolve_source_apt.py \
            arm64/scripts/resolve_source_apt_archival.py

      - name: Create the exact QtBase recovery seed
        run: |
          set -euxo pipefail
          rm -rf work/qtbase-archival
          mkdir -p work/qtbase-archival/result
          jq '
            .sources |= map(
              select(
                .source == "qtbase-opensource-src"
                and .source_version == "5.15.2+dfsg-9+grm3u1"
              )
            )
          ' arm64/locks/sources-api-baseline/source-lock.json \
            > work/qtbase-archival/seed.json
          test "$(jq '.sources | length' work/qtbase-archival/seed.json)" = 1

      - name: Attempt direct recovery, then archival candidate recovery
        run: |
          set -euxo pipefail
          PYTHONPATH=arm64/scripts \
          python3 arm64/scripts/resolve_source_apt_archival.py \
            --seed-lock work/qtbase-archival/seed.json \
            --evidence arm64/locks .github/workflows arm64/scripts \
            --output-dir work/qtbase-archival/result \
            --max-indexes 120
          jq . work/qtbase-archival/result/apt-source-lock-summary.json
          # This workflow must never silently promote an archived payload.
          test "$(jq -r '.sources[] | select(.status == "archival-candidate") | .status' \
            work/qtbase-archival/result/apt-source-lock.json \
            | sort -u | tr '\n' ' ')" != resolved
          find work/qtbase-archival/result -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/qtbase-archival/result/LOCKSUMS.sha256
          sha256sum --check work/qtbase-archival/result/LOCKSUMS.sha256

      - name: Upload archival source candidate and full transport evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtbase-5.15.2-grm3u1-archival-source-candidate
          path: work/qtbase-archival/result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
