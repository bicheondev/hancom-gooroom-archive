name: ARM64 port - promote verified gnome-control-center artifact

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-promote-gnome-control-center-artifact.yml'
      - 'arm64/scripts/promote_verified_git_arm64_artifact.py'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful exact gnome-control-center build run to promote
        required: true
        default: '31224081719'

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-promote-gnome-control-center-artifact
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '31224081719' }}
  ARTIFACT_NAME: gnome-control-center-exact-arm64-with-accountsservice
  ARTIFACT_DIGEST: 16ea0ca3a4e4b85914a2201b3d8557259c76b9f516a1576c0b7a8f556312bf6d

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out canonical authority and promotion policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download the successful exact chain build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: work/promote-gnome-control-center
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify artifact layout and install independent audit tools
        shell: bash
        run: |
          set -euxo pipefail
          test "$SOURCE_RUN_ID" = '31224081719'
          test "$ARTIFACT_DIGEST" = '16ea0ca3a4e4b85914a2201b3d8557259c76b9f516a1576c0b7a8f556312bf6d'
          target=work/promote-gnome-control-center/gnome-control-center-arm64
          dependency=work/promote-gnome-control-center/accountsservice-arm64
          test -d "$target"
          test -d "$dependency"
          test -f "$target/build-lock.json"
          test -f "$target/source-lock-evidence.json"
          test -f "$target/verification-summary.json"
          test -f "$target/local-build-dependencies.json"
          test -f "$target/SHA256SUMS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev file jq python3
          python3 -m py_compile arm64/scripts/promote_verified_git_arm64_artifact.py
          (
            cd "$target"
            sha256sum --check SHA256SUMS
          )
          (
            cd "$dependency"
            sha256sum --check SHA256SUMS
          )

      - name: Independently rescan and promote the exact ARM64 result
        shell: bash
        env:
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ env.SOURCE_RUN_ID }}
        run: |
          set -euxo pipefail
          result=arm64/locks/rebuild-results/gnome-control-center/1_3.38.4-1_grm3u9/result.json
          python3 arm64/scripts/promote_verified_git_arm64_artifact.py \
            --source-lock arm64/locks/effective-sources-v3/effective-source-lock.json \
            --reference arm64/locks/reference/amd64-reference.json \
            --artifact-dir work/promote-gnome-control-center/gnome-control-center-arm64 \
            --source gnome-control-center \
            --run-id "$SOURCE_RUN_ID" \
            --run-url "$SOURCE_RUN_URL" \
            --artifact-name "$ARTIFACT_NAME" \
            --dependency-source accountsservice \
            --dependency-version '0.6.55-3+grm3u1' \
            --required-local-package libaccountsservice-dev \
            --required-local-package libaccountsservice0 \
            --result-path "$result"
          jq -e '
            .passed == true
            and .verification_passed == true
            and .source == "gnome-control-center"
            and .source_version == "1:3.38.4-1+grm3u9"
            and .repository_full_name == "gooroom/gnome-control-center"
            and .commit_sha == "55fd48f9dbf8d2bee0dea33478ed20e4867c9cbc"
            and .tree_sha == "e4b8dd73f8668f6a30ac3fe333665b78cfa2d0f0"
            and .verification.wrong_architecture_executable_count == 0
            and .verification.local_dependency_chain.dependency_source.source == "accountsservice"
            and .verification.local_dependency_chain.dependency_source.source_version == "0.6.55-3+grm3u1"
          ' "$result" >/dev/null

      - name: Commit the immutable exact-authority build result
        shell: bash
        run: |
          set -euxo pipefail
          result=arm64/locks/rebuild-results/gnome-control-center/1_3.38.4-1_grm3u9/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$result"
          if git diff --cached --quiet; then
            echo 'The verified gnome-control-center result is already current.'
            exit 0
          fi
          git commit -m 'Promote verified gnome-control-center ARM64 build'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Refresh package recovery and ARM64 coverage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-recover-exact-package-pool.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port || true
          gh workflow run arm64-port-coverage.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port || true
          gh workflow run arm64-port-coverage-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref arm64-port || true
