name: ARM64 port - finalize rebuild workflow normalization

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-rebuild-workflow-maintenance-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-rebuild-workflow-maintenance
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Finalize the single deterministic rebuild workflow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-native-rebuild-batch-v2.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'find work/rebuild-results -type f -print0',
              'find work/rebuild-results -type f ! -name LOCKSUMS.sha256 -print0',
          )
          if 'find work/rebuild-results -type f ! -name LOCKSUMS.sha256 -print0' not in text:
              raise SystemExit('deterministic checksum exclusion was not installed')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/arm64-native-rebuild-batch.yml 2>/dev/null || true
          git rm -f .github/workflows/arm64-rebuild-workflow-maintenance.yml 2>/dev/null || true
          git rm -f .github/workflows/arm64-rebuild-workflow-maintenance-v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/arm64-native-rebuild-batch-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize native ARM64 rebuild workflow normalization'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
