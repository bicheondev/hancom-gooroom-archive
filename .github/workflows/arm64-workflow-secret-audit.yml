name: ARM64 port - audit workflows for literal credentials

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/**'
      - 'arm64/scripts/audit_workflow_secret_literals.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-workflow-secret-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out active workflow YAML
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Scan without ever emitting a detected credential value
        id: audit
        shell: bash
        run: |
          set -uxo pipefail
          rm -rf work/workflow-secret-audit
          set +e
          python3 arm64/scripts/audit_workflow_secret_literals.py \
            --workflow-dir .github/workflows \
            --output-dir work/workflow-secret-audit
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          find work/workflow-secret-audit -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > work/workflow-secret-audit/LOCKSUMS.sha256
          cat work/workflow-secret-audit/summary.json

      - name: Upload redacted secret audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-arm64-workflow-secret-audit
          path: work/workflow-secret-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit compact redacted audit
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf arm64/audit/workflow-secrets
          mkdir -p arm64/audit/workflow-secrets
          cp -a work/workflow-secret-audit/. arm64/audit/workflow-secrets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/audit/workflow-secrets
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record redacted ARM64 workflow secret audit'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Enforce zero literal credentials
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test '${{ steps.audit.outputs.exit_code }}' = '0'
          jq -e '.passed == true' work/workflow-secret-audit/summary.json
