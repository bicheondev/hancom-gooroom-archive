name: ARM64 probe Hancom APT exact source v1

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-probe-hancom-apt-source-v1.yml'
      - 'arm64/scripts/probe_hancom_apt_source_v1.py.gz'

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-apt-exact-source-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the triggering ARM64 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install APT index inspection tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev jq lz4 python3 xz-utils zstd
          test "$(sha256sum arm64/scripts/probe_hancom_apt_source_v1.py.gz | awk '{print $1}')" = \
            b9fdd8d82f439171c922209af22b760e7f768657f7efcca6bf4e2b335af10b60
          gzip -dc arm64/scripts/probe_hancom_apt_source_v1.py.gz \
            > "$RUNNER_TEMP/probe_hancom_apt_source_v1.py"
          test "$(sha256sum "$RUNNER_TEMP/probe_hancom_apt_source_v1.py" | awk '{print $1}')" = \
            c721fc043f46d21b64cbc6025d0716618b3d3ada2a3c0abb540204f5e25a21d6
          python3 -m py_compile "$RUNNER_TEMP/probe_hancom_apt_source_v1.py"

      - name: Probe repository suites and recover exact source when present
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/probe_hancom_apt_source_v1.py" \
            --workspace work/apt-source-probe-v1
          jq '.' work/apt-source-probe-v1/output/summary.json >> "$GITHUB_STEP_SUMMARY"
          (
            cd work/apt-source-probe-v1/output
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Upload complete APT source probe evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-integration-applet-apt-source-probe-v1
          path: work/apt-source-probe-v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Commit compact fail-closed APT source authority
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source=work/apt-source-probe-v1/output
          destination=arm64/locks/gooroom-integration-applet-apt-source-probe-v1/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          for name in \
            summary.json \
            release-probes.json \
            index-probes.json \
            exact-source-records.json \
            exact-binary-records.json \
            available-source-versions.json
          do
            cp "$source/$name" "$destination/"
          done
          [[ ! -f "$source/exact-source-lock.json" ]] \
            || cp "$source/exact-source-lock.json" "$destination/"

          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" '
              {
                schema: 1,
                actions_run_id: $run_id,
                actions_run_attempt: $run_attempt,
                actions_run_url: $run_url,
                triggering_head_sha: $head_sha,
                artifact_id: $artifact_id,
                artifact_digest: $artifact_digest,
                fail_closed: true
              }
            ' > "$destination/artifact-lock.json"

          find "$destination" -type f -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$destination/FILE-INVENTORY.tsv"
          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record integration applet exact APT source probe v1'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
