name: ARM64 port - select build and record exact package wave 2 v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-build-wave2-v2.yml'
      - 'arm64/scripts/select_arm64_build_wave.py'
      - 'arm64/scripts/build_locked_source_arm64.sh'
      - 'arm64/scripts/run_locked_source_arm64.sh'
      - 'arm64/scripts/run_locked_source_arm64_v4.sh'
      - 'arm64/scripts/validate_arm64_source_outputs_v3.py'
      - 'arm64/scripts/validate_arm64_source_outputs_v4.py'
      - 'arm64/scripts/summarize_arm64_build_wave.py'
      - 'arm64/locks/effective-sources/**'
      - 'arm64/locks/reference/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-arm64-wave2-v2
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out exact source locks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Select the next bounded exact source set
        id: select
        run: |
          set -euxo pipefail
          mkdir -p work/wave2-v2-selection
          python3 arm64/scripts/select_arm64_build_wave.py \
            --lock arm64/locks/effective-sources/effective-source-lock.json \
            --output work/wave2-v2-selection/selection.json \
            --exclude-source accountsservice \
            --exclude-source file-roller \
            --exclude-source celluloid \
            --exclude-source cups-pk-helper \
            --exclude-source mousetweaks \
            --exclude-source gnome-screenshot \
            --exclude-source p7zip \
            --maximum-selected-sources 8 \
            --maximum-native-binaries 4 \
            --maximum-total-binaries 8
          matrix="$(jq -c '{source: [.selected[].source]}' \
            work/wave2-v2-selection/selection.json)"
          test "$(jq '.source | length' <<<"$matrix")" -gt 0
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave2-v2-selection
          path: work/wave2-v2-selection
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  build:
    needs: prepare
    name: ${{ matrix.source }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out exact locks and builders
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port

      - name: Verify native ARM64 host and install verification tools
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo 'This job must run on native ARM64.' >&2; exit 1 ;;
          esac
          docker version
          test "$(docker info --format '{{.Architecture}}')" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev file git jq python3

      - name: Build and validate the exact locked source
        env:
          HANCOM_GOOROOM_DEBIAN_SNAPSHOT: 20230730T235959Z
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          set -euxo pipefail
          chmod +x \
            arm64/scripts/build_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64.sh \
            arm64/scripts/run_locked_source_arm64_v4.sh \
            arm64/scripts/validate_arm64_source_outputs_v3.py \
            arm64/scripts/validate_arm64_source_outputs_v4.py
          output="work/${SOURCE_NAME}-arm64-wave2-v2"
          rm -rf "$output"
          arm64/scripts/run_locked_source_arm64_v4.sh \
            arm64/locks/effective-sources/effective-source-lock.json \
            "$SOURCE_NAME" \
            "$output"
          jq -e '.status == "passed"' \
            "$output/arm64-source-output-validation-v4.json"
          find "$output" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > "$output/SHA256SUMS"
          test -s "$output/SHA256SUMS"

      - name: Upload exact ARM64 packages and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.source }}-exact-arm64-wave2-v2
          path: work/${{ matrix.source }}-arm64-wave2-v2
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  record:
    name: Record complete wave evidence
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Download every artifact from this workflow run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: work/wave2-v2-artifacts

      - name: Build a fail-closed same-run summary
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -uxo pipefail
          rm -rf work/wave2-v2-evidence
          mkdir -p work/wave2-v2-evidence work/wave2-v2-artifacts
          selection="$(find work/wave2-v2-artifacts -type f -name selection.json -print -quit)"
          if [ -n "$selection" ]; then
            cp "$selection" work/wave2-v2-evidence/selection.json
            selection_arg=(--selection-json work/wave2-v2-evidence/selection.json)
          else
            selection_arg=(--selection-json work/wave2-v2-evidence/missing-selection.json)
          fi
          set +e
          python3 arm64/scripts/summarize_arm64_build_wave.py \
            --artifacts-root work/wave2-v2-artifacts \
            --output-dir work/wave2-v2-evidence \
            --schema hancom-gooroom-arm64-build-wave2-v2-evidence \
            "${selection_arg[@]}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --head-branch "$GITHUB_REF_NAME" \
            --workflow-name "$GITHUB_WORKFLOW" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --download-status "$DOWNLOAD_OUTCOME"
          summary_rc=$?
          set -e
          echo "$summary_rc" > work/wave2-v2-evidence/summarizer.exit-code
          find work/wave2-v2-evidence -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/wave2-v2-evidence/LOCKSUMS.sha256
          jq . work/wave2-v2-evidence/summary.json

      - name: Commit the evidence before enforcing the result
        run: |
          set -euxo pipefail
          git pull --rebase origin arm64-port
          destination=arm64/locks/build-wave2-v2
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a work/wave2-v2-evidence/. "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact ARM64 package wave 2 v2 evidence'
            git pull --rebase origin arm64-port
            git push origin HEAD:arm64-port
          fi

      - name: Upload consolidated wave evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75fa02
        with:
          name: hancom-gooroom-arm64-wave2-v2-evidence
          path: work/wave2-v2-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce a complete passing wave
        run: |
          set -euxo pipefail
          test '${{ needs.prepare.result }}' = success
          test '${{ needs.build.result }}' = success
          test "$(jq -r '.status' work/wave2-v2-evidence/summary.json)" = passed
