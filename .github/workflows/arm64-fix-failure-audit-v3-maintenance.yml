name: ARM64 port - make dependency failure dispatch schema-independent

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-fix-failure-audit-v3-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hancom-gooroom-33-rebuild-failure-audit
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out failure audit v3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Count dependency failures from classification rows directly
        shell: bash
        run: |
          set -euxo pipefail
          workflow=.github/workflows/arm64-rebuild-failure-audit-v3.yml
          test -f "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arm64-rebuild-failure-audit-v3.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          dependency_failures="$(jq -r '.dependency_resolution_failure_count // 0' \\
            work/rebuild-failure-audit-v3/summary.json)"'''
          new = '''          dependency_failures="$(jq '[
            .sources[]
            | select(
                .category == "dependency-resolution"
                and .passed != true
              )
          ] | length' work/rebuild-failure-audit-v3/classifications.json)"'''
          if old not in text and 'work/rebuild-failure-audit-v3/classifications.json' not in text:
              raise SystemExit('expected dependency failure count block was not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'work/rebuild-failure-audit-v3/classifications.json' "$workflow"
          git rm -f .github/workflows/arm64-fix-failure-audit-v3-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow"
          git commit -m 'Count dependency failures from exact classification rows'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Re-run exact-source failure audit v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run arm64-rebuild-failure-audit-v3.yml \
            --repo '${{ github.repository }}' \
            --ref arm64-port
