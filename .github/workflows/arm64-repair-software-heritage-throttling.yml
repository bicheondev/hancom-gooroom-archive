name: ARM64 port - repair Software Heritage throttling

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-software-heritage-throttling.yml'
      - 'arm64/bootstrap/repair_software_heritage_throttling.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-software-heritage-throttling
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply and verify fail-closed request pacing
        shell: bash
        run: |
          set -euxo pipefail
          target=arm64/scripts/archaeology_software_heritage_exact_sources.py
          patcher=arm64/bootstrap/repair_software_heritage_throttling.py
          test "$(git hash-object "$target")" = '41d7ca5de3979c589af36d4b2ceced84934a0f5f'
          python3 "$patcher" "$target"
          python3 -m py_compile "$target" "$patcher"
          python3 - "$target" <<'PY'
          import importlib.util
          import io
          import sys
          import urllib.error
          from email.message import Message
          from unittest.mock import patch

          spec = importlib.util.spec_from_file_location('swh_archaeology', sys.argv[1])
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          class Response:
              status = 200
              def __init__(self):
                  self.body = io.BytesIO(b'{}')
                  self.headers = Message()
                  self.headers['Content-Type'] = 'application/json'
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self, size=-1): return self.body.read(size)
              def geturl(self): return 'https://archive.softwareheritage.org/api/1/test/'

          headers = Message()
          headers['Retry-After'] = '0'
          limited = urllib.error.HTTPError(
              'https://archive.softwareheritage.org/api/1/test/',
              429,
              'Too Many Requests',
              headers,
              None,
          )
          module.configure_request_policy(0.0, 2)
          with patch.object(module.urllib.request, 'urlopen', side_effect=[limited, Response()]), \
               patch.object(module.time, 'sleep', return_value=None):
              body, evidence = module.request_bytes(
                  'https://archive.softwareheritage.org/api/1/test/',
                  timeout=1,
                  max_bytes=1024,
                  accept='application/json',
              )
          assert body == b'{}'
          assert evidence['attempt_count'] == 2
          assert len(evidence['retry_history']) == 1
          assert module._REQUEST_STATS['rate_limited_responses'] == 1

          module.configure_request_policy(0.0, 0)
          with patch.object(module.urllib.request, 'urlopen', side_effect=limited), \
               patch.object(module.time, 'sleep', return_value=None):
              try:
                  module.request_bytes(
                      'https://archive.softwareheritage.org/api/1/exhaust/',
                      timeout=1,
                      max_bytes=1024,
                      accept='application/json',
                  )
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('429 exhaustion became a false negative')
          print('Software Heritage request-policy smoke tests: PASS')
          PY
          git diff --check

      - name: Commit repaired client and remove bootstrap program
        shell: bash
        run: |
          set -euxo pipefail
          target=arm64/scripts/archaeology_software_heritage_exact_sources.py
          patcher=arm64/bootstrap/repair_software_heritage_throttling.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm "$patcher"
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$target"
          printf '%s\n' "${changed[@]}" | grep -Fx "$patcher"
          git commit -m 'Make Software Heritage archaeology rate-limit aware'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
