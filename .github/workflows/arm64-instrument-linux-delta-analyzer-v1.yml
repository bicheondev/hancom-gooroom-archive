name: ARM64 instrument - Linux delta analyzer failure locator v1

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-instrument-linux-delta-analyzer-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-instrument-linux-delta-analyzer-v1
  cancel-in-progress: false

jobs:
  instrument:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Add fail-closed run locator and publish
        shell: bash
        run: |
          set -euxo pipefail
          target=.github/workflows/arm64-analyze-linux-5.10.179-grm3u1-delta-v1.yml
          marker='Persist Linux delta analyzer failure locator'
          if grep -Fq "$marker" "$target"; then
            echo 'Analyzer is already instrumented.'
          else
            cat >> "$target" <<'EOF'

      - name: Persist Linux delta analyzer failure locator
        if: failure()
        shell: bash
        run: |
          set -uxo pipefail
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin arm64-port || true
          destination=arm64/locks/linux-5.10.179-grm3u1-delta-v1/failure
          rm -rf "$destination"
          mkdir -p "$destination"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow_commit "$GITHUB_SHA" \
            '{schema:1,status:"failed",actions_run_id:$run_id,
              actions_run_attempt:$run_attempt,actions_run_url:$run_url,
              workflow_commit:$workflow_commit}' \
            > "$destination/failure.json"
          sha256sum "$destination/failure.json" > "$destination/LOCKSUMS.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Record Linux delta analyzer failure locator' || exit 0
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port || { git rebase --abort || true; continue; }
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
EOF
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm .github/workflows/arm64-instrument-linux-delta-analyzer-v1.yml
          git diff --cached --check
          git commit -m 'Instrument Linux delta analyzer failure locator'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
