name: ARM64 port - probe exact DSC files in reference APT pools

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-probe-reference-apt-dsc-pools.yml'
      - 'arm64/scripts/probe_exact_dsc_pool_candidates.py'
      - 'arm64/locks/reference-apt-source-recovery/latest/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: hancom-gooroom-33-reference-apt-dsc-pool-probe
  cancel-in-progress: true

env:
  ISO_RELEASE: v3.3
  ISO_NAME: Hancom-Gooroom-3.3-amd64.hybrid.iso
  ISO_SIZE: '1566277632'
  ISO_SHA256: ba3ac40c66c255bccb53b7e5e8bbe1fdee6cec93a63669d1f4c9d75555d7644a

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Check out current ARM64 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install source, signature, ISO, and archive tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 ca-certificates dpkg-dev gnupg jq lz4 p7zip-full python3 \
            squashfs-tools xorriso xz-utils zstd
          python3 -m py_compile \
            arm64/scripts/recover_exact_sources_from_reference_apt.py \
            arm64/scripts/probe_exact_dsc_pool_candidates.py

      - name: Synchronize the completed higher-tier APT recovery authority
        shell: bash
        run: |
          set -euxo pipefail
          path=arm64/locks/reference-apt-source-recovery/latest/summary.json
          for attempt in $(seq 1 40); do
            git fetch origin arm64-port
            if git cat-file -e "origin/arm64-port:$path" 2>/dev/null; then
              git checkout origin/arm64-port -- arm64/locks/reference-apt-source-recovery/latest
              break
            fi
            sleep 15
          done
          test -f "$path"
          jq -e '
            .schema == 1
            and .target_count == 7
            and .automatic_promotion_performed == false
          ' "$path" >/dev/null

      - name: Verify the exact reference ISO evidence lock
        shell: bash
        run: |
          set -euxo pipefail
          evidence=arm64/locks/reference-iso-source-residue/latest
          test -f "$evidence/LOCKSUMS.sha256"
          (
            cd "$evidence"
            sha256sum --check --strict LOCKSUMS.sha256
          )
          jq -e '
            .iso.verified == true
            and .iso.size == 1566277632
            and .iso.sha256 == "ba3ac40c66c255bccb53b7e5e8bbe1fdee6cec93a63669d1f4c9d75555d7644a"
            and .target_count == 7
          ' "$evidence/summary.json" >/dev/null

      - name: Download and verify the locked ISO for trusted key extraction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          base=work/reference-apt-dsc-pool-probe
          rm -rf "$base"
          mkdir -p "$base"/{download,keyring-root,evidence}
          gh release download "$ISO_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ISO_NAME" \
            --dir "$base/download" \
            --clobber
          iso="$base/download/$ISO_NAME"
          test "$(stat -c '%s' "$iso")" = "$ISO_SIZE"
          printf '%s  %s\n' "$ISO_SHA256" "$iso" | sha256sum --check --strict

      - name: Extract reference APT keyrings without unpacking the full rootfs
        shell: bash
        run: |
          set -euxo pipefail
          base=work/reference-apt-dsc-pool-probe
          iso="$base/download/$ISO_NAME"
          squashfs="$base/filesystem.squashfs"
          xorriso -osirrox on -indev "$iso" \
            -extract /live/filesystem.squashfs "$squashfs" \
            > "$base/evidence/xorriso-squashfs.log" 2>&1
          test -s "$squashfs"
          test "$(sha256sum "$squashfs" | awk '{print $1}')" = \
            '9fafa38784dd2df090ef1bb356f165eb297b81ae7852b2104f4bd558c9cd7ef5'

          unsquashfs -ll "$squashfs" > "$base/evidence/squashfs-list.txt"
          awk '{print $NF}' "$base/evidence/squashfs-list.txt" \
            | sed 's#^squashfs-root/##' \
            | grep -E '^(etc/apt/trusted\.gpg$|etc/apt/trusted\.gpg\.d/|usr/share/keyrings/)' \
            | grep -E '(trusted\.gpg$|\.(gpg|pgp|kbx|asc)$)' \
            | LC_ALL=C sort -u > "$base/evidence/keyring-paths.txt" || true

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            destination="$base/keyring-root/$path"
            mkdir -p "$(dirname "$destination")"
            unsquashfs -cat "$squashfs" "$path" > "$destination"
          done < "$base/evidence/keyring-paths.txt"

          export GNUPGHOME="$base/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          while IFS= read -r file; do
            gpg --batch --homedir "$GNUPGHOME" --import "$file" \
              >> "$base/evidence/keyring-import.log" 2>&1 || true
          done < <(find "$base/keyring-root" -type f | LC_ALL=C sort)
          gpg --batch --homedir "$GNUPGHOME" --export \
            > "$base/keyring-root/reference-iso-combined.gpg"
          gpg --batch --homedir "$GNUPGHOME" --with-colons --fingerprint \
            > "$base/evidence/reference-key-fingerprints.txt"
          test -s "$base/keyring-root/reference-iso-combined.gpg"
          find "$base/keyring-root" -type f -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$base/evidence/keyring-inventory.tsv"

      - name: Verify cached historical InRelease signatures with ISO keyrings
        shell: bash
        run: |
          set -euxo pipefail
          base=work/reference-apt-dsc-pool-probe
          combined="$base/keyring-root/reference-iso-combined.gpg"
          : > "$base/evidence/cached-inrelease-signatures.tsv"
          while IFS= read -r file; do
            set +e
            output="$(gpgv --keyring "$combined" "$file" 2>&1)"
            rc=$?
            set -e
            printf '%s\t%s\t%s\n' \
              "$rc" \
              "${file#arm64/locks/reference-iso-source-residue/latest/}" \
              "$(printf '%s' "$output" | tr '\n\t' '  ' | cut -c1-1000)" \
              >> "$base/evidence/cached-inrelease-signatures.tsv"
          done < <(find \
            arm64/locks/reference-iso-source-residue/latest/selected-text \
            -maxdepth 1 -type f -name '*hancomgooroom*InRelease.txt' \
            | LC_ALL=C sort)
          cat "$base/evidence/cached-inrelease-signatures.tsv"

      - name: Probe deterministic exact DSC pool paths and archived copies
        shell: bash
        run: |
          set -euxo pipefail
          base=work/reference-apt-dsc-pool-probe
          output="$base/output"
          python3 arm64/scripts/probe_exact_dsc_pool_candidates.py \
            --reference-evidence arm64/locks/reference-iso-source-residue/latest \
            --higher-tier-recovery arm64/locks/reference-apt-source-recovery/latest \
            --keyring-root "$base/keyring-root" \
            --output-dir "$output"
          cp "$base/evidence/cached-inrelease-signatures.tsv" "$output/"
          cp "$base/evidence/reference-key-fingerprints.txt" "$output/"
          cp "$base/evidence/keyring-inventory.tsv" "$output/"
          jq -e '
            .schema == 1
            and .target_count == 7
            and .automatic_promotion_performed == false
            and (
              .already_authorized_by_higher_tier_count
              + .signature_verified_exact_dsc_count
              + .complete_unverified_signature_count
              + .incomplete_exact_dsc_count
              + .ambiguous_target_count
              + .unresolved_target_count
              == .target_count
            )
          ' "$output/summary.json" >/dev/null
          cat "$output/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Seal complete DSC pool-probe evidence
        shell: bash
        run: |
          set -euxo pipefail
          output=work/reference-apt-dsc-pool-probe/output
          find "$output" -type f -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$output/FILE-INVENTORY.tsv"
          (
            cd "$output"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          du -sh "$output"

      - name: Upload complete DSC pool candidates and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hancom-gooroom-3.3-reference-apt-dsc-pool-probe
          path: work/reference-apt-dsc-pool-probe/output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 1

      - name: Build compact immutable DSC pool authority
        shell: bash
        run: |
          set -euxo pipefail
          source=work/reference-apt-dsc-pool-probe/output
          compact=work/reference-apt-dsc-pool-probe/compact
          rm -rf "$compact"
          mkdir -p "$compact"
          for file in \
            SUMMARY.md \
            summary.json \
            target-results.json \
            network-probes.json \
            keyrings.json \
            cached-inrelease-signatures.tsv \
            reference-key-fingerprints.txt \
            keyring-inventory.tsv \
            FILE-INVENTORY.tsv; do
            test -f "$source/$file"
            cp "$source/$file" "$compact/$file"
          done
          (
            cd "$compact"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

      - name: Commit compact DSC pool-probe authority
        shell: bash
        run: |
          set -euxo pipefail
          source=work/reference-apt-dsc-pool-probe/compact
          destination=arm64/locks/reference-apt-dsc-pool-probe/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a "$source/." "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            echo 'Reference APT DSC pool authority is already current.'
            exit 0
          fi
          git commit -m 'Probe exact DSC files in reference APT pools'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
