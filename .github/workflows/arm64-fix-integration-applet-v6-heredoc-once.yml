name: ARM64 fix integration applet v6 heredoc once

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-fix-integration-applet-v6-heredoc-once.yml'

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-fix-integration-applet-v6-heredoc-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the active ARM64 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Deindent the nested source-recovery Python heredoc
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = (
              "            python3 - <<'PY'\n"
              '            from __future__ import annotations\n'
          )
          end_marker = (
              '            PY\n\n'
              "            jq -c '.files | to_entries[]'"
          )

          if text.count(start_marker) != 1:
              raise SystemExit(
                  f'expected one indented source heredoc start, found {text.count(start_marker)}'
              )
          if text.count(end_marker) != 1:
              raise SystemExit(
                  f'expected one indented source heredoc end, found {text.count(end_marker)}'
              )

          start = text.index(start_marker)
          delimiter_end = text.index(end_marker, start) + len('            PY\n')
          segment = text[start:delimiter_end]
          lines = segment.splitlines(keepends=True)
          malformed = [
              line
              for line in lines
              if line.strip() and not line.startswith('            ')
          ]
          if malformed:
              raise SystemExit(f'unexpected indentation inside source heredoc: {malformed[:3]!r}')

          fixed = ''.join(
              line[2:] if line.startswith('  ') else line
              for line in lines
          )
          expected_prefix = (
              "          python3 - <<'PY'\n"
              '          from __future__ import annotations\n'
          )
          expected_suffix = '          PY\n'
          expected_following = (
              "\n            jq -c '.files | to_entries[]'"
          )
          if not fixed.startswith(expected_prefix):
              raise SystemExit('repaired source heredoc has an unexpected prefix')
          if not fixed.endswith(expected_suffix):
              raise SystemExit('repaired source heredoc has an unexpected closing delimiter')

          text = text[:start] + fixed + text[delimiter_end:]
          if text[start:start + len(fixed)] != fixed:
              raise SystemExit('repaired source heredoc was not written at the original location')
          if not text[start + len(fixed):].startswith(expected_following):
              raise SystemExit('source-package loop no longer follows the repaired heredoc')
          if segment in text:
              raise SystemExit('original indented source heredoc remains after repair')

          path.write_text(text, encoding='utf-8')
          PY

          target=.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml
          ruby -e '
            require "yaml"
            data = YAML.load_file(ARGV.fetch(0), aliases: true)
            step = data.fetch("jobs").fetch("recover").fetch("steps").find do |row|
              row["name"] == "Recover and verify exact source package when present"
            end
            abort "source recovery step not found" unless step
            File.write(ARGV.fetch(1), step.fetch("run"))
          ' "$target" "$RUNNER_TEMP/source-recovery-step.sh"
          bash -n "$RUNNER_TEMP/source-recovery-step.sh"

          python3 - "$RUNNER_TEMP/source-recovery-step.sh" <<'PY'
          from pathlib import Path
          import sys

          script = Path(sys.argv[1]).read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = script.index(marker) + len(marker)
          end = script.index('\nPY\n', start)
          compile(script[start:end], '<source-recovery-heredoc>', 'exec')
          PY

          grep -nF "python3 - <<'PY'" "$target"
          grep -nF 'Version field was not found in vendor DSC' "$target"
          git diff --check -- "$target"

      - name: Commit the target repair and remove this one-shot
        shell: bash
        run: |
          set -Eeuo pipefail
          target=.github/workflows/arm64-recover-integration-applet-vendor-source-debug-v6.yml
          self=.github/workflows/arm64-fix-integration-applet-v6-heredoc-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git rm "$self"
          git diff --cached --check
          git commit -m 'Fix integration applet vendor recovery v6 heredoc'

          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
