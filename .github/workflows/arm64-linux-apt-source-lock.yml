name: ARM64 port - recover exact Linux 5.10.179 source

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-linux-apt-source-lock.yml'
      - 'arm64/scripts/resolve_source_apt.py'
      - 'arm64/locks/reference/**'
      - 'arm64/locks/vendor-binaries/**'
      - 'arm64/locks/sources-api-baseline/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-linux-apt-source-lock
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out immutable port evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install Debian source verification tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev jq python3 xz-utils bzip2
          python3 -m py_compile arm64/scripts/resolve_source_apt.py

      - name: Extract the exact AMD64 reference kernel source row
        id: seed
        run: |
          set -euxo pipefail
          mkdir -p work/linux-source/result
          jq '
            .sources |= map(
              select(
                .source == "linux"
                and .source_version == "5.10.179-1+grm3u1"
              )
            )
          ' arm64/locks/sources-api-baseline/source-lock.json \
            > work/linux-source/linux-seed-lock.json
          test "$(jq '.sources | length' work/linux-source/linux-seed-lock.json)" = 1
          status="$(jq -r '.sources[0].status' work/linux-source/linux-seed-lock.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = resolved ]; then
            jq -n \
              --arg status already-git-resolved \
              --arg source linux \
              --arg version '5.10.179-1+grm3u1' \
              '{status:$status, source:$source, source_version:$version, resolved_count:1}' \
              > work/linux-source/result/apt-source-lock-summary.json
            cp work/linux-source/linux-seed-lock.json \
              work/linux-source/result/existing-exact-source-lock.json
          fi

      - name: Discover historical Sources indexes and verify kernel source files
        if: steps.seed.outputs.status != 'resolved'
        run: |
          set -euxo pipefail
          python3 arm64/scripts/resolve_source_apt.py \
            --seed-lock work/linux-source/linux-seed-lock.json \
            --evidence arm64/locks .github/workflows arm64/scripts \
            --output-dir work/linux-source/result \
            --max-indexes 120
          jq . work/linux-source/result/apt-source-lock-summary.json

      - name: Seal all source-lock evidence
        run: |
          set -euxo pipefail
          find work/linux-source/result -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > work/linux-source/result/LOCKSUMS.sha256
          sha256sum --check work/linux-source/result/LOCKSUMS.sha256

      - name: Upload exact kernel source-lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-5.10.179-1-grm3u1-source-lock
          path: work/linux-source/result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record a newly recovered APT source lock
        if: steps.seed.outputs.status != 'resolved'
        run: |
          set -euxo pipefail
          resolved="$(jq -r '.resolved_count' \
            work/linux-source/result/apt-source-lock-summary.json)"
          if [ "$resolved" = 0 ]; then
            exit 0
          fi
          test "$resolved" = 1
          rm -rf arm64/locks/linux-apt-source
          mkdir -p arm64/locks/linux-apt-source
          jq '
            walk(
              if type == "object" then del(.local_path, .dsc)
              else .
              end
            )
          ' work/linux-source/result/apt-source-lock.json \
            > arm64/locks/linux-apt-source/apt-source-lock.json
          cp work/linux-source/result/apt-source-lock-summary.json \
            arm64/locks/linux-apt-source/
          sha256sum arm64/locks/linux-apt-source/* | sort -k2 \
            > arm64/locks/linux-apt-source/LOCKSUMS.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/locks/linux-apt-source
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Lock exact Linux 5.10.179-1+grm3u1 source payload'
          git pull --rebase origin arm64-port
          git push origin HEAD:arm64-port
