name: ARM64 native session manager han3u2 candidate v1

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-native-session-manager-han3u2-v1.yml'
      - 'arm64/scripts/verify_session_manager_han3u2_native_v1.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: hancom-gooroom-33-native-session-manager-han3u2-v1
  cancel-in-progress: false

jobs:
  native-arm64:
    if: github.ref == 'refs/heads/arm64-port'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    env:
      PACKAGE: gooroom-session-manager
      VERSION: '0.3.9+grm3u1+han3u2'

      SEMANTIC_LOCK: arm64/locks/gooroom-session-manager-han3u2-elf-delta-v2/latest
      SEMANTIC_ANALYSIS_RUN_ID: '32619558289'

      RECONSTRUCTION_RUN_ID: '32619574420'
      RECONSTRUCTION_ARTIFACT_ID: '9488027521'
      RECONSTRUCTION_ARTIFACT_NAME: gooroom-session-manager-han3u2-reconstruction-v1
      RECONSTRUCTION_ARTIFACT_DIGEST: 'sha256:95230ae48628f4a85d0125bc38f40fc25ba526f011464970500b68887237aae2'
      RECONSTRUCTION_TRIGGER_SHA: '6467b41a979abdd9591bc133f4c254afe0f50282'

      BASE_COMMIT: 'd70dfbd27ea62e7a71f51c0018eb48cfe6fa0794'
      BASE_TREE: 'e8fb3bd1279ae7cd0a3526ae4f4c7b375835e1d5'
      RECONSTRUCTED_TREE: '1e73648b25dfa42acccc00a76ed5006cc82ee729'
      RECONSTRUCTION_PATCH_SHA256: 'f317f87b303ab3c993515cbf74fb566a0bcfc9d569f2c11dcd96ee294e49db14'
      SOURCE_ARCHIVE_SHA256: '522c17d528aa5114aad4cad258d476a79526711be3f52aee81f1d1fcea9d62bb'
      AMD64_TARGET_DEB_SHA256: '6cdc971c8258ae3e05a97b314128ca212141a7a8913c82ebf7690c79d3fc6c4d'
      AMD64_RECONSTRUCTED_DEB_SHA256: '91fcffb2245eefa58177fa59a47d95661881a2f3e6bea9e4de11b2fad941cc0d'

      BULLSEYE_BASE_DIGEST: 'sha256:99cdf7792e25416bd801861ccd8e2fb27fb527b25e8d9a8704ebc3ead2015675'

    steps:
      - name: Check out triggering authority consumer commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install host verification tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates dpkg-dev file git jq python3
          gh --version
          docker version
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64

      - name: Verify locked semantic reconstruction authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$SEMANTIC_LOCK"
          (
            cd "$SEMANTIC_LOCK"
            sha256sum --check --strict LOCKSUMS.sha256
          )

          jq -e \
            --arg package "$PACKAGE" \
            --arg version "$VERSION" \
            --arg analysis "$SEMANTIC_ANALYSIS_RUN_ID" \
            --arg reconstruction "$RECONSTRUCTION_RUN_ID" \
            --arg artifact "$RECONSTRUCTION_ARTIFACT_ID" '
              .schema == 2
              and .package == $package
              and .version == $version
              and .target_architecture_for_comparison == "amd64"
              and .analysis_run_id == $analysis
              and .reconstruction_run_id == $reconstruction
              and .reconstruction_artifact_id == $artifact
              and .semantic_binary_equivalent == true
              and .source_reconstruction_semantically_verified == true
              and .arm64_build_allowed == true
              and .package_layer_promotion_allowed == true
              and .exact_binary_equivalent == false
              and .global_exact_reproducibility_claimed == false
              and .evidence.semantic_equivalent_v3 == true
              and .evidence.runtime_critical_sections_equal == true
              and .evidence.canonical_nm_equal == true
              and .evidence.canonical_objdump_equal == true
              and .evidence.canonical_readelf_equal == true
              and .evidence.storage_serialization_only == true
              and .evidence.unexpected_allocated_differences == []
              and .evidence.unexpected_section_differences == []
            ' "$SEMANTIC_LOCK/semantic-authority.json" >/dev/null

      - name: Resolve and download exact reconstruction artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/authority-artifact
          mkdir -p work/authority-artifact
          metadata="$RUNNER_TEMP/session-manager-reconstruction-artifact.json"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECONSTRUCTION_ARTIFACT_ID" \
            > "$metadata"

          jq -e \
            --argjson id "$RECONSTRUCTION_ARTIFACT_ID" \
            --arg name "$RECONSTRUCTION_ARTIFACT_NAME" \
            --arg digest "$RECONSTRUCTION_ARTIFACT_DIGEST" \
            --arg run "$RECONSTRUCTION_RUN_ID" \
            --arg head "$RECONSTRUCTION_TRIGGER_SHA" '
              .id == $id
              and .name == $name
              and .digest == $digest
              and .expired == false
              and (.workflow_run.id | tostring) == $run
              and .workflow_run.head_sha == $head
            ' "$metadata" >/dev/null

          gh run download "$RECONSTRUCTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$RECONSTRUCTION_ARTIFACT_NAME" \
            --dir work/authority-artifact

          (
            cd work/authority-artifact
            sha256sum --check --strict LOCKSUMS.sha256
          )

          test "$(sha256sum work/authority-artifact/source-authority/reconstructed-source.tar | awk '{print $1}')" \
            = "$SOURCE_ARCHIVE_SHA256"
          test "$(sha256sum work/authority-artifact/source-authority/hancom-source-reconstruction.patch | awk '{print $1}')" \
            = "$RECONSTRUCTION_PATCH_SHA256"
          test "$(sha256sum work/authority-artifact/downloads/target.deb | awk '{print $1}')" \
            = "$AMD64_TARGET_DEB_SHA256"
          test "$(sha256sum work/authority-artifact/downloads/candidate.deb | awk '{print $1}')" \
            = "$AMD64_RECONSTRUCTED_DEB_SHA256"

          jq -e \
            --arg package "$PACKAGE" \
            --arg version "$VERSION" \
            --arg base_commit "$BASE_COMMIT" \
            --arg base_tree "$BASE_TREE" \
            --arg reconstructed_tree "$RECONSTRUCTED_TREE" \
            --arg patch "$RECONSTRUCTION_PATCH_SHA256" \
            --arg archive "$SOURCE_ARCHIVE_SHA256" '
              .schema == 1
              and .package == $package
              and .version == $version
              and .base_commit_sha == $base_commit
              and .base_tree_sha == $base_tree
              and .reconstructed_tree_sha == $reconstructed_tree
              and .reconstruction_patch_sha256 == $patch
              and .source_archive_sha256 == $archive
            ' work/authority-artifact/source-authority/source-lock.json >/dev/null

          jq -e \
            --arg package "$PACKAGE" \
            --arg version "$VERSION" '
              .schema == 1
              and .package == $package
              and .version == $version
              and .path_set_identical == true
              and .payload_file_count == 10
              and .identical_payload_count == 9
              and .different_payload_count == 1
              and .different_paths == [
                "usr/lib/x86_64-linux-gnu/gooroom-session-manager/gooroom-session-manager"
              ]
            ' work/authority-artifact/comparison/summary.json >/dev/null

      - name: Prepare exact reconstructed source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/native
          mkdir -p work/native/source work/native/build work/native/evidence
          tar -xf work/authority-artifact/source-authority/reconstructed-source.tar \
            -C work/native/source

          test "$(dpkg-parsechangelog -lwork/native/source/debian/changelog -SVersion)" \
            = "$VERSION"
          test -x work/native/source/debian/rules
          cp work/authority-artifact/source-authority/source-lock.json \
            work/native/evidence/reconstruction-source-lock.json
          cp "$SEMANTIC_LOCK/semantic-authority.json" \
            work/native/evidence/semantic-authority.json
          sha256sum work/native/evidence/*.json \
            > work/native/evidence/input-authorities.sha256

      - name: Build reconstructed package natively on ARM64 Bullseye
        id: native_build
        shell: bash
        run: |
          set -Eeuo pipefail
          image="debian:bullseye@$BULLSEYE_BASE_DIGEST"
          docker pull "$image"
          docker image inspect "$image" \
            > work/native/evidence/bullseye-image-inspect.json

          docker run --rm "$image" bash -Eeuo pipefail -c '
            test "$(uname -m)" = aarch64
            test "$(dpkg --print-architecture)" = arm64
          '

          docker run --rm \
            -v "$PWD/work/native:/work" \
            -w /work/source \
            -e VERSION="$VERSION" \
            "$image" \
            bash -Eeuo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              export DEB_BUILD_OPTIONS=nocheck
              export LC_ALL=C.UTF-8

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates debhelper devscripts dpkg-dev \
                equivs fakeroot file git gnupg jq pkg-config

              test "$(uname -m)" = aarch64
              test "$(dpkg --print-architecture)" = arm64
              test "$(dpkg-parsechangelog -SVersion)" = "$VERSION"

              mk-build-deps \
                --install --remove \
                --tool "apt-get -y --no-install-recommends" \
                debian/control

              dpkg-buildpackage -b -uc -us -j2

              cd /work
              package="$(find . -maxdepth 1 -type f \
                -name "gooroom-session-manager_${VERSION}_arm64.deb" \
                -print -quit)"
              test -n "$package"
              test "$(dpkg-deb -f "$package" Package)" \
                = gooroom-session-manager
              test "$(dpkg-deb -f "$package" Version)" = "$VERSION"
              test "$(dpkg-deb -f "$package" Architecture)" = arm64

              cp ./*.deb /work/build/
              dpkg --print-architecture \
                > /work/evidence/container-dpkg-architecture.txt
              uname -m > /work/evidence/container-uname-machine.txt
              dpkg-deb -f "$package" \
                > /work/evidence/native-package-control.txt
            ' 2>&1 | tee work/native/evidence/native-build.log

          package="$(find work/native/build -maxdepth 1 -type f \
            -name "gooroom-session-manager_${VERSION}_arm64.deb" \
            -print -quit)"
          test -n "$package"
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Fail-closed cross-architecture verification
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/native/verification

          python3 arm64/scripts/verify_session_manager_han3u2_native_v1.py \
            --authority-artifact work/authority-artifact \
            --semantic-authority "$SEMANTIC_LOCK/semantic-authority.json" \
            --arm64-deb "${{ steps.native_build.outputs.package }}" \
            --out work/native/verification \
            --reconstruction-run-id "$RECONSTRUCTION_RUN_ID" \
            --reconstruction-artifact-id "$RECONSTRUCTION_ARTIFACT_ID" \
            --reconstruction-artifact-digest "$RECONSTRUCTION_ARTIFACT_DIGEST" \
            --reconstruction-trigger-sha "$RECONSTRUCTION_TRIGGER_SHA" \
            --source-archive-sha256 "$SOURCE_ARCHIVE_SHA256" \
            --native-trigger-sha "$GITHUB_SHA" \
            --bullseye-base-digest "$BULLSEYE_BASE_DIGEST"

          jq -e '
            .status == "ok"
            and .package == "gooroom-session-manager"
            and .version == "0.3.9+grm3u1+han3u2"
            and .architecture == "arm64"
            and .entry_count == 25
            and .file_count == 10
            and .elf_count == 4
            and .x86_elf_count == 0
            and .path_inventory_equal == true
            and .non_elf_payload_equal_after_multiarch_normalization == true
            and .elf_semantics_equal == true
            and .control_semantics_equal == true
            and .source_reconstruction_semantically_verified == true
            and .native_arm64_candidate_verified == true
            and .package_promotion_allowed == true
            and .package_promoted == false
            and .iso_assembly_allowed == false
            and .fail_closed == true
          ' work/native/verification/summary.json >/dev/null

          (
            cd work/native/verification
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )
          jq '.' work/native/verification/summary.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native ARM64 candidate and complete evidence
        id: upload
        if: always() && steps.native_build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-session-manager-han3u2-native-arm64-v1
          path: |
            work/native/build
            work/native/evidence
            work/native/verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Commit compact native candidate authority
        if: steps.verify.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source=work/native/verification
          destination=arm64/locks/gooroom-session-manager-native-arm64-v1/latest
          rm -rf "$destination"
          mkdir -p "$destination"

          for name in \
            summary.json \
            control-comparison.json \
            payload-comparison.json \
            elf-comparison.json \
            source-provenance.json \
            package-sha256.txt
          do
            test -f "$source/$name"
            cp "$source/$name" "$destination/"
          done

          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg semantic_analysis_run_id "$SEMANTIC_ANALYSIS_RUN_ID" \
            --arg reconstruction_run_id "$RECONSTRUCTION_RUN_ID" \
            --arg reconstruction_artifact_id "$RECONSTRUCTION_ARTIFACT_ID" \
            --arg reconstruction_artifact_digest "$RECONSTRUCTION_ARTIFACT_DIGEST" \
            --arg source_archive_sha256 "$SOURCE_ARCHIVE_SHA256" \
            --arg bullseye_base_digest "$BULLSEYE_BASE_DIGEST" '
              {
                schema: 1,
                actions_run_id: $run_id,
                actions_run_attempt: $run_attempt,
                actions_run_url: $run_url,
                triggering_head_sha: $head_sha,
                artifact_id: $artifact_id,
                artifact_digest: $artifact_digest,
                semantic_authority: {
                  analysis_run_id: $semantic_analysis_run_id
                },
                reconstruction_authority: {
                  run_id: $reconstruction_run_id,
                  artifact_id: $reconstruction_artifact_id,
                  artifact_digest: $reconstruction_artifact_digest,
                  source_archive_sha256: $source_archive_sha256
                },
                native_build: {
                  runner: "ubuntu-24.04-arm",
                  bullseye_base_digest: $bullseye_base_digest
                },
                native_arm64_candidate_verified: true,
                package_promotion_allowed: true,
                package_promoted: false,
                iso_assembly_allowed: false,
                fail_closed: true
              }
            ' > "$destination/artifact-lock.json"

          find "$destination" -type f \
            ! -name FILE-INVENTORY.tsv \
            ! -name LOCKSUMS.sha256 \
            -printf '%P\t%s\n' \
            | LC_ALL=C sort > "$destination/FILE-INVENTORY.tsv"

          (
            cd "$destination"
            find . -type f ! -name LOCKSUMS.sha256 -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > LOCKSUMS.sha256
            sha256sum --check --strict LOCKSUMS.sha256
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git diff --cached --check
          git commit -m 'Verify native ARM64 session manager han3u2 candidate'

          for attempt in 1 2 3 4 5 6 7 8; do
            if git fetch --no-tags origin arm64-port \
              && git rebase origin/arm64-port \
              && git push origin HEAD:arm64-port
            then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
