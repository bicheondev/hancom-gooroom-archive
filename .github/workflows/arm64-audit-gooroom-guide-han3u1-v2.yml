name: ARM64 port - audit exact Gooroom guide vendor package history v2

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-audit-gooroom-guide-han3u1-v2.yml'
      - 'arm64/scripts/audit_packaged_payload_against_git.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hancom-gooroom-33-audit-gooroom-guide-han3u1-v2
  cancel-in-progress: true

env:
  VENDOR_BINARY_RUN_ID: '31097604490'
  VENDOR_BINARY_ARTIFACT: hancom-gooroom-3.3-exact-vendor-debs
  TARGET_SOURCE: gooroom-guide
  TARGET_VERSION: 0.5.3+grm3u1+han3u1
  TARGET_ARCHITECTURE: amd64

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact locks and the reusable auditor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install deterministic package and Git inspection tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates dpkg-dev file git jq python3
          python3 -m py_compile arm64/scripts/audit_packaged_payload_against_git.py

      - name: Download the exact vendor DEB artifact and select by control identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/gooroom-guide-audit-v2
          mkdir -p work/gooroom-guide-audit-v2/{download,target,rootfs,control,evidence,git}

          gh run download "$VENDOR_BINARY_RUN_ID" \
            --repo '${{ github.repository }}' \
            --name "$VENDOR_BINARY_ARTIFACT" \
            --dir work/gooroom-guide-audit-v2/download

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('work/gooroom-guide-audit-v2/download')
          matches = []
          inspected = 0
          for path in sorted(root.rglob('*.deb')):
              inspected += 1
              process = subprocess.run(
                  ['dpkg-deb', '-f', str(path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if process.returncode:
                  continue
              fields = {}
              current = None
              for line in process.stdout.splitlines():
                  if line.startswith((' ', '\t')) and current:
                      fields[current] += '\n' + line.strip()
                  elif ':' in line:
                      current, value = line.split(':', 1)
                      fields[current] = value.strip()
              if (
                  fields.get('Package') == os.environ['TARGET_SOURCE']
                  and fields.get('Version') == os.environ['TARGET_VERSION']
                  and fields.get('Architecture') == os.environ['TARGET_ARCHITECTURE']
              ):
                  matches.append({'path': str(path), 'fields': fields})

          evidence = Path('work/gooroom-guide-audit-v2/evidence')
          evidence.mkdir(parents=True, exist_ok=True)
          selection = {
              'schema': 1,
              'artifact_run_id': os.environ['VENDOR_BINARY_RUN_ID'],
              'artifact_name': os.environ['VENDOR_BINARY_ARTIFACT'],
              'inspected_deb_count': inspected,
              'match_count': len(matches),
              'matches': matches,
          }
          (evidence / 'package-selection.json').write_text(
              json.dumps(selection, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(selection, ensure_ascii=False, indent=2))
          if len(matches) != 1:
              raise SystemExit(f'exact package selection is not unique: {len(matches)}')
          PY

          target="$(jq -er '.matches[0].path' \
            work/gooroom-guide-audit-v2/evidence/package-selection.json)"
          record="$(jq -cer \
            --arg package "$TARGET_SOURCE" \
            --arg version "$TARGET_VERSION" \
            --arg architecture "$TARGET_ARCHITECTURE" '
              [.packages[] | select(
                .package == $package
                and .version == $version
                and .architecture == $architecture
                and .status == "verified"
              )]
              | if length == 1 then .[0]
                else error("verified vendor lock is not unique") end
            ' arm64/locks/vendor-binaries/vendor-binary-lock.json)"
          expected_sha="$(jq -er '.actual_sha256' <<<"$record")"
          expected_size="$(jq -er '.actual_size' <<<"$record")"
          expected_filename="$(jq -er '.local_filename' <<<"$record")"
          test "$(basename "$target")" = "$expected_filename"
          test "$(stat -c '%s' "$target")" = "$expected_size"
          printf '%s  %s\n' "$expected_sha" "$target" | sha256sum --check --strict

          cp "$target" work/gooroom-guide-audit-v2/target/
          target_copy="work/gooroom-guide-audit-v2/target/$(basename "$target")"
          sha256sum "$target_copy" > work/gooroom-guide-audit-v2/evidence/target-deb.sha256
          printf '%s\n' "$record" | jq . \
            > work/gooroom-guide-audit-v2/evidence/vendor-binary-lock-record.json
          dpkg-deb -x "$target_copy" work/gooroom-guide-audit-v2/rootfs
          dpkg-deb -e "$target_copy" work/gooroom-guide-audit-v2/control
          dpkg-deb -f "$target_copy" \
            Package Version Architecture Source Installed-Size Depends Recommends \
            > work/gooroom-guide-audit-v2/evidence/control-fields.txt
          rm -rf work/gooroom-guide-audit-v2/download

      - name: Recover packaged changelog and payload type evidence
        shell: bash
        run: |
          set -euxo pipefail
          evidence=work/gooroom-guide-audit-v2/evidence
          rootfs=work/gooroom-guide-audit-v2/rootfs
          find "$rootfs/usr/share/doc" -type f -name 'changelog*.gz' -print0 2>/dev/null \
            | while IFS= read -r -d '' path; do
                name="$(basename "$path" .gz)"
                gzip -cd "$path" > "$evidence/packaged-${name}.txt"
              done
          find "$rootfs/usr/share/doc" -type f -name copyright -print0 2>/dev/null \
            | while IFS= read -r -d '' path; do
                cp "$path" "$evidence/packaged-copyright.txt"
              done
          find "$rootfs" -type f -print0 | sort -z | xargs -0 file \
            > "$evidence/file-report.txt"
          grep -E 'ELF|PE32|Mach-O' "$evidence/file-report.txt" \
            > "$evidence/native-payload-report.txt" || true

      - name: Mirror every plausible public source history
        shell: bash
        run: |
          set -euxo pipefail
          clone_root=work/gooroom-guide-audit-v2/git
          while IFS='|' read -r key url; do
            set +e
            git clone --mirror "$url" "$clone_root/$key.git" \
              > "$clone_root/$key.clone.stdout" \
              2> "$clone_root/$key.clone.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$clone_root/$key.clone.exit-code"
            if [ "$rc" -ne 0 ]; then
              rm -rf "$clone_root/$key.git"
            fi
          done <<'EOF'
          hancomgooroom|https://github.com/hancomgooroom/gooroom-guide.git
          hancom-io|https://github.com/hancom-io/gooroom-guide.git
          gooroom|https://github.com/gooroom/gooroom-guide.git
          EOF

      - name: Correlate package payload, changelog IDs, refs, and all Git blobs
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/audit_packaged_payload_against_git.py \
            --rootfs work/gooroom-guide-audit-v2/rootfs \
            --control work/gooroom-guide-audit-v2/control \
            --evidence work/gooroom-guide-audit-v2/evidence \
            --git-root work/gooroom-guide-audit-v2/git \
            --source "$TARGET_SOURCE" \
            --version "$TARGET_VERSION"
          jq -e \
            --arg source "$TARGET_SOURCE" \
            --arg version "$TARGET_VERSION" \
            --arg architecture "$TARGET_ARCHITECTURE" '
              .source == $source
              and .source_version == $version
              and .package == $source
              and .package_version == $version
              and .architecture == $architecture
              and (.repositories_cloned | length) > 0
            ' work/gooroom-guide-audit-v2/evidence/summary.json >/dev/null

      - name: Seal and upload the complete compact audit
        shell: bash
        run: |
          set -euxo pipefail
          evidence=work/gooroom-guide-audit-v2/evidence
          find "$evidence" -type f ! -name LOCKSUMS.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > "$evidence/LOCKSUMS.sha256"
          (
            cd "$evidence"
            sha256sum --check LOCKSUMS.sha256
          )

      - name: Upload exact package history evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gooroom-guide-0.5.3-grm3u1-han3u1-payload-audit-v2
          path: work/gooroom-guide-audit-v2/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Commit immutable current audit evidence
        shell: bash
        run: |
          set -euxo pipefail
          destination=arm64/locks/gooroom-guide-han3u1-audit/latest
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -a work/gooroom-guide-audit-v2/evidence/. "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Audit exact Gooroom guide vendor package history'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
