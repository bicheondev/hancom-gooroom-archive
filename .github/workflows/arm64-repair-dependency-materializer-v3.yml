name: ARM64 port - repair dependency materializer v3 schema

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-repair-dependency-materializer-v3.yml'
      - 'arm64/scripts/repair_dependency_materializer_v3.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hancom-gooroom-33-repair-dependency-materializer-v3
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the port branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arm64-port
          fetch-depth: 0

      - name: Install the dual-compatible summary schema
        shell: bash
        run: |
          set -euxo pipefail
          python3 arm64/scripts/repair_dependency_materializer_v3.py \
            --target arm64/scripts/materialize_rebuild_dependency_repo_v3.py
          python3 -m py_compile \
            arm64/scripts/repair_dependency_materializer_v3.py \
            arm64/scripts/materialize_rebuild_dependency_repo_v3.py
          grep -Fq '"summary": summary' \
            arm64/scripts/materialize_rebuild_dependency_repo_v3.py
          grep -Fq '"packages": package_rows' \
            arm64/scripts/materialize_rebuild_dependency_repo_v3.py

      - name: Commit the compatible dependency materializer
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm64/scripts/materialize_rebuild_dependency_repo_v3.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Make dependency materializer v3 selector-compatible'
          for attempt in 1 2 3 4; do
            git pull --rebase origin arm64-port
            if git push origin HEAD:arm64-port; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
