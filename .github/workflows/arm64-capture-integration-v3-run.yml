name: ARM64 capture integration reconstruction v3 run

on:
  push:
    branches: [arm64-port]
    paths:
      - '.github/workflows/arm64-capture-integration-v3-run.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: arm64-port, fetch-depth: 0}
      - env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          workflow=arm64-analyze-integration-applet-han3u3-reconstruction-v3.yml
          trigger=299b28c5f2809ad704d110d0b5e689e1760ef648
          run_id=''
          for i in $(seq 1 60); do
            run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=arm64-port&per_page=20" | jq -r --arg sha "$trigger" '[.workflow_runs[]|select(.head_sha==$sha)]|last|.id//empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 15 || true
          out=arm64/status/integration-reconstruction-v3
          mkdir -p "$out"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,createdAt,updatedAt,headSha,event > "$out/latest.json"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out/latest.json"; git commit -m 'Record integration reconstruction v3 run' || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin arm64-port; if git push origin HEAD:arm64-port; then exit 0; fi; sleep $((i*2)); done
          exit 1
