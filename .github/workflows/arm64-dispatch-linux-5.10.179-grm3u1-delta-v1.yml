name: ARM64 dispatch linux 5.10.179 grm3u1 delta v1

'on':
  workflow_dispatch:
  push:
    branches:
      - arm64-port
    paths:
      - '.github/workflows/arm64-dispatch-linux-5.10.179-grm3u1-delta-v1.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: arm64-dispatch-linux-5.10.179-grm3u1-delta-v1
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch exact kernel delta analysis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/arm64-analyze-linux-5.10.179-grm3u1-delta-v1.yml/dispatches" \
            -f ref=arm64-port
